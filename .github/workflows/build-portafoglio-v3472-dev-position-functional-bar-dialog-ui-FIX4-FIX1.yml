name: Build Portafoglio 2026 V3.4.72 DEV Position Functional Bar & Dialog UI FIX4 FIX1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX4-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX4.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX3.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui.yml"
      - ".github/workflows/build-portafoglio-v3471-dev-instrument-lifecycle-acc-div.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX4.yml"
      - ".github/workflows/build-portafoglio-v3464-dev-global-cash-position-safety-FIX2.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.72 FIX2 source chain
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os
          import subprocess

          workflow_path = Path('.github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX2.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing previous workflow: {workflow_path}')

          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          parsed = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if not line.startswith('      - name: '):
                  i += 1
                  continue

              name = line[len('      - name: '):].strip()
              j = i + 1
              script = None
              while j < len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j] == '        run: |':
                      k = j + 1
                      block = []
                      while k < len(lines):
                          raw = lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k += 1
                              continue
                          if raw.strip() == '':
                              block.append('')
                              k += 1
                              continue
                          # A new step-level YAML key after run: ends the shell block.
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k += 1
                      script = '\n'.join(block) + '\n'
                      break
                  j += 1
              if script is not None:
                  parsed.append((name, script))
              i = j if j > i else i + 1

          start_name = 'Extract V3.4.44 source'
          end_name = 'Verify V3.4.72 FIX2 synchronized filters and all safety regressions'
          started = False
          reached_end = False
          executed = 0

          for name, script in parsed:
              if name == start_name:
                  started = True
              if not started:
                  continue

              print(f'\\n===== Replaying FIX2 step: {name} =====')
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', script],
                  check=True,
                  env=os.environ.copy(),
              )
              executed += 1

              if name == end_name:
                  reached_end = True
                  break

          if not started:
              raise RuntimeError(f'Could not find replay start step: {start_name}')
          if not reached_end:
              raise RuntimeError(f'Could not find replay end step: {end_name}')
          if executed < 10:
              raise RuntimeError(f'Unexpectedly short FIX2 replay: only {executed} run steps')

          print(f'Exact V3.4.72 FIX2 source chain replayed successfully ({executed} run steps)')
          PYREPLAY

      - name: Patch V3.4.72 FIX3 compile-safe default position category
        shell: bash
        run: |
          python3 - <<'PY3472FIX3'
          from pathlib import Path

          root = Path('android-project-v3460')
          main_path = root / 'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path = root / 'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path = root / 'app/build.gradle'

          main = main_path.read_text(encoding='utf-8')
          db = db_path.read_text(encoding='utf-8')
          gradle = gradle_path.read_text(encoding='utf-8')

          if 'versionCode 119' not in gradle:
              raise RuntimeError('V3.4.72 FIX2 versionCode missing')
          if 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix2"' not in gradle:
              raise RuntimeError('V3.4.72 FIX2 versionName missing')
          if 'DEV 3.4.72 FIX2' not in main:
              raise RuntimeError('V3.4.72 FIX2 DEV label missing')

          gradle = gradle.replace('versionCode 119', 'versionCode 120', 1)
          gradle = gradle.replace(
              'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix2"',
              'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix3"',
              1,
          )
          main = main.replace('DEV 3.4.72 FIX2', 'DEV 3.4.72 FIX3', 1)

          def matching_brace(text, open_pos):
              depth = 0
              i = open_pos
              in_str = in_char = in_line = in_block = False
              esc = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if in_line:
                      if c == '\n':
                          in_line = False
                      i += 1
                      continue
                  if in_block:
                      if c == '*' and n == '/':
                          in_block = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if in_str:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == '"':
                          in_str = False
                      i += 1
                      continue
                  if in_char:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue
                  if c == '/' and n == '/':
                      in_line = True
                      i += 2
                      continue
                  if c == '/' and n == '*':
                      in_block = True
                      i += 2
                      continue
                  if c == '"':
                      in_str = True
                      i += 1
                      continue
                  if c == "'":
                      in_char = True
                      i += 1
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError('Unbalanced Java braces')

          sig = '    void showPositionsList('
          p = main.find(sig)
          if p < 0:
              raise RuntimeError('showPositionsList missing')
          o = main.find('{', p)
          if o < 0:
              raise RuntimeError('showPositionsList body missing')
          c = matching_brace(main, o)
          segment = main[p:c + 1]

          bad = 'positionCategoryV3472Fix2=(category==null||category.trim().isEmpty())?"Tutti":category.trim();'
          if bad not in segment:
              raise RuntimeError('FIX2 compile-error line not found inside showPositionsList')

          good = 'positionCategoryV3472Fix2="Tutti"; // V3472_FIX3_DEFAULT_CATEGORY_COMPILE_FIX'
          segment = segment.replace(bad, good, 1)
          main = main[:p] + segment + main[c + 1:]

          main_path.write_text(main, encoding='utf-8')
          db_path.write_text(db, encoding='utf-8')
          gradle_path.write_text(gradle, encoding='utf-8')
          print('V3.4.72 FIX3 compile-safe showPositionsList default-category patch applied')
          PY3472FIX3

      - name: Verify V3.4.72 FIX3 compile fix and all safety regressions
        shell: bash
        run: |
          python3 - <<'PY3472FIX3CHECK'
          from pathlib import Path
          import re

          root = Path('android-project-v3460')
          s = (root / 'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d = (root / 'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g = (root / 'app/build.gradle').read_text(encoding='utf-8')
          compact = lambda x: re.sub(r'\s+', '', x)

          assert 'versionCode 120' in g
          assert 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix3"' in g
          assert 'DEV 3.4.72 FIX3' in s
          assert re.search(r'DB_VERSION\s*=\s*18', d)

          # FIX3 compile regression: showPositionsList has no local "category" variable.
          m = re.search(r'void\s+showPositionsList\s*\([^)]*\)\s*\{', s)
          assert m, 'showPositionsList declaration missing'

          def matching_brace(text, open_pos):
              depth = 0
              i = open_pos
              in_str = in_char = in_line = in_block = False
              esc = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if in_line:
                      if c == '\n': in_line = False
                      i += 1; continue
                  if in_block:
                      if c == '*' and n == '/': in_block = False; i += 2; continue
                      i += 1; continue
                  if in_str:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == '"': in_str = False
                      i += 1; continue
                  if in_char:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == "'": in_char = False
                      i += 1; continue
                  if c == '/' and n == '/': in_line = True; i += 2; continue
                  if c == '/' and n == '*': in_block = True; i += 2; continue
                  if c == '"': in_str = True; i += 1; continue
                  if c == "'": in_char = True; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              raise AssertionError('Unbalanced showPositionsList braces')

          open_pos = s.find('{', m.start())
          close_pos = matching_brace(s, open_pos)
          show_list = s[m.start():close_pos + 1]
          bad = 'positionCategoryV3472Fix2=(category==null||category.trim().isEmpty())?"Tutti":category.trim();'
          assert bad not in show_list
          assert 'positionCategoryV3472Fix2="Tutti"; // V3472_FIX3_DEFAULT_CATEGORY_COMPILE_FIX' in show_list
          assert 'schedulePositionFilterBindingsV3472Fix2();' in show_list

          for marker in [
              'positionCategoryV3472Fix2="Tutti"',
              'positionStateV3472Fix2="Aperte"',
              'syncPositionFilterStateV3472Fix2(category,state,order,query)',
              'applyPositionFilterBindingsV3472Fix2',
              'schedulePositionFilterBindingsV3472Fix2',
              'showPositionsListFiltered(target,positionStateV3472Fix2,positionOrderV3472Fix2,positionQueryV3472Fix2)',
              'showPositionsListFiltered(positionCategoryV3472Fix2,"Aperte",positionOrderV3472Fix2,positionQueryV3472Fix2)',
              'showPositionsListFiltered(positionCategoryV3472Fix2,"Chiuse",positionOrderV3472Fix2,positionQueryV3472Fix2)',
              'stylePositionCategoryV3472(b,cat.equals(positionCategoryV3472Fix2))',
          ]:
              assert marker in s, marker

          for marker in [
              'closedPurchaseDateDialogV3472Fix1',
              'Inserisci data acquisto',
              'updateLatestClosedPurchaseDateV3472Fix1',
              'latestClosedSaleDateV3472Fix1',
          ]:
              assert marker in s or marker in d, marker

          for marker in [
              'V3472_FUNCTIONAL_BAR',
              'Tipologia ETF • ACC / DIV',
              'Data acquisto *',
              'Data scadenza certificato (facoltativa)',
              'new String[]{"Vendita","Richiamo","Scadenza"}',
          ]:
              assert marker in s, marker

          for marker in [
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'FIX2 imposta plusvalenza riparata',
              'Imposta su plusvalenza non valida: supera la plusvalenza lorda',
              'semanticSpanV3470Fix3(sp,amount.start(1),amount.end(),C_RED)',
          ]:
              assert marker in s, marker

          assert '"IMPOSTA","Imposta su plusvalenza",safeCapitalGainTax' in d
          assert 'safeCapitalGainTax>Math.max(0,plGross)+0.01' in compact(d)

          for marker in [
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'applyHistoricalUiSafetyV3462',
          ]:
              assert marker in s, marker

          assert re.search(r'cv\.put\(\s*"price"\s*,\s*baseline\s*\[\s*i\s*\]\s*\)', s)
          assert re.search(r'current_value\s*=\s*quantity\s*\*\s*price', s)
          assert 'UPDATEportfolio_statusSETcash=0,total_value=COALESCE(invested,0)' in compact(s)

          m1 = re.search(r'void\s+repairTradeRepublicPlaceholderPricesV3464\s*\(\s*\)\s*\{', s)
          assert m1
          m2 = re.search(r'void\s+applyDashboardCashUiV3464\s*\(\s*\)\s*\{', s[m1.end():])
          assert m2
          repair = s[m1.start():m1.end() + m2.start()]
          rc = compact(repair)
          assert 'cv.put("quantity"' not in rc
          assert 'cv.put("pmc"' not in rc

          print('V3.4.72 FIX3 compile fix + synchronized filters + all safety regressions OK')
          PY3472FIX3CHECK

      - name: Patch V3.4.72 FIX4 native category single source of truth
        shell: bash
        run: |
          python3 - <<'PY3472FIX4'
          from pathlib import Path
          import re

          root = Path('android-project-v3460')
          main_path = root / 'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path = root / 'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path = root / 'app/build.gradle'

          main = main_path.read_text(encoding='utf-8')
          db = db_path.read_text(encoding='utf-8')
          gradle = gradle_path.read_text(encoding='utf-8')

          if 'versionCode 120' not in gradle:
              raise RuntimeError('V3.4.72 FIX3 versionCode missing')
          if 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix3"' not in gradle:
              raise RuntimeError('V3.4.72 FIX3 versionName missing')
          if 'DEV 3.4.72 FIX3' not in main:
              raise RuntimeError('V3.4.72 FIX3 DEV label missing')

          gradle = gradle.replace('versionCode 120', 'versionCode 121', 1)
          gradle = gradle.replace(
              'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix3"',
              'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix4"',
              1,
          )
          main = main.replace('DEV 3.4.72 FIX3', 'DEV 3.4.72 FIX4', 1)

          # FIX4 root cause: FIX2 introduced a second category state for the UI,
          # while the native list renderer still uses MainActivity.positionCategory.
          # Synchronize the native state at the very start of every filtered render.
          old_sync = 'positionCategoryV3472Fix2=(category==null||category.trim().isEmpty())?"Tutti":category.trim();'
          new_sync = old_sync + '\n        positionCategory=positionCategoryV3472Fix2; // V3472_FIX4_NATIVE_CATEGORY_SYNC'
          if old_sync not in main:
              raise RuntimeError('FIX2 category sync assignment missing')
          if 'V3472_FIX4_NATIVE_CATEGORY_SYNC' not in main:
              main = main.replace(old_sync, new_sync, 1)

          # Also write both states on a category tap before rendering. This removes
          # the one-click-behind / stale-category window for all six categories.
          old_click = 'positionCategoryV3472Fix2=target;showPositionsListFiltered(target,positionStateV3472Fix2,positionOrderV3472Fix2,positionQueryV3472Fix2);'
          new_click = 'positionCategoryV3472Fix2=target;positionCategory=target;showPositionsListFiltered(target,positionStateV3472Fix2,positionOrderV3472Fix2,positionQueryV3472Fix2);'
          if old_click not in main:
              raise RuntimeError('FIX2 category click binding missing')
          main = main.replace(old_click, new_click, 1)

          # Make the visual selected category use the same native state after redraw.
          old_style = 'stylePositionCategoryV3472(b,cat.equals(positionCategoryV3472Fix2));'
          new_style = 'stylePositionCategoryV3472(b,cat.equals(positionCategory)); // V3472_FIX4_CANONICAL_CATEGORY_STYLE'
          if old_style not in main:
              raise RuntimeError('FIX2 category style binding missing')
          main = main.replace(old_style, new_style, 1)

          main_path.write_text(main, encoding='utf-8')
          db_path.write_text(db, encoding='utf-8')
          gradle_path.write_text(gradle, encoding='utf-8')
          print('V3.4.72 FIX4 native category single-source-of-truth patch applied')
          PY3472FIX4

      - name: Verify V3.4.72 FIX4 all category buttons and safety regressions
        shell: bash
        run: |
          python3 - <<'PY3472FIX4CHECK'
          from pathlib import Path
          import re

          root = Path('android-project-v3460')
          s = (root / 'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d = (root / 'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g = (root / 'app/build.gradle').read_text(encoding='utf-8')
          compact = lambda x: re.sub(r'\s+', '', x)

          assert 'versionCode 121' in g
          assert 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix4"' in g
          assert 'DEV 3.4.72 FIX4' in s
          assert re.search(r'DB_VERSION\s*=\s*18', d)

          # Native category and FIX2 UI category must be synchronized before the
          # renderer uses them. This is the actual regression behind the screenshots.
          sync_marker = 'positionCategory=positionCategoryV3472Fix2; // V3472_FIX4_NATIVE_CATEGORY_SYNC'
          assert sync_marker in s
          assert 'positionCategoryV3472Fix2=target;positionCategory=target;showPositionsListFiltered(target,positionStateV3472Fix2,positionOrderV3472Fix2,positionQueryV3472Fix2);' in s
          assert 'stylePositionCategoryV3472(b,cat.equals(positionCategory)); // V3472_FIX4_CANONICAL_CATEGORY_STYLE' in s

          m = re.search(r'void\s+showPositionsListFiltered\s*\([^)]*\)\s*\{', s)
          assert m, 'showPositionsListFiltered declaration missing'
          start = m.end()
          prefix = s[start:start+900]
          assert 'syncPositionFilterStateV3472Fix2(category,state,order,query);' in prefix

          sm = re.search(r'void\s+syncPositionFilterStateV3472Fix2\s*\([^)]*\)\s*\{', s)
          assert sm, 'syncPositionFilterStateV3472Fix2 missing'
          sync_body = s[sm.start():s.find('}', sm.end())+1]
          assert 'positionCategoryV3472Fix2=' in sync_body
          assert sync_marker in sync_body

          # All six category labels remain present and use one shared binding path.
          for cat in ['Tutti','Azioni','ETF','ETP','Certificati','Altro']:
              assert ('"'+cat+'"') in s, cat
          assert 'String[] cats={"Tutti","Azioni","ETF","ETP","Certificati","Altro"};' in s

          # Functional state remains independent.
          assert 'positionStateV3472Fix2="Aperte"' in s
          assert 'showPositionsListFiltered(positionCategoryV3472Fix2,"Aperte",positionOrderV3472Fix2,positionQueryV3472Fix2)' in s
          assert 'showPositionsListFiltered(positionCategoryV3472Fix2,"Chiuse",positionOrderV3472Fix2,positionQueryV3472Fix2)' in s

          # FIX1 / lifecycle / accounting safeguards remain intact.
          for marker in [
              'closedPurchaseDateDialogV3472Fix1',
              'Inserisci data acquisto',
              'updateLatestClosedPurchaseDateV3472Fix1',
              'latestClosedSaleDateV3472Fix1',
              'V3472_FUNCTIONAL_BAR',
              'Tipologia ETF • ACC / DIV',
              'Data acquisto *',
              'Data scadenza certificato (facoltativa)',
              'new String[]{"Vendita","Richiamo","Scadenza"}',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'FIX2 imposta plusvalenza riparata',
              'Imposta su plusvalenza non valida: supera la plusvalenza lorda',
              'semanticSpanV3470Fix3(sp,amount.start(1),amount.end(),C_RED)',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'applyHistoricalUiSafetyV3462',
          ]:
              assert marker in s or marker in d, marker

          assert '"IMPOSTA","Imposta su plusvalenza",safeCapitalGainTax' in d
          assert 'safeCapitalGainTax>Math.max(0,plGross)+0.01' in compact(d)
          assert re.search(r'cv\.put\(\s*"price"\s*,\s*baseline\s*\[\s*i\s*\]\s*\)', s)
          assert re.search(r'current_value\s*=\s*quantity\s*\*\s*price', s)
          assert 'UPDATEportfolio_statusSETcash=0,total_value=COALESCE(invested,0)' in compact(s)

          m1 = re.search(r'void\s+repairTradeRepublicPlaceholderPricesV3464\s*\(\s*\)\s*\{', s)
          assert m1
          m2 = re.search(r'void\s+applyDashboardCashUiV3464\s*\(\s*\)\s*\{', s[m1.end():])
          assert m2
          repair = s[m1.start():m1.end()+m2.start()]
          rc = compact(repair)
          assert 'cv.put("quantity"' not in rc
          assert 'cv.put("pmc"' not in rc

          print('V3.4.72 FIX4 verified: native/UI category synchronized for all six buttons; safety regressions intact')
          PY3472FIX4CHECK

      - name: Patch V3.4.72 FIX4 FIX1 compile-safe canonical category style
        shell: bash
        run: |
          python3 - <<'PY3472FIX4FIX1'
          from pathlib import Path

          root = Path('android-project-v3460')
          main_path = root / 'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          gradle_path = root / 'app/build.gradle'
          main = main_path.read_text(encoding='utf-8')
          gradle = gradle_path.read_text(encoding='utf-8')

          if 'versionCode 121' not in gradle:
              raise RuntimeError('V3.4.72 FIX4 versionCode missing')
          if 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix4"' not in gradle:
              raise RuntimeError('V3.4.72 FIX4 versionName missing')
          if 'DEV 3.4.72 FIX4' not in main:
              raise RuntimeError('V3.4.72 FIX4 DEV label missing')

          # FIX4 used a // marker inside a one-line if block. That comment swallowed
          # the closing brace on the same line, causing javac "illegal start of expression".
          bad = 'stylePositionCategoryV3472(b,cat.equals(positionCategory)); // V3472_FIX4_CANONICAL_CATEGORY_STYLE'
          good = 'stylePositionCategoryV3472(b,cat.equals(positionCategory)); /* V3472_FIX4_CANONICAL_CATEGORY_STYLE */'
          if bad not in main:
              raise RuntimeError('FIX4 line-comment compile defect not found')
          main = main.replace(bad, good, 1)

          gradle = gradle.replace('versionCode 121', 'versionCode 122', 1)
          gradle = gradle.replace(
              'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix4"',
              'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix4-fix1"',
              1,
          )
          main = main.replace('DEV 3.4.72 FIX4', 'DEV 3.4.72 FIX4 FIX1', 1)

          main_path.write_text(main, encoding='utf-8')
          gradle_path.write_text(gradle, encoding='utf-8')
          print('V3.4.72 FIX4 FIX1 compile-safe canonical category style applied')
          PY3472FIX4FIX1

      - name: Verify V3.4.72 FIX4 FIX1 compile structure and safety regressions
        shell: bash
        run: |
          python3 - <<'PY3472FIX4FIX1CHECK'
          from pathlib import Path
          import re

          root = Path('android-project-v3460')
          s = (root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d = (root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g = (root/'app/build.gradle').read_text(encoding='utf-8')
          compact=lambda x:re.sub(r'\s+','',x)

          assert 'versionCode 122' in g
          assert 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix4-fix1"' in g
          assert 'DEV 3.4.72 FIX4 FIX1' in s
          assert re.search(r'DB_VERSION\s*=\s*18', d)

          assert '// V3472_FIX4_CANONICAL_CATEGORY_STYLE' not in s
          assert 'stylePositionCategoryV3472(b,cat.equals(positionCategory)); /* V3472_FIX4_CANONICAL_CATEGORY_STYLE */' in s
          assert 'positionCategory=positionCategoryV3472Fix2; // V3472_FIX4_NATIVE_CATEGORY_SYNC' in s
          assert 'positionCategoryV3472Fix2=target;positionCategory=target;showPositionsListFiltered(target,positionStateV3472Fix2,positionOrderV3472Fix2,positionQueryV3472Fix2);' in s

          # Prove helper method braces are structurally balanced after the repaired one-line if.
          def matching_brace(text, open_pos):
              depth=0;i=open_pos;ins=inc=lin=blk=False;esc=False
              while i<len(text):
                  c=text[i];n=text[i+1] if i+1<len(text) else ''
                  if lin:
                      if c=='\n': lin=False
                      i+=1;continue
                  if blk:
                      if c=='*' and n=='/': blk=False;i+=2;continue
                      i+=1;continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1;continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1;continue
                  if c=='/' and n=='/': lin=True;i+=2;continue
                  if c=='/' and n=='*': blk=True;i+=2;continue
                  if c=='"': ins=True;i+=1;continue
                  if c=="'": inc=True;i+=1;continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: return i
                  i+=1
              raise AssertionError('unbalanced Java braces')

          m=re.search(r'void\s+applyPositionFilterBindingsV3472Fix2\s*\(\s*\)\s*\{',s)
          assert m
          close=matching_brace(s,s.find('{',m.start()))
          helper=s[m.start():close+1]
          assert 'String[] cats={"Tutti","Azioni","ETF","ETP","Certificati","Altro"};' in helper
          assert 'stylePositionCategoryV3472(b,cat.equals(positionCategory));' in helper
          tail=s[close+1:close+500]
          assert re.search(r'void\s+schedulePositionFilterBindingsV3472Fix2\s*\(',tail)

          for marker in ['closedPurchaseDateDialogV3472Fix1','Tipologia ETF • ACC / DIV','repairInvalidCapitalGainTaxesV3470Fix2','positions_archive_before_delete_v3464','positions_block_tr_placeholder14_v3464','repairTradeRepublicPlaceholderPricesV3464','applyHistoricalUiSafetyV3462']:
              assert marker in s or marker in d, marker
          assert re.search(r'cv\.put\(\s*"price"\s*,\s*baseline\s*\[\s*i\s*\]\s*\)',s)
          assert re.search(r'current_value\s*=\s*quantity\s*\*\s*price',s)
          assert 'UPDATEportfolio_statusSETcash=0,total_value=COALESCE(invested,0)' in compact(s)
          m1=re.search(r'void\s+repairTradeRepublicPlaceholderPricesV3464\s*\(\s*\)\s*\{',s); assert m1
          m2=re.search(r'void\s+applyDashboardCashUiV3464\s*\(\s*\)\s*\{',s[m1.end():]); assert m2
          repair=s[m1.start():m1.end()+m2.start()];rc=compact(repair)
          assert 'cv.put("quantity"' not in rc and 'cv.put("pmc"' not in rc
          print('V3.4.72 FIX4 FIX1 compile structure + category sync + safety regressions OK')
          PY3472FIX4FIX1CHECK

