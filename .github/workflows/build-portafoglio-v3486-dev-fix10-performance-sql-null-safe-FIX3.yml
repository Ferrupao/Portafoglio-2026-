name: Build Portafoglio 2026 V3.4.86 FIX10 FIX3 Performance SQL Null Safe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-performance-sql-null-safe-FIX3.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-performance-safe-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-deterministic-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix9-performance-colors-stability.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.86 FIX10 FIX2 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-performance-safe-FIX2.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX10 FIX2 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                          continue
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact V3.4.86 FIX10 FIX1 source',
              'Patch V3.4.86 FIX10 FIX2 Performance Safe'
          ]
          for target in wanted:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('FIX10 FIX2 reconstructed')
          PYREPLAY

      - name: Patch V3.4.86 FIX10 FIX3 Performance SQL Null Safe
        shell: bash
        run: |
          python3 - <<'PYFIX3'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          db=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 151' in gradle,'FIX10 FIX2 versionCode')
          req('versionName "3.4.86-dev-fix10-fix2-performance-safe"' in gradle,'FIX10 FIX2 versionName')
          req('DEV 3.4.86 FIX10 FIX2 PERF SAFE' in main,'FIX10 FIX2 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',db) is not None,'DB18')

          gradle=gradle.replace('versionCode 151','versionCode 152',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix2-performance-safe"',
              'versionName "3.4.86-dev-fix10-fix3-performance-sql-null-safe"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX2 PERF SAFE',
              'DEV 3.4.86 FIX10 FIX3 SQL NULL SAFE'
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          sig='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          p=main.find(sig)
          req(p>=0,'performanceCostsForPeriod found')
          o=main.find('{',p)
          c=matching_brace(main,o)
          body=main[p:c+1]

          # Regression introduced when FIX8 replaced this method:
          # brokerFilter() returns null for aggregate "Totale".
          # A null broker must therefore mean aggregate and must NOT be bound to broker=?.
          old='boolean total=TOTAL.equals(broker);'
          new='boolean total=(broker==null)||TOTAL.equals(broker);'
          req(old in body,'regressed null-unsafe aggregate test found')
          body=body.replace(old,new,1)

          req(
              'String bwhere=total?"broker IN (SELECT name FROM portfolios WHERE active=1)":"broker=?";' in body,
              'aggregate SQL branch preserved'
          )
          req(
              'String[] bargs=total?new String[]{}:new String[]{broker};' in body,
              'aggregate zero-bind-args branch preserved'
          )

          main=main[:p]+body+main[c+1:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX10 FIX3 applied: null broker is aggregate Totale; no null SQLite bind')
          PYFIX3

      - name: Verify V3.4.86 FIX10 FIX3
        shell: bash
        run: |
          python3 - <<'PYCHECK3'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          req('versionCode 152' in g,'versionCode 152')
          req('versionName "3.4.86-dev-fix10-fix3-performance-sql-null-safe"' in g,'FIX10 FIX3 version')
          req('DEV 3.4.86 FIX10 FIX3 SQL NULL SAFE' in s,'visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          sig='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          p=s.find(sig)
          req(p>=0,'performanceCostsForPeriod preserved')
          o=s.find('{',p)
          c=matching_brace(s,o)
          body=s[p:c+1]

          req(
              'boolean total=(broker==null)||TOTAL.equals(broker);' in body,
              'null broker treated as aggregate Totale'
          )
          req(
              'boolean total=TOTAL.equals(broker);' not in body,
              'null-unsafe aggregate test removed'
          )
          req(
              'String bwhere=total?"broker IN (SELECT name FROM portfolios WHERE active=1)":"broker=?";' in body,
              'aggregate SQL uses active portfolios'
          )
          req(
              'String[] bargs=total?new String[]{}:new String[]{broker};' in body,
              'aggregate SQL has zero bind args'
          )

          # Preserve FIX2 stability and FIX10 deterministic colors.
          req('double semanticLineNumberV3490(String raw)' in s,'deterministic color extractor preserved')
          req('double n=semanticLineNumberV3490(s);' in s,'deterministic formatter preserved')
          req('double n=parseSemanticNumberV3483(s);' not in s,'broken whole-row parse remains removed')
          req('void scheduleGlobalSemanticColorsV3483()' in s,'stable delayed color scheduler preserved')
          req('content.postDelayed(new Runnable()' in s,'delayed color pass preserved')

          # Performance summary remains free from the immediate recursive pass removed by FIX2.
          ps='void addPerformanceCostsSummary(double gross,double costs,boolean incomplete)'
          pp=s.find(ps)
          req(pp>=0,'Performance summary preserved')
          po=s.find('{',pp)
          pc=matching_brace(s,po)
          perf=s[pp:pc+1]
          req('applyGlobalSemanticColorsV3483(c);' not in perf,'FIX2 Performance immediate rescan stays removed')

          for marker in [
              '"Q.tà "+quantityItV3470(r.qty)',
              'decimalInputItV3470(r.pmc)+" €"',
              'decimalInputItV3470(r.price)+" €"',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462',
              'Performance = proventi lordi + P/L realizzato lordo.'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('FIX10 FIX3 verified: exact Performance crash root cause fixed')
          PYCHECK3

      - name: Build signed V3.4.86 FIX10 FIX3 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.86 FIX10 FIX3 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX10 FIX3 signed APK verified"

      - name: Upload signed V3.4.86 FIX10 FIX3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX3-PERFORMANCE-SQL-NULL-SAFE-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
