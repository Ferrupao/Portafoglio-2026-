name: Build Portafoglio 2026 V3.4.57 BETA 1 Friends Separate Clean

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3457-beta1-friends-separate-clean.yml"
      - ".github/workflows/build-portafoglio-v3456-full-bold-readability.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Extract V3.4.44 source
        run: |
          rm -rf android-project-v3456
          mkdir android-project-v3456
          unzip -q "portafoglio-v3444-dev.zip" -d android-project-v3456

      - name: Reuse proven V3.4.56 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/build-portafoglio-v3456-full-bold-readability.yml').read_text(encoding='utf-8')
          start_marker = "          cat > /tmp/make_v3456.py <<'PY'\n"
          end_marker = "\n          PY\n          python3 /tmp/make_v3456.py"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/make_v3456.py').write_text(script, encoding='utf-8')
          print('Extracted proven V3.4.56 patch script')
          PY
          python3 /tmp/make_v3456.py

      - name: Patch BETA 1 separate clean identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('android-project-v3456')
          gradle_path = root / 'app/build.gradle'
          main_path = root / 'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path = root / 'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          manifest_path = root / 'app/src/main/AndroidManifest.xml'

          gradle = gradle_path.read_text(encoding='utf-8')
          main = main_path.read_text(encoding='utf-8')
          db = db_path.read_text(encoding='utf-8')
          manifest = manifest_path.read_text(encoding='utf-8')

          assert 'applicationId "it.portafoglio2026.v32"' in gradle
          assert 'versionCode 98' in gradle
          assert 'versionName "3.4.56-dev-full-bold-readability"' in gradle
          assert 'DEV 3.4.56' in main
          assert 'DB_VERSION = 17' in db

          # Separate Android application: it can live next to the DEV build.
          # A different applicationId means a different private data directory,
          # so no DEV database, preferences or financial amounts are inherited.
          gradle = gradle.replace(
              'applicationId "it.portafoglio2026.v32"',
              'applicationId "it.portafoglio2026.v32.beta"',
              1
          )
          gradle = gradle.replace('versionCode 98', 'versionCode 99', 1)
          gradle = gradle.replace(
              'versionName "3.4.56-dev-full-bold-readability"',
              'versionName "3.4.57-beta1-friends-separate-clean"',
              1
          )

          main = main.replace('DEV 3.4.56', 'BETA 1 • 3.4.57')

          # Make the launcher name unmistakably different from the DEV app.
          if re.search(r'android:label="[^"]*"', manifest):
              manifest = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="Portafoglio 2026 BETA"',
                  manifest,
                  count=1
              )
          else:
              manifest = manifest.replace(
                  '<application',
                  '<application android:label="Portafoglio 2026 BETA"',
                  1
              )

          gradle_path.write_text(gradle, encoding='utf-8')
          main_path.write_text(main, encoding='utf-8')
          manifest_path.write_text(manifest, encoding='utf-8')

          print('V3.4.57 BETA 1 separate clean identity applied')
          PY

      - name: Verify BETA 1 separate clean source
        run: |
          set -e
          MAIN="android-project-v3456/app/src/main/java/it/portafoglio2026/v3/MainActivity.java"
          DB="android-project-v3456/app/src/main/java/it/portafoglio2026/v3/DbHelper.java"
          GRADLE="android-project-v3456/app/build.gradle"
          MANIFEST="android-project-v3456/app/src/main/AndroidManifest.xml"

          grep -Fq 'applicationId "it.portafoglio2026.v32.beta"' "$GRADLE"
          ! grep -Fxq '        applicationId "it.portafoglio2026.v32"' "$GRADLE"
          grep -Fq 'versionCode 99' "$GRADLE"
          grep -Fq 'versionName "3.4.57-beta1-friends-separate-clean"' "$GRADLE"
          grep -Fq 'DB_VERSION = 17' "$DB"
          grep -Fq 'BETA 1 • 3.4.57' "$MAIN"
          grep -Fq 'android:label="Portafoglio 2026 BETA"' "$MANIFEST"
          ! grep -Fq 'DEV 3.4.56' "$MAIN"

          # No prepackaged DB/CSV is allowed in the BETA sources.
          # With the separate applicationId this guarantees that a first
          # installation starts with no inherited portfolio amounts.
          if find android-project-v3456/app/src -type f \( \
              -iname '*.db' -o -iname '*.sqlite' -o -iname '*.sqlite3' \
              -o -iname '*.csv' \) -print -quit | grep -q .; then
            echo "ERROR: bundled financial database/CSV found"
            find android-project-v3456/app/src -type f \( \
              -iname '*.db' -o -iname '*.sqlite' -o -iname '*.sqlite3' \
              -o -iname '*.csv' \) -print
            exit 1
          fi

          # Keep all proven V3.4.56 fixes.
          grep -Fq 'Double.valueOf(autoGross)' "$MAIN"
          grep -Fq 'history_year_filter' "$MAIN"
          grep -Fq 'Pregresso "+historyYear+" non ripartito' "$MAIN"
          grep -Fq 'if(overall!=null)cv.put("portfolio_profit",overall);' "$MAIN"
          grep -Fq 'void syncCurrentAnnualHistoryV3456()' "$MAIN"
          grep -Fq 'void showHome(){syncCurrentAnnualHistoryV3456();' "$MAIN"
          grep -Fq 'setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD)' "$MAIN"

          python3 - <<'PY'
          gross = 12302.88
          taxes = 50.57
          result = round(gross - taxes, 2)
          assert result == 12252.31
          start_cap = 110491.16
          assert round(result / start_cap * 100, 2) == 11.09
          print('V3.4.56 accounting regression OK')
          PY

      - name: Build signed V3.4.57 BETA 1 APK
        working-directory: android-project-v3456
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed separate BETA APK
        run: |
          APK="android-project-v3456/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32.beta'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "application-label:'Portafoglio 2026 BETA'"
          echo "Separate BETA package verified"

      - name: Upload signed V3.4.57 BETA 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3457-BETA1-FRIENDS-SEPARATE-CLEAN-SIGNED-APK
          path: android-project-v3456/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
