name: Build Portafoglio 2026 V3.4.86 FIX10 FIX5 Full App Color Hooks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-full-app-color-hooks-FIX5.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-global-value-colors-FIX4-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-performance-sql-null-safe-FIX3.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-performance-safe-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-deterministic-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix9-performance-colors-stability.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.86 FIX10 FIX4 FIX1 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-global-value-colors-FIX4-FIX1.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX10 FIX4 FIX1 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                          continue
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact V3.4.86 FIX10 FIX3 source',
              'Patch V3.4.86 FIX10 FIX4 Global Value Colors'
          ]
          for target in wanted:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('FIX10 FIX4 FIX1 reconstructed')
          PYREPLAY

      - name: Patch V3.4.86 FIX10 FIX5 Full App Color Hooks
        shell: bash
        run: |
          python3 - <<'PYFIX5'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          db=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 153' in gradle,'FIX4 versionCode')
          req('versionName "3.4.86-dev-fix10-fix4-global-value-colors"' in gradle,'FIX4 versionName')
          req('DEV 3.4.86 FIX10 FIX4 GLOBAL COLORS' in main,'FIX4 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',db) is not None,'DB18')

          gradle=gradle.replace('versionCode 153','versionCode 154',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix4-global-value-colors"',
              'versionName "3.4.86-dev-fix10-fix5-full-app-color-hooks"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX4 GLOBAL COLORS',
              'DEV 3.4.86 FIX10 FIX5 FULL APP COLORS'
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          def replace_method(text,signature,replacement):
              p=text.find(signature)
              if p<0:
                  raise RuntimeError('Method not found: '+signature)
              o=text.find('{',p)
              c=matching_brace(text,o)
              return text[:p]+replacement+text[c+1:]

          global_text=r'''void styleGlobalSemanticTextV3483(android.widget.TextView t){
                  if(t==null)return;
                  if(t instanceof android.widget.EditText)return;
                  if(t instanceof android.widget.Button)return;
                  styleAllScreenFinanceV3486Fix6(t);
              }'''
          main=replace_method(
              main,
              'void styleGlobalSemanticTextV3483(android.widget.TextView t)',
              global_text
          )

          sig='boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t)'
          p=main.find(sig)
          req(p>=0,'global financial formatter found')
          o=main.find('{',p)
          c=matching_brace(main,o)
          body=main[p:c+1]

          old=r'''Ritenuta(?:\\s+26%\\s+sui\\s+proventi|\\s+su\\s+plusvalenza(?:\\s*\\(26%\\))?)?'''
          new=r'''Ritenute?(?:\\s+26%\\s+(?:sui\\s+)?proventi(?:\\s+YTD)?|\\s+su\\s+plusvalenza(?:\\s*\\(26%\\))?)?'''
          req(old in body,'FIX4 ritenuta matcher found')
          body=body.replace(old,new,1)

          main=main[:p]+body+main[c+1:]

          req('void styleSemanticKpiGroupV3486Fix7(android.view.ViewGroup g)' in main,
              'KPI group formatter preserved')
          req('low.contains("ritenut")' in main,'KPI ritenuta rule preserved')
          req('low.contains("proventi lordi")' in main,'KPI proventi rule preserved')

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX10 FIX5 applied: global traversal now uses FIX4 formatter on every screen')
          PYFIX5

      - name: Verify V3.4.86 FIX10 FIX5
        shell: bash
        run: |
          python3 - <<'PYCHECK5'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          req('versionCode 154' in g,'versionCode 154')
          req('versionName "3.4.86-dev-fix10-fix5-full-app-color-hooks"' in g,'FIX10 FIX5 version')
          req('DEV 3.4.86 FIX10 FIX5 FULL APP COLORS' in s,'visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          sig='void styleGlobalSemanticTextV3483(android.widget.TextView t)'
          p=s.find(sig)
          req(p>=0,'global TextView hook found')
          o=s.find('{',p)
          c=matching_brace(s,o)
          hook=s[p:c+1]
          req('styleAllScreenFinanceV3486Fix6(t);' in hook,
              'all global TextViews routed through FIX4 formatter')

          ap='void applyGlobalSemanticColorsV3483(android.view.View v)'
          pp=s.find(ap)
          req(pp>=0,'global tree traversal preserved')
          po=s.find('{',pp)
          pc=matching_brace(s,po)
          apply=s[pp:pc+1]
          req('styleGlobalSemanticTextV3483((android.widget.TextView)v);' in apply,
              'tree traversal applies global TextView hook')
          req('styleSemanticKpiGroupV3486Fix7(g);' in apply,
              'separate label/value KPI cards supported')

          fs='boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t)'
          fp=s.find(fs)
          req(fp>=0,'global formatter found')
          fo=s.find('{',fp)
          fc=matching_brace(s,fo)
          body=s[fp:fc+1]
          req('Ritenute?(?:\\\\s+26%\\\\s+(?:sui\\\\s+)?proventi(?:\\\\s+YTD)?' in body,
              'Home Ritenute 26% proventi YTD supported')
          req('|Provento|Proventi' in body,'income/proventi matcher preserved')
          req('t.setTextColor(android.graphics.Color.WHITE);' in body,
              'labels/descriptions reset to white')
          req('semanticAmountSpanV3483' in s,'amount-only span helper preserved')

          ps='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          xp=s.find(ps)
          req(xp>=0,'Performance cost engine preserved')
          xo=s.find('{',xp)
          xc=matching_brace(s,xo)
          perf=s[xp:xc+1]
          req('boolean total=(broker==null)||TOTAL.equals(broker);' in perf,
              'Performance Totale remains SQL null-safe')

          sumsig='void addPerformanceCostsSummary(double gross,double costs,boolean incomplete)'
          sp=s.find(sumsig)
          req(sp>=0,'Performance summary preserved')
          so=s.find('{',sp)
          sc=matching_brace(s,so)
          summary=s[sp:sc+1]
          req('applyGlobalSemanticColorsV3483(c);' not in summary,
              'no immediate Performance recursive rescan')

          req('void scheduleGlobalSemanticColorsV3483()' in s,'single delayed global pass preserved')
          req('},80);' in s,'80 ms stable global pass preserved')

          for marker in [
              '"Q.tà "+quantityItV3470(r.qty)',
              'decimalInputItV3470(r.pmc)+" €"',
              'decimalInputItV3470(r.price)+" €"',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462',
              'Performance = proventi lordi + P/L realizzato lordo.'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('FIX10 FIX5 verified: full-app global color hook active')
          PYCHECK5

      - name: Build signed V3.4.86 FIX10 FIX5 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.86 FIX10 FIX5 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX10 FIX5 signed APK verified"

      - name: Upload signed V3.4.86 FIX10 FIX5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX5-FULL-APP-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
