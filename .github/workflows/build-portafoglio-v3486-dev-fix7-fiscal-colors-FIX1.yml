                      low.contains("saveback")||low.contains("recupero fiscale")||
                      low.contains("plusvalenz")||low.contains("minusvalenz")||
                      low.contains("perdita")||low.contains("commission")||low.contains("impost")||
                      low.contains("tassazione")||low.contains("tasse")||low.contains("costi")||
                      low.contains("round up")||low.contains("capitale proprio")||
                      low.contains("patrimonio")||low.contains("capitale iniziale")||
                      low.contains("liquidità")||low.contains("liquidita")||
                      low.contains("valore titoli")||low.contains("titoli a fine anno")||
