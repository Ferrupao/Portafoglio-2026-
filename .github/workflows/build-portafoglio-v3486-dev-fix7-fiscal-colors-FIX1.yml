                          low.contains("premio")||low.contains("saveback")||low.contains("recupero fiscale"))mode=1;

                  for(android.widget.TextView v:vals){
                      double n=parseSemanticNumberV3483(v.getText().toString());
                      int c=android.graphics.Color.WHITE;
                      if(mode==2)c=Math.abs(n)<=0.0000001?android.graphics.Color.WHITE:C_RED;
