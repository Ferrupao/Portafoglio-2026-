              double realizedPlusV3486Fix7(int year){
                  return scalarV3470(
                      "SELECT COALESCE(SUM(CASE WHEN t.realized_pl_gross>0 THEN t.realized_pl_gross ELSE 0 END),0) "+
                      "FROM trade_records t JOIN portfolios p ON p.name=t.broker "+
                      "WHERE p.active=1 AND t.trade_type='SELL' AND substr(t.date,1,4)=?",
                      new String[]{String.valueOf(year)}
                  );
              }

              double realizedMinusV3486Fix7(int year){
                  return scalarV3470(
                      "SELECT COALESCE(SUM(CASE WHEN t.realized_pl_gross<0 THEN -t.realized_pl_gross ELSE 0 END),0) "+
                      "FROM trade_records t JOIN portfolios p ON p.name=t.broker "+
                      "WHERE p.active=1 AND t.trade_type='SELL' AND substr(t.date,1,4)=?",
