                          if(tradeCostsNow>0.0001)sb.append("\nCosti/imposte operazioni: -").append(euro.format(tradeCostsNow)).append(" €");
                          if(otherCosts>0.0001)sb.append("\nAltre tasse/costi registrati: -").append(euro.format(otherCosts)).append(" €");
                          if(rec>0.0001)sb.append("\nRecupero fiscale minus: +").append(euro.format(rec)).append(" €");
                          sb.append("\nRisultato complessivo: ").append(overallNow>0?"+":"").append(euro.format(overallNow)).append(" €");
                          if(rr!=null)sb.append("\nRendimento annuale: ").append(pct.format(rr)).append(" • flussi neutralizzati");
                      }
                      '''
          show=show.replace(render,override+render,1)

          add='content.addView(annual);'
          req(add in show,'annual card add')
          show=show.replace(add,add+'\n                  if(historyYear==currentDataYear)addFiscalDrawerV3486Fix7(historyYear);',1)

          main=main[:sp]+show+main[sc+1:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('V3.4.86 FIX7 FIX1 applied')
          PYFIX7

