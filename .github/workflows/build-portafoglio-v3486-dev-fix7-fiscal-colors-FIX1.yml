                          if(taxMain>0.0001)sb.append("\nTassazione proventi: -").append(euro.format(taxMain)).append(" €");
                          sb.append("\nProventi netti: ").append(netIncomeNow>0?"+":"").append(euro.format(netIncomeNow)).append(" €");
