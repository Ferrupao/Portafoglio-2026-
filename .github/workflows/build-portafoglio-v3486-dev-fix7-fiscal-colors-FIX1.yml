          main=replace_method(main,'boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t)',style)

          helpers=r'''
              void styleSemanticKpiGroupV3486Fix7(android.view.ViewGroup g){
                  if(g==null||g.getChildCount()<2)return;
                  StringBuilder labels=new StringBuilder();
                  java.util.ArrayList<android.widget.TextView> vals=new java.util.ArrayList<>();
                  for(int i=0;i<g.getChildCount();i++){
                      android.view.View ch=g.getChildAt(i);
                      if(!(ch instanceof android.widget.TextView))continue;
                      android.widget.TextView tv=(android.widget.TextView)ch;
                      String x=tv.getText()==null?"":tv.getText().toString().trim();
                      if(x.matches("[+\\-]?[0-9][0-9\\.,]*\\s*(€|%)?"))vals.add(tv);
                      else if(!x.isEmpty()){
                          if(labels.length()>0)labels.append(" ");
                          labels.append(x.toLowerCase(java.util.Locale.ROOT));
                      }
                  }
                  if(vals.isEmpty())return;
                  String low=labels.toString();
                  int mode=0;
                  if(low.contains("tasse")||low.contains("imposte")||low.contains("tassazione")||
                     low.contains("commission")||low.contains("costi"))mode=2;
                  else if(low.contains("provent")||low.contains("dividend")||low.contains("cedol")||
