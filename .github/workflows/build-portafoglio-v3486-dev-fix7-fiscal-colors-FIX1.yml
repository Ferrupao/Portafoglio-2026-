              double annualStoredV3486Fix7(int year,String column){
                  if(!"annual_loss".equals(column)&&!"annual_taxes".equals(column)&&
                     !"fiscal_recovery".equals(column))return 0;
                  android.database.Cursor c=db.getReadableDatabase().rawQuery(
                      "SELECT "+column+" FROM annual_history WHERE year=? LIMIT 1",
                      new String[]{String.valueOf(year)}
                  );
                  try{
                      return c.moveToFirst()&&!c.isNull(0)?c.getDouble(0):0;
                  }finally{c.close();}
              }

              double reclassifiedIncomeTaxV3486Fix7(int year){
                  String key="income_tax_reclassified_"+year+"_v3486fix7";
                  String saved=db.getSetting(key,"");
                  if(saved!=null&&!saved.trim().isEmpty()){
                      try{return Math.max(0,Double.parseDouble(saved.trim()));}
                      catch(Exception ignored){}
                  }
                  // User-verified 2026 correction: the legacy annual_loss amount is taxation,
                  // not a minusvalenza. Save it once before annual_loss is repaired.
                  if(year==2026){
                      double legacy=Math.max(0,annualStoredV3486Fix7(year,"annual_loss"));
                      if(legacy>0.0001){
                          db.setSetting(key,Double.toString(legacy));
                          return legacy;
                      }
                  }
                  return 0;
              }

              void repairAnnualFiscalClassificationV3486Fix7(int year){
                  if(year!=dataYear())return;

                  double tax=reclassifiedIncomeTaxV3486Fix7(year);
                  double otherCosts=Math.max(0,annualStoredV3486Fix7(year,"annual_taxes"));
                  double recovery=Math.max(0,annualStoredV3486Fix7(year,"fiscal_recovery"));
                  double gross=db.sumIncomeActive("gross");
                  double plus=realizedPlusV3486Fix7(year);
                  double minus=realizedMinusV3486Fix7(year);
                  double tradeNet=realizedNetV3486Fix7(year);
                  double netIncome=gross-tax;
                  double overall=netIncome-otherCosts+tradeNet+recovery;

                  android.content.ContentValues cv=new android.content.ContentValues();
