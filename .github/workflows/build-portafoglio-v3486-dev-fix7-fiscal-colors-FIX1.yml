name: Build Portafoglio 2026 V3.4.86 FIX7 FIX1 Fiscal Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix7-fiscal-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix6-global-colors-no-pac-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix6-global-colors-no-pac.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix5-neutral-own-capital.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.86 FIX6 FIX2 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          workflow_path=Path('.github/workflows/build-portafoglio-v3486-dev-fix6-global-colors-no-pac-FIX2.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing workflow: {workflow_path}')

          lines=workflow_path.read_text(encoding='utf-8').splitlines()
          parsed=[]
          i=0
          while i<len(lines):
              line=lines[i]
              if not line.startswith('      - name: '):
                  i+=1
                  continue
              name=line[len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  parsed.append((name,script))
              i=j if j>i else i+1

          target='Rebuild FIX5 and apply corrected FIX6 FIX2 patch'
          for name,script in parsed:
              if name==target:
                  subprocess.run(
                      ['bash','-euo','pipefail','-c',script],
                      check=True,
                      env=os.environ.copy()
                  )
                  print('V3.4.86 FIX6 FIX2 reconstructed')
                  break
          else:
              raise RuntimeError('FIX6 FIX2 reconstruction step not found')
          PYREPLAY

      - name: Patch V3.4.86 FIX7 FIX1 accounting and colors
        shell: bash
        run: |
          python3 - <<'PYFIX7'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c: raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 146' in gradle,'FIX6 versionCode')
          req('versionName "3.4.86-dev-fix6-global-colors-no-pac"' in gradle,'FIX6 versionName')
          req('styleAllScreenFinanceV3486Fix6' in main,'FIX6 formatter')
          req(re.search(r'DB_VERSION\s*=\s*18',db_path.read_text(encoding='utf-8')) is not None,'DB18')

          gradle=gradle.replace('versionCode 146','versionCode 147',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix6-global-colors-no-pac"',
              'versionName "3.4.86-dev-fix7-fix1-fiscal-colors"',
              1
          )

          # Normalize stale DEV labels visible in screenshots.
          main=re.sub(r'DEV 3\.4\.(?:84|85|86)[^"\n]*','DEV 3.4.86 FIX7 FISCO COLORS',main)

          def matching_brace(text,open_pos):
              depth=0
              ins=False; inc=False; esc=False
              line=False; block=False
              i=open_pos
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/': block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/': line=True; i+=2; continue
                  if c=='/' and n=='*': block=True; i+=2; continue
                  if c=='"': ins=True; i+=1; continue
                  if c=="'": inc=True; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          def replace_method(text,sig,repl):
              p=text.find(sig)
              if p<0: raise RuntimeError('Missing method '+sig)
              o=text.find('{',p); c=matching_brace(text,o)
              return text[:p]+repl+text[c+1:]

          # Unified color rule and literal \n cleanup.
          style=r'''boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t){
                  if(t==null)return false;
