                      "\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );
                  java.util.regex.Pattern income=java.util.regex.Pattern.compile(
                      "(?i)(Dividendi\\s+e\\s+cedole(?:\\s+lordi|\\s+incassati)?|Div\\.|Dividendo|Dividendi|Cedole"+
                      "|Proventi(?:\\s+(?:lordi|netti))?(?:\\s+YTD)?|Recupero\\s+fiscale(?:\\s+minus)?"+
                      "|Premi/Saveback|Premio|Saveback)[^0-9+\\-\\n]{0,48}"+
                      "([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );
                  java.util.regex.Pattern costs=java.util.regex.Pattern.compile(
                      "(?i)(Tassazione\\s+proventi|Commissione(?:\\s+acquisto\\s+residua)?|Commissioni(?:\\s+[0-9]{4})?"+
                      "|Imposta(?:\\s+su\\s+plusvalenza)?|Altre\\s+imposte(?:\\s+[0-9]{4})?"+
                      "|Imposte(?:\\s+(?:proventi|operazioni))?(?:\\s+[0-9]{4})?"+
                      "|Tasse(?:/costi)?(?:\\s+(?:proventi|registrate))?(?:\\s+YTD)?"+
                      "|Costi(?:/imposte\\s+operazioni|\\s+totali)?|Altre\\s+tasse/costi\\s+registrati)"+
                      "[^0-9+\\-\\n]{0,36}([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  // Label words never override a signed result.
                  applySemanticPatternV3483(sp,s,loss,3);
                  applySemanticPatternV3483(sp,s,signed,0);
                  applySemanticPatternV3483(sp,s,income,2);
                  applySemanticPatternV3483(sp,s,costs,1);

                  t.setText(sp);
                  t.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD);
