name: Build Portafoglio 2026 V3.4.38 DEV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3438.yml"
      - "portafoglio-v3438-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE" || (echo "Missing PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing PORTAFOGLIO_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing PORTAFOGLIO_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing PORTAFOGLIO_KEY_PASSWORD" && exit 1)

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"
          keytool -list -storetype PKCS12 \
            -keystore "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            -storepass "$STORE_PASSWORD" >/dev/null

      - name: Extract V3.4.38 DEV project
        run: |
          rm -rf android-project-v3438
          mkdir android-project-v3438
          unzip -q "portafoglio-v3438-dev.zip" -d android-project-v3438

      - name: Verify V3.4.38 DEV source
        run: |
          grep -q 'applicationId "it.portafoglio2026.v32"' android-project-v3438/app/build.gradle
          grep -q 'versionCode 80' android-project-v3438/app/build.gradle
          grep -q 'versionName "3.4.38-dev"' android-project-v3438/app/build.gradle
          grep -q 'DB_VERSION = 12' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'PORTAFOGLIO2026_V3438;12' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'if(oldVersion < 12)' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'fiscal_recovery REAL' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'annual_taxes REAL' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'starting_capital REAL' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'overall_result REAL' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'annualAutoTaxes' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Recupero fiscale minusvalenze' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Risultato complessivo' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'colorValueAfterLabel' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'final int C_TEXT=Color.rgb(244,249,255)' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Color.rgb(216,155,43)' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Color.rgb(142,91,217)' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'class PortfolioHistoryChartView' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'String\[\] labels={"YTD","1M","6M","1A","MAX"}' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'String\[\] modeLabels={"PATRIMONIO","PERFORMANCE €","PERFORMANCE %"}' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'performanceCostsForPeriod' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'maybeAutoRefreshQuotes' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Borsa Italiana / Euronext • BID' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'book assente: non sostituire il prezzo esistente' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'historyMonthFinanceText' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'historyAnnualFinanceText' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Borsa Italiana / Euronext' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'CAPITALE PROPRIO' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Performance YTD complessiva' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'android.permission.INTERNET' android-project-v3438/app/src/main/AndroidManifest.xml
          grep -q 'addPerformanceCostsSummary' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'TreeMap<String,Double> events=grossPerformanceByDate' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'P/L non realizzato osservato' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Costi/tasse noti' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Netto noto' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'performanceBaseWealth' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q '%.1fk' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'cubicTo' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'positionFinanceText' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'captureDailySnapshot' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'CREATE TABLE daily_snapshots' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'if(oldVersion < 11)' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'hasMatchingIncome' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'hasMatchingCost' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'hasMatchingMovement' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'DAILY_SNAPSHOT' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'new LinearGradient(left,0,right,0,lineColors' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'financeTextSigned("P/L realizzato lordo: "' android-project-v3438/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          test -f android-project-v3438/ROADMAP-V3.4.19-AGGIORNATA.md

      - name: Build signed V3.4.38 DEV APK
        working-directory: android-project-v3438
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed APK
        run: |
          test -f android-project-v3438/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-project-v3438/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed DEV APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3438-DEV-SIGNED-APK
          path: android-project-v3438/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
