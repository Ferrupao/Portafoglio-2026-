name: Build Portafoglio 2026 V3.4.86 FIX10 FIX8.5 Proventi Zero Taxes Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-5-proventi-zero-taxes-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-4-portafogli-dashboard-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-3-portfolio-final-FIX2.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact FIX8.4 FIX1 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-fix8-4-portafogli-dashboard-colors-FIX1.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX8.4 FIX1 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          for target in [
              'Rebuild exact FIX8.3 FIX2 source',
              'Patch FIX8.4 FIX1 Dashboard semantic colors'
          ]:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('FIX8.4 FIX1 source reconstructed')
          PYREPLAY

      - name: Patch FIX8.5 Proventi zero taxes colors
        shell: bash
        run: |
          python3 - <<'PYFIX85'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 161' in gradle,'FIX8.4 FIX1 versionCode')
          req('versionName "3.4.86-dev-fix10-fix8-4-portafogli-dashboard-colors-fix1"' in gradle,'FIX8.4 FIX1 versionName')
          req('DEV 3.4.86 FIX10 FIX8.4 PORTAFOGLI COLORS FIX1' in main,'FIX8.4 FIX1 visible label')

          gradle=gradle.replace('versionCode 161','versionCode 162',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix8-4-portafogli-dashboard-colors-fix1"',
              'versionName "3.4.86-dev-fix10-fix8-5-proventi-zero-taxes-colors"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX8.4 PORTAFOGLI COLORS FIX1',
              'DEV 3.4.86 FIX10 FIX8.5 PROVENTI COLORS'
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          helpers=r'''
              // ===== FIX8.5 PROVENTI: ZERO TAXES MUST STAY WHITE =====
              int incomeColorSessionV3498=0;

              void fixIncomeTaxGroupV3498(android.view.ViewGroup g){
                  if(g==null || g.getChildCount()>10)return;

                  java.util.ArrayList<android.widget.TextView> all=
                      new java.util.ArrayList<>();
                  collectLocalKpiTextV3489(g,all);
                  if(all.size()<2 || all.size()>12)return;

                  java.lang.StringBuilder labels=new java.lang.StringBuilder();
                  java.util.ArrayList<android.widget.TextView> values=
                      new java.util.ArrayList<>();

                  for(android.widget.TextView tv:all){
                      if(tv==null || tv.getText()==null)continue;
                      String x=tv.getText().toString().trim();
                      if(x.isEmpty())continue;

                      if(x.matches("[+\\-]?[0-9][0-9\\.,]*\\s*(€|%)?")){
                          values.add(tv);
                      }else{
                          if(labels.length()>0)labels.append(" ");
                          labels.append(x);
                      }
                  }

                  String low=labels.toString().toLowerCase(java.util.Locale.ROOT);
                  if(!(low.contains("tasse ytd") || low.contains("tasse mese")))return;

                  for(android.widget.TextView tv:values){
                      String x=tv.getText().toString().trim();
                      double n=parseSemanticNumberV3483(x);
                      int color=Math.abs(n)<=0.0000001
                          ?android.graphics.Color.WHITE
                          :C_RED;
                      tv.setTextColor(color);
                      tv.setTypeface(
                          android.graphics.Typeface.DEFAULT,
                          android.graphics.Typeface.BOLD
                      );
                  }
              }

              void applyIncomeTaxZeroColorsV3498(android.view.View v){
                  if(v==null)return;
                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      fixIncomeTaxGroupV3498(g);
                      for(int i=0;i<g.getChildCount();i++){
                          applyIncomeTaxZeroColorsV3498(g.getChildAt(i));
                      }
                  }
              }

              void scheduleIncomeTaxZeroColorsV3498(final int token){
                  if(content==null)return;
                  final android.view.View root=content;
                  int[] delays=new int[]{140,420};
                  for(final int delay:delays){
                      content.postDelayed(new java.lang.Runnable(){
                          @Override public void run(){
                              if(token!=incomeColorSessionV3498)return;
                              if(root!=content)return;
                              applyIncomeTaxZeroColorsV3498(root);
                          }
                      },delay);
                  }
              }
          '''

          req('incomeColorSessionV3498' not in main,'FIX8.5 helpers not already present')
          last=main.rfind('}')
          req(last>=0,'MainActivity closing brace')
          main=main[:last]+'\n'+helpers+'\n'+main[last:]

          # Inject ONLY in the Proventi screen.
          m=re.search(r'^[ \t]*void\s+showIncome\s*\([^)]*\)\s*\{',main,re.M)
          req(m is not None,'showIncome found')
          o=main.find('{',m.start())
          c=matching_brace(main,o)
          body=main[m.start():c+1]

          hook='''\n        incomeColorSessionV3498++;\n        scheduleIncomeTaxZeroColorsV3498(incomeColorSessionV3498);\n'''
          req('scheduleIncomeTaxZeroColorsV3498(' not in body,'showIncome not already patched')
          body=body[:-1]+hook+'    }'
          main=main[:m.start()]+body+main[c+1:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX8.5 applied: Proventi zero taxes white, non-zero taxes red')
          PYFIX85

      - name: Verify FIX8.5
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 162' in g,'versionCode 162')
          req('versionName "3.4.86-dev-fix10-fix8-5-proventi-zero-taxes-colors"' in g,'FIX8.5 versionName')
          req('DEV 3.4.86 FIX10 FIX8.5 PROVENTI COLORS' in s,'FIX8.5 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          for marker in [
              'int incomeColorSessionV3498=0;',
              'void fixIncomeTaxGroupV3498',
              'low.contains("tasse ytd")',
              'low.contains("tasse mese")',
              'Math.abs(n)<=0.0000001',
              '?android.graphics.Color.WHITE',
              ':C_RED;',
              'void scheduleIncomeTaxZeroColorsV3498',
              'new int[]{140,420}',
              'scheduleIncomeTaxZeroColorsV3498(incomeColorSessionV3498);'
          ]:
              req(marker in s,'FIX8.5 marker '+marker)

          # Portafogli Dashboard remains corrected.
          req(r'non\\s+realizzato' in s,'P/L non realizzato color preserved')
          req(r'proventi?(?:\\s+(?:lordi|netti))?' in s,'Proventi netti color preserved')
          req('compositionIncomeV3497' in s,'Dashboard composition colors preserved')

          # Performance remains frozen.
          for marker in [
              'boolean isTradeRepublicBrokerV3496',
              'grossPerformanceByDateTradeRepublicV3496',
              'performanceMapMonthV3496',
              'performanceMapYearV3496',
              'if(sc.contains("performance"))return false;'
          ]:
              req(marker in s,'Performance preserved '+marker)

          # Home remains frozen.
          for marker in [
              'homeColorSessionV3493',
              'scheduleHomeColorsV3493',
              'applyHomeColorsV3493'
          ]:
              req(marker in s,'Home preserved '+marker)

          # Data protections remain.
          for marker in [
              'repairTradeRepublicPricesV3477',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462',
              'Performance = proventi lordi + P/L realizzato lordo.'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('FIX8.5 verified')
          PYCHECK

      - name: Build signed FIX8.5 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed FIX8.5 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX8.5 signed APK verified"

      - name: Upload signed FIX8.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX8-5-PROVENTI-ZERO-TAXES-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
