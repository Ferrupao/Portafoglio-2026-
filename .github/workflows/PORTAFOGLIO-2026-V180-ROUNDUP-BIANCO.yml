name: Portafoglio 2026 V180 - Round up e capitale proprio bianchi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/PORTAFOGLIO-2026-V180-ROUNDUP-BIANCO.yml
      
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Estrai sorgenti V178
        run: |
          python3 - <<'PYV178'
          import base64,hashlib,io,zipfile
          encoded=""""""
          data=base64.b64decode(encoded)
          assert hashlib.sha256(data).hexdigest()=="4d131f3d0df4cd747d1a575386a7ec35b8bfc0ada344850b736ec1d5c9c961cb", "Source archive mismatch"
          with zipfile.ZipFile(io.BytesIO(data)) as z: z.extractall("android-v178")
          PYV178
      - name: Ripristina firma originale
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          test -n "$GPG_PASSPHRASE"
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"
      - name: Compila release e app di verifica
        working-directory: android-v178
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Verifica firma e versione
        id: verify_apk
        run: |
          APK="android-v178/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > badging.txt
          grep -F "package: name='it.portafoglio2026.v32' versionCode='180' versionName='3.4.89-v180-roundup-bianco'" badging.txt
      - name: Abilita accelerazione emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verifica temi, schermate e colori su Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android-v178/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-v178/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w it.portafoglio2026.v32.test/it.portafoglio2026.v3.AppearanceTest > android-test.txt
            adb logcat -d -v threadtime > android-logcat.txt
            adb pull /sdcard/Android/data/it.portafoglio2026.v32/files/qa qa || true
            cat android-test.txt
            grep -F 'V180_THEME_TESTS_OK' android-test.txt
      - name: Prepara APK compilato
        if: always() && steps.verify_apk.outcome == 'success'
        run: |
          mkdir -p release
          cp android-v178/app/build/outputs/apk/release/app-release.apk release/Portafoglio2026-V180-ROUNDUP-BIANCO.apk
          sha256sum release/Portafoglio2026-V180-ROUNDUP-BIANCO.apk > release/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.verify_apk.outcome == 'success'
        with:
          name: Portafoglio2026-V180-ROUNDUP-BIANCO-APK
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Portafoglio2026-V180-QA
          path: |
            android-test.txt
            android-logcat.txt
            badging.txt
            qa/
          if-no-files-found: warn
