name: Build Portafoglio 2026 V3.4.86 FIX10 FIX8 PORTAFOGLI All Sections Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-portafogli-all-sections-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix7-home-all-sections-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix6-latest-deterministic-screen-colors.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact FIX7 HOME source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-fix7-home-all-sections-colors.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX7 HOME workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                          continue
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact V3.4.86 FIX10 FIX6 source',
              'Patch FIX7 HOME all sections colors'
          ]
          for target in wanted:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('FIX7 HOME reconstructed')
          PYREPLAY

      - name: Patch FIX8 PORTAFOGLI all sections colors
        shell: bash
        run: |
          python3 - <<'PYFIX8'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 156' in gradle,'FIX7 versionCode')
          req('versionName "3.4.86-dev-fix10-fix7-home-all-sections-colors"' in gradle,'FIX7 versionName')
          req('DEV 3.4.86 FIX10 FIX7 HOME COLORS' in main,'FIX7 visible label')

          gradle=gradle.replace('versionCode 156','versionCode 157',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix7-home-all-sections-colors"',
              'versionName "3.4.86-dev-fix10-fix8-portafogli-all-sections-colors"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX7 HOME COLORS',
              'DEV 3.4.86 FIX10 FIX8 PORTAFOGLI COLORS'
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          # Schedule a local Portafogli pass from heading(), after the current
          # screen name has already been recorded by FIX6.
          hm=re.search(r'\bvoid\s+heading\s*\([^)]*\)\s*\{',main)
          req(hm is not None,'heading(...) found')
          ho=main.find('{',hm.start())
          hc=matching_brace(main,ho)
          hbody=main[hm.start():hc+1]

          hook='''\n        if(isPortfoliosScreenV3494()){\n            portfoliosColorSessionV3494++;\n            schedulePortfoliosColorsV3494(portfoliosColorSessionV3494);\n        }\n'''
          if 'schedulePortfoliosColorsV3494(' not in hbody:
              hbody=hbody[:-1]+hook+'    }'
          main=main[:hm.start()]+hbody+main[hc+1:]

          helpers=r'''
              // ===== FIX8 PORTAFOGLI SCREEN-LOCAL COLORS =====
              int portfoliosColorSessionV3494=0;

              boolean isPortfoliosScreenV3494(){
                  String sc=currentColorScreenV3492==null
                      ?""
                      :currentColorScreenV3492.trim().toLowerCase(java.util.Locale.ROOT);

                  if(sc.contains("performance"))return false;
                  if(sc.equals("dashboard"))return true;
                  if(sc.equals("cerca titolo"))return true;
                  if(sc.equals("portafogli"))return true;
                  if(sc.equals("posizioni"))return true;
                  if(sc.contains("dettaglio titolo"))return true;
                  if(sc.contains("modifica titolo"))return true;
                  if(sc.contains("inserisci titolo"))return true;
                  return false;
              }

              int portfoliosGroupModeV3494(String labels){
                  if(labels==null)return 0;
                  String low=labels.toLowerCase(java.util.Locale.ROOT);

                  if(textHasAnyV3492(
                      low,
                      "commission","ritenut","tobin","imposta","imposte",
                      "tassazione","costi","spese"
                  ))return 2;

                  if(textHasAnyV3492(
                      low,
                      "p/l","plusvalenz","minusvalenz","risultato",
                      "rendimento","guadagno/perdita"
                  ))return 3;

                  if(textHasAnyV3492(
                      low,
                      "cedol","dividend","div.","provent","distribuz","interessi"
                  ))return 1;

                  // Portfolio value, price, PMC, liquidity and quantities are neutral.
                  return 4;
              }

              void stylePortfoliosKpiGroupV3494(android.view.ViewGroup g){
                  if(g==null||g.getChildCount()>10)return;

                  java.util.ArrayList<android.widget.TextView> all=
                      new java.util.ArrayList<>();
                  collectLocalKpiTextV3489(g,all);
                  if(all.size()<2||all.size()>14)return;

                  java.lang.StringBuilder labels=new java.lang.StringBuilder();
                  java.util.ArrayList<android.widget.TextView> values=
                      new java.util.ArrayList<>();

                  for(android.widget.TextView tv:all){
                      if(tv==null||tv.getText()==null)continue;
                      String x=tv.getText().toString().trim();
                      if(x.isEmpty())continue;

                      if(x.matches("[+\\-]?[0-9][0-9\\.,]*\\s*(€|%)?")){
                          values.add(tv);
                      }else{
                          if(labels.length()>0)labels.append(" ");
                          labels.append(x);
                      }
                  }

                  if(values.isEmpty())return;
                  int mode=portfoliosGroupModeV3494(labels.toString());

                  for(android.widget.TextView tv:values){
                      String x=tv.getText().toString().trim();
                      double n=parseSemanticNumberV3483(x);
                      int color=android.graphics.Color.WHITE;

                      if(mode==1){
                          color=semanticIncomeColorV3483(n);
                      }else if(mode==2){
                          color=Math.abs(n)<=0.0000001
                              ?android.graphics.Color.WHITE:C_RED;
                      }else if(mode==3){
                          color=semanticSignedColorV3483(n);
                      }

                      tv.setTextColor(color);
                      tv.setTypeface(
                          android.graphics.Typeface.DEFAULT,
                          android.graphics.Typeface.BOLD
                      );
                  }
              }

              void stylePortfoliosTextV3494(android.widget.TextView t){
                  if(t==null)return;
                  if(t instanceof android.widget.EditText)return;
                  if(t instanceof android.widget.Button)return;
                  if(t.getText()==null)return;

                  String s=t.getText().toString();
                  if(s.trim().isEmpty())return;

                  // Numeric-only values are handled by the local KPI group,
                  // where the neighbouring label gives the meaning.
                  if(s.trim().matches("[+\\-]?[0-9][0-9\\.,]*\\s*(€|%)?"))return;

                  String low=s.toLowerCase(java.util.Locale.ROOT);
                  boolean financeLine=
                      s.contains("€") ||
                      low.contains("p/l") ||
                      low.contains("rendimento") ||
                      low.contains("risultato");

                  if(!financeLine)return;

                  // Start every financial line from white. This deliberately
                  // overrides older local helpers that made "Valore attuale titoli" green.
                  android.text.SpannableString sp=
                      new android.text.SpannableString(s);

                  sp.setSpan(
                      new android.text.style.ForegroundColorSpan(android.graphics.Color.WHITE),
                      0,sp.length(),android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );

                  // P/L and other signed results.
                  java.util.regex.Matcher pl=java.util.regex.Pattern.compile(
                      "(?i)(?:p/l(?:\\s+realizzato(?:\\s+(?:lordo|netto))?)?|plusvalenza|minusvalenza|risultato|rendimento)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)"
                  ).matcher(s);

                  while(pl.find()){
                      double n=parseSemanticNumberV3483(pl.group(1));
                      int color=semanticSignedColorV3483(n);
                      semanticAmountSpanV3483(
                          sp,pl.start(1),pl.end(),color
                      );

                      // If P/L is followed by a bracketed percentage,
                      // use the same sign semantics for that percentage.
                      int lineEnd=s.indexOf('\n',pl.end());
                      if(lineEnd<0)lineEnd=s.length();
                      String tail=s.substring(pl.end(),lineEnd);
                      java.util.regex.Matcher pct=java.util.regex.Pattern.compile(
                          "\\(([+\\-]?[0-9][0-9\\.,]*)\\s*%\\)"
                      ).matcher(tail);
                      if(pct.find()){
                          int a=pl.end()+pct.start(1);
                          int b=pl.end()+pct.end();
                          double pn=parseSemanticNumberV3483(pct.group(1));
                          semanticAmountSpanV3483(
                              sp,a,b,semanticSignedColorV3483(pn)
                          );
                      }
                  }

                  // Income on position cards: zero stays white.
                  java.util.regex.Matcher inc=java.util.regex.Pattern.compile(
                      "(?i)(?:cedole?|div\\.?|dividendi?|proventi?|distribuzioni?|interessi)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*€"
                  ).matcher(s);

                  while(inc.find()){
                      double n=parseSemanticNumberV3483(inc.group(1));
                      semanticAmountSpanV3483(
                          sp,inc.start(1),inc.end(),semanticIncomeColorV3483(n)
                      );
                  }

                  // Costs are always red when non-zero.
                  java.util.regex.Matcher cost=java.util.regex.Pattern.compile(
                      "(?i)(?:commissioni?|ritenute?|tobin(?:\\s+tax)?|imposte?|tassazione|costi|spese)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*€"
                  ).matcher(s);

                  while(cost.find()){
                      double n=parseSemanticNumberV3483(cost.group(1));
                      int color=Math.abs(n)<=0.0000001
                          ?android.graphics.Color.WHITE:C_RED;
                      semanticAmountSpanV3483(
                          sp,cost.start(1),cost.end(),color
                      );
                  }

                  t.setTextColor(android.graphics.Color.WHITE);
                  t.setText(sp);
                  t.setTypeface(
                      android.graphics.Typeface.DEFAULT,
                      android.graphics.Typeface.BOLD
                  );
              }

              void applyPortfoliosColorsV3494(android.view.View v){
                  if(v==null)return;

                  if(v instanceof android.widget.TextView){
                      stylePortfoliosTextV3494((android.widget.TextView)v);
                      return;
                  }

                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      stylePortfoliosKpiGroupV3494(g);

                      for(int i=0;i<g.getChildCount();i++){
                          applyPortfoliosColorsV3494(g.getChildAt(i));
                      }
                  }
              }

              void schedulePortfoliosColorsV3494(final int token){
                  if(content==null)return;
                  final android.view.View root=content;

                  int[] delays=new int[]{70,240,700};
                  for(final int delay:delays){
                      content.postDelayed(new java.lang.Runnable(){
                          @Override public void run(){
                              if(token!=portfoliosColorSessionV3494)return;
                              if(root!=content)return;
                              if(!isPortfoliosScreenV3494())return;
                              applyPortfoliosColorsV3494(root);
                          }
                      },delay);
                  }
              }
          '''

          last=main.rfind('}')
          req(last>=0,'MainActivity closing brace')
          main=main[:last]+'\n'+helpers+'\n'+main[last:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX8 PORTAFOGLI applied')
          PYFIX8

      - name: Verify FIX8 PORTAFOGLI all sections colors
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 157' in g,'versionCode 157')
          req('versionName "3.4.86-dev-fix10-fix8-portafogli-all-sections-colors"' in g,'FIX8 versionName')
          req('DEV 3.4.86 FIX10 FIX8 PORTAFOGLI COLORS' in s,'FIX8 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          for marker in [
              'int portfoliosColorSessionV3494=0;',
              'boolean isPortfoliosScreenV3494()',
              'void stylePortfoliosKpiGroupV3494',
              'void stylePortfoliosTextV3494',
              'void applyPortfoliosColorsV3494',
              'void schedulePortfoliosColorsV3494',
              'new int[]{70,240,700}',
              'if(sc.contains("performance"))return false;',
              'if(sc.equals("dashboard"))return true;',
              'if(sc.equals("cerca titolo"))return true;',
              '"Valore attuale titoli"',
              '(?:cedole?|div\\\\.?|dividendi?|proventi?',
              '(?:commissioni?|ritenute?|tobin'
          ]:
              # The literal explanatory comment may use lowercase, accept either.
              if marker=='"Valore attuale titoli"':
                  req('Valore attuale titoli' in s,'neutral current-value override documented')
              else:
                  req(marker in s,'FIX8 marker '+marker)

          # HOME is preserved, not rewritten.
          for marker in [
              'homeColorSessionV3493',
              'scheduleHomeColorsV3493',
              'applyHomeColorsV3493'
          ]:
              req(marker in s,'HOME preserved '+marker)

          # Performance remains excluded from this pass and the SQL null-safe fix stays.
          ps='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          pp=s.find(ps)
          req(pp>=0,'Performance cost engine preserved')
          req(
              'boolean total=(broker==null)||TOTAL.equals(broker);' in s[pp:pp+7000],
              'Performance Totale SQL null-safe preserved'
          )
          req(
              'if(sc.contains("performance"))return false;' in s,
              'FIX8 cannot recolor Performance screens'
          )

          # Position card/data safety remains intact.
          for marker in [
              'V3473_POSITION_CARD_AMOUNT_COLORS',
              'applyUpdatePortfolioSemanticColorsV3478',
              'repairTradeRepublicPricesV3477',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('FIX8 PORTAFOGLI verified')
          PYCHECK

      - name: Build signed FIX8 PORTAFOGLI APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed FIX8 PORTAFOGLI APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX8 PORTAFOGLI signed APK verified"

      - name: Upload signed FIX8 PORTAFOGLI APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX8-PORTAFOGLI-ALL-SECTIONS-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
