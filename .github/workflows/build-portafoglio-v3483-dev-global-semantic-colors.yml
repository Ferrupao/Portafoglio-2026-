name: Build Portafoglio 2026 V3.4.83 Global Semantic Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3483-dev-global-semantic-colors.yml"
      - ".github/workflows/build-portafoglio-v3482-dev-performance-root-fix.yml"
      - ".github/workflows/build-portafoglio-v3481-dev-performance-total-fix-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3480-dev-performance-diagnostics-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3478-dev-ui-consistency-FIX1.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.82 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          workflow_path=Path('.github/workflows/build-portafoglio-v3482-dev-performance-root-fix.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing workflow: {workflow_path}')

          lines=workflow_path.read_text(encoding='utf-8').splitlines()
          parsed=[]; i=0
          while i<len(lines):
              line=lines[i]
              if not line.startswith('      - name: '):
                  i+=1; continue
              name=line[len('      - name: '):].strip()
              j=i+1; script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1; block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '): break
                          if raw.startswith('          '):
                              block.append(raw[10:]); k+=1; continue
                          if raw.strip()=='':
                              block.append(''); k+=1; continue
                          if raw.startswith('        '): break
                          block.append(raw); k+=1
                      script='\n'.join(block)+'\n'; break
                  j+=1
              if script is not None:
                  parsed.append((name,script))
              i=j if j>i else i+1

          start='Rebuild exact V3.4.81 FIX2 source'
          end='Verify V3.4.82 Performance navigation crash fix and safety'
          started=False; reached=False

          for name,script in parsed:
              if name==start:
                  started=True
              if not started:
                  continue
              print(f'===== REPLAY {name} =====')
              subprocess.run(
                  ['bash','-euo','pipefail','-c',script],
                  check=True,
                  env=os.environ.copy()
              )
              if name==end:
                  reached=True
                  break

          if not started or not reached:
              raise RuntimeError('Could not reconstruct exact V3.4.82 source')
          print('V3.4.82 reconstructed successfully')
          PYREPLAY

      - name: Patch V3.4.83 global semantic amount colors
        shell: bash
        run: |
          python3 - <<'PY3483'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          if 'versionCode 140' not in gradle:
              raise RuntimeError('Expected V3.4.82 versionCode 140')
          if 'versionName "3.4.82-dev-performance-root-fix"' not in gradle:
              raise RuntimeError('Expected V3.4.82 versionName')
          if 'DEV 3.4.82 PERF ROOT FIX' not in main:
              raise RuntimeError('Expected V3.4.82 visible label')

          gradle=gradle.replace('versionCode 140','versionCode 141',1)
          gradle=gradle.replace(
              'versionName "3.4.82-dev-performance-root-fix"',
              'versionName "3.4.83-dev-global-semantic-colors"',
              1
          )
          main=main.replace(
              'DEV 3.4.82 PERF ROOT FIX',
              'DEV 3.4.83 GLOBAL COLORS'
          )

          def matching_brace(t,o):
              d=0;i=o;ins=inc=lin=blk=False;esc=False
              while i<len(t):
                  c=t[i]; n=t[i+1] if i+1<len(t) else ''
                  if lin:
                      if c=='\n':lin=False
                      i+=1;continue
                  if blk:
                      if c=='*' and n=='/':blk=False;i+=2;continue
                      i+=1;continue
                  if ins:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':ins=False
                      i+=1;continue
                  if inc:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=="'":inc=False
                      i+=1;continue
                  if c=='/' and n=='/':lin=True;i+=2;continue
                  if c=='/' and n=='*':blk=True;i+=2;continue
                  if c=='"':ins=True;i+=1;continue
                  if c=="'":inc=True;i+=1;continue
                  if c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return i
                  i+=1
              raise RuntimeError('Unbalanced Java braces')

          helpers=r'''
              // ===== V3.4.83 GLOBAL SEMANTIC COLORS =====
              // One visual rule for every portfolio and every main app screen:
              // labels/descriptions white + bold; only numeric amounts are semantic.
              // positive = green, negative = red, zero = white.
              // costs/taxes are red when non-zero.

              double parseSemanticNumberV3483(String raw){
                  if(raw==null)return 0;
                  String x=raw.trim().replace("€","").replace("%","").replace(" ","");
                  if(x.isEmpty())return 0;
                  try{
                      if(x.contains(",")&&x.contains(".")){
                          if(x.lastIndexOf(',')>x.lastIndexOf('.')){
                              x=x.replace(".","").replace(',','.');
                          }else{
                              x=x.replace(",","");
                          }
                      }else if(x.contains(",")){
                          x=x.replace(',','.');
                      }
                      return Double.parseDouble(x);
                  }catch(Exception e){
                      return 0;
                  }
              }

              int semanticSignedColorV3483(double value){
                  if(value>0.0000001)return C_GREEN;
                  if(value<-0.0000001)return C_RED;
                  return android.graphics.Color.WHITE;
              }

              int semanticCostColorV3483(double value){
                  if(Math.abs(value)<=0.0000001)return android.graphics.Color.WHITE;
                  return C_RED;
              }

              int semanticIncomeColorV3483(double value){
                  if(value>0.0000001)return C_GREEN;
                  if(value<-0.0000001)return C_RED;
                  return android.graphics.Color.WHITE;
              }

              void semanticAmountSpanV3483(
                  android.text.SpannableString sp,int start,int end,int color
              ){
                  if(sp==null||start<0||end<=start||end>sp.length())return;
                  sp.setSpan(
                      new android.text.style.ForegroundColorSpan(color),
                      start,end,
                      android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );
              }

              void applySemanticPatternV3483(
                  android.text.SpannableString sp,
                  String s,
                  java.util.regex.Pattern pattern,
                  int kind
              ){
                  java.util.regex.Matcher m=pattern.matcher(s);
                  while(m.find()){
                      double value=parseSemanticNumberV3483(m.group(2));

                      int color;
                      if(kind==1){
                          color=semanticCostColorV3483(value);
                      }else if(kind==2){
                          color=semanticIncomeColorV3483(value);
                      }else if(kind==3){
                          color=Math.abs(value)<=0.0000001
                              ?android.graphics.Color.WHITE:C_RED;
                      }else if(kind==4){
                          color=Math.abs(value)<=0.0000001
                              ?android.graphics.Color.WHITE:C_GREEN;
                      }else{
                          color=semanticSignedColorV3483(value);
                      }

                      int end=m.end(2);
                      if(m.groupCount()>=3&&m.group(3)!=null)end=m.end(3);
                      semanticAmountSpanV3483(sp,m.start(2),end,color);

                      // P/L and Guadagno/Perdita often have a percentage in brackets.
                      if(kind==0){
                          int segmentEnd=s.indexOf('\n',m.end());
                          if(segmentEnd<0)segmentEnd=s.length();
                          int bullet=s.indexOf(" • ",m.end());
                          if(bullet>=0&&bullet<segmentEnd)segmentEnd=bullet;

                          String rest=s.substring(m.end(),segmentEnd);
                          java.util.regex.Matcher pct=
                              java.util.regex.Pattern.compile(
                                  "\\(([+\\-]?[0-9][0-9\\.,]*)%\\)"
                              ).matcher(rest);
                          if(pct.find()){
                              int ps=m.end()+pct.start(1);
                              int pe=m.end()+pct.end(1)+1;
                              semanticAmountSpanV3483(sp,ps,pe,color);
                          }
                      }
                  }
              }

              void styleGlobalSemanticTextV3483(android.widget.TextView t){
                  if(t==null)return;
                  if(t instanceof android.widget.EditText)return;
                  if(t instanceof android.widget.Button)return;

                  CharSequence q=t.getText();
                  if(q==null)return;
                  String s=q.toString();
                  if(s.trim().isEmpty())return;

                  java.util.regex.Pattern signed=java.util.regex.Pattern.compile(
                      "(?i)(P/L(?:\\s+(?:non\\s+realizzato|realizzato\\s+netto|realizzato\\s+lordo))?"+
                      "|Guadagno/Perdita"+
                      "|Rendimento(?:\\s+(?:YTD|reale|da\\s+inizio\\s+anno))?"+
                      "|Risultato\\s+complessivo"+
                      "|Lordo|Netto)\\s*:?\\s*"+
                      "([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  java.util.regex.Pattern costs=java.util.regex.Pattern.compile(
                      "(?i)(Commissione(?:\\s+acquisto\\s+residua)?"+
                      "|Commissioni(?:\\s+[0-9]{4})?"+
                      "|Imposta(?:\\s+su\\s+plusvalenza)?"+
                      "|Imposte(?:\\s+(?:proventi|operazioni))?"+
                      "|Tasse(?:\\s+proventi)?(?:\\s+YTD)?"+
                      "|Costi(?:\\s+totali)?)\\s*:?\\s*"+
                      "([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  java.util.regex.Pattern income=java.util.regex.Pattern.compile(
                      "(?i)(Div\\.|Dividendo|Dividendi|Cedole"+
                      "|Proventi(?:\\s+(?:lordi|netti))?(?:\\s+YTD)?"+
                      "|Recupero\\s+fiscale)\\s*:?\\s*"+
                      "([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  java.util.regex.Pattern loss=java.util.regex.Pattern.compile(
                      "(?i)(Perdita\\s*/\\s*minus|Minusvalenza|Minus)\\s*:?\\s*"+
                      "([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  boolean relevant=
                      signed.matcher(s).find()||
                      costs.matcher(s).find()||
                      income.matcher(s).find()||
                      loss.matcher(s).find();

                  if(!relevant)return;

                  // Rebuild from plain text so obsolete color spans cannot override
                  // the global semantic rule.
                  android.text.SpannableString sp=
                      new android.text.SpannableString(s);

                  sp.setSpan(
                      new android.text.style.ForegroundColorSpan(
                          android.graphics.Color.WHITE
                      ),
                      0,sp.length(),
                      android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );
                  sp.setSpan(
                      new android.text.style.StyleSpan(
                          android.graphics.Typeface.BOLD
                      ),
                      0,sp.length(),
                      android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );

                  applySemanticPatternV3483(sp,s,signed,0);
                  applySemanticPatternV3483(sp,s,costs,1);
                  applySemanticPatternV3483(sp,s,income,2);
                  applySemanticPatternV3483(sp,s,loss,3);

                  t.setText(sp);
              }

              void applyGlobalSemanticColorsV3483(android.view.View v){
                  if(v==null)return;

                  if(v instanceof android.widget.TextView){
                      styleGlobalSemanticTextV3483(
                          (android.widget.TextView)v
                      );
                  }

                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      for(int i=0;i<g.getChildCount();i++){
                          applyGlobalSemanticColorsV3483(g.getChildAt(i));
                      }
                  }
              }

              void scheduleGlobalSemanticColorsV3483(){
                  if(content==null)return;

                  // First pass after the current screen finishes rendering.
                  content.post(new Runnable(){
                      @Override public void run(){
                          applyGlobalSemanticColorsV3483(content);
                      }
                  });

                  // Second pass catches existing delayed/local formatters
                  // (position cards, history, accounting) without scanning ancestors.
                  content.postDelayed(new Runnable(){
                      @Override public void run(){
                          applyGlobalSemanticColorsV3483(content);
                      }
                  },260);
              }
          '''

          # Insert helpers before the final MainActivity brace.
          last=main.rfind('}')
          if last<0:
              raise RuntimeError('MainActivity closing brace not found')
          main=main[:last]+'\n'+helpers+'\n'+main[last:]

          # Every main screen calls heading() at the start.
          # Queue the global pass from there; post() executes after the screen
          # method finishes constructing its content.
          hm=re.search(r'\bvoid\s+heading\s*\([^)]*\)\s*\{',main)
          if not hm:
              raise RuntimeError('heading(...) not found')
          ho=main.find('{',hm.start())
          hc=matching_brace(main,ho)
          hbody=main[hm.start():hc+1]

          if 'scheduleGlobalSemanticColorsV3483();' not in hbody:
              hbody=hbody[:-1]+'''
                  scheduleGlobalSemanticColorsV3483();
              }'''
          main=main[:hm.start()]+hbody+main[hc+1:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('V3.4.83 global semantic colors applied')
          PY3483

      - name: Verify V3.4.83 global colors and all safety regressions
        shell: bash
        run: |
          python3 - <<'PY3483CHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')
          compact=lambda x:re.sub(r'\s+','',x)

          def require(cond,msg):
              if not cond:
                  raise RuntimeError(msg)
              print('OK:',msg)

          require('versionCode 141' in g,'versionCode 141')
          require(
              'versionName "3.4.83-dev-global-semantic-colors"' in g,
              'versionName V3.4.83'
          )
          require(
              'DEV 3.4.83 GLOBAL COLORS' in s,
              'visible version label'
          )
          require(
              re.search(r'DB_VERSION\s*=\s*18',d) is not None,
              'DB version 18'
          )

          # App-wide semantic formatter.
          for marker in [
              'styleGlobalSemanticTextV3483',
              'applyGlobalSemanticColorsV3483',
              'scheduleGlobalSemanticColorsV3483',
              'parseSemanticNumberV3483',
              'semanticSignedColorV3483',
              'semanticCostColorV3483',
              'semanticIncomeColorV3483',
              'scheduleGlobalSemanticColorsV3483();',
          ]:
              require(marker in s,'global marker '+marker)

          # Required user-visible semantics.
          for marker in [
              'P/L',
              'Guadagno/Perdita',
              'Rendimento',
              'Lordo|Netto',
              'Commissione',
              'Commissioni',
              'Imposta',
              'Imposte',
              'Tasse',
              'Div\\\\.',
              'Dividendo',
              'Dividendi',
              'Cedole',
              'Proventi',
              'Recupero',
              'Perdita',
          ]:
              require(marker in s,'semantic label '+marker)

          # Amount-only colors: base text white, positive green,
          # negative red, zero white.
          require(
              'new android.text.style.ForegroundColorSpan(' in s and
              'android.graphics.Color.WHITE' in s,
              'labels/descriptions white'
          )
          require(
              'if(value>0.0000001)return C_GREEN;' in s,
              'positive green'
          )
          require(
              'if(value<-0.0000001)return C_RED;' in s,
              'negative red'
          )
          require(
              'if(Math.abs(value)<=0.0000001)return android.graphics.Color.WHITE;' in s,
              'zero white'
          )
          require(
              'if(t instanceof android.widget.Button)return;' in s,
              'buttons excluded'
          )
          require(
              'if(t instanceof android.widget.EditText)return;' in s,
              'edit fields excluded'
          )

          # Root Performance fixes MUST remain.
          require(
              'boolean total=(broker==null)||TOTAL.equals(broker);' in s,
              'aggregate Performance null-safe'
          )
          require(
              'showPerformance(1,Calendar.getInstance().get(Calendar.MONTH)+1,"Totale")' not in s,
              'Totale not passed as selectedDay'
          )
          require(
              'String[] bargs=total?new String[]{}:new String[]{broker};' in s,
              'aggregate SQL has no null bind'
          )

          # Existing local formatters remain; global rule wins in final delayed pass.
          for marker in [
              'stylePositionIncomeLabelV3478Fix1',
              'applyUpdatePortfolioSemanticColorsV3478',
              'stylePositionCardAmountTextV3473',
              'applyOperationSemanticColorsV3470Fix3',
              'repairTradeRepublicPricesV3477',
              'repairInvalidCapitalGainTaxesV3470Fix2',
          ]:
              require(marker in s,'preserved '+marker)

          # Data-integrity protections remain.
          for marker in [
              'applyHistoricalUiSafetyV3462',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'V3474_FIX2_NORMALIZED_BROKER_TOTALS',
              'V3474_FIX3_POSITION_FIRST_HOME_TOTAL',
              'V3473_POSITION_CARD_AMOUNT_COLORS',
              'V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC',
          ]:
              require(marker in s or marker in d,'preserved '+marker)

          # New V3.4.83 block must be UI-only.
          p=s.index('// ===== V3.4.83 GLOBAL SEMANTIC COLORS =====')
          block=s[p:]
          bc=compact(block)
          for forbidden in [
              'UPDATEpositions',
              'UPDATEportfolio_status',
              'INSERTINTOpositions',
              'DELETEFROMpositions',
              'cv.put("quantity"',
              'cv.put("pmc"',
              'cv.put("price"',
          ]:
              require(forbidden not in bc,'no financial write '+forbidden)

          print('V3.4.83 verified: one semantic color rule across all portfolios and main screens')
          PY3483CHECK

      - name: Build signed V3.4.83 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.83 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "V3.4.83 signed APK verified"

      - name: Upload signed V3.4.83 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3483-GLOBAL-SEMANTIC-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
