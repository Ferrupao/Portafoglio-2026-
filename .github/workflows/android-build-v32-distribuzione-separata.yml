name: Build Portafoglio 2026 V3.2 Distribuzione Separata

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build-v32-distribuzione-separata.yml"
      - "portafoglio-v32-distribuzione-separata.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract distribution project
        run: |
          rm -rf android-project-v32-distribution-separate
          mkdir android-project-v32-distribution-separate
          unzip -q portafoglio-v32-distribuzione-separata.zip -d android-project-v32-distribution-separate

      - name: Build distribution APK
        working-directory: android-project-v32-distribution-separate
        run: gradle assembleDebug --no-daemon

      - name: Upload distribution APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V32-DISTRIBUZIONE-SEPARATA-APK
          path: android-project-v32-distribution-separate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
