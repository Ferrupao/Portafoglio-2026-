name: Build Portafoglio 2026 V3.4.86 FIX10 FIX6 FIX1 Verify Repair

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix6-latest-deterministic-screen-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix6-latest-deterministic-screen-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-full-app-color-hooks-FIX5.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact latest FIX6 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-fix6-latest-deterministic-screen-colors.yml')
          if not wf.exists():
              raise RuntimeError('Missing latest FIX6 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                          continue
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact latest FIX5 source',
              'Patch FIX6 latest deterministic screen colors'
          ]

          for target in wanted:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('Latest FIX6 source reconstructed successfully')
          PYREPLAY

      - name: Verify FIX6 FIX1 deterministic colors
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(cond,msg):
              if not cond:
                  raise RuntimeError(msg)
              print('OK:',msg)

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          req('versionCode 155' in g,'versionCode 155')
          req('versionName "3.4.86-dev-fix10-fix6-latest-deterministic-screen-colors"' in g,'latest FIX6 versionName')
          req('DEV 3.4.86 FIX10 FIX6 LATEST COLORS' in s,'latest FIX6 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          sig='boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t)'
          p=s.find(sig)
          req(p>=0,'styleAllScreenFinanceV3486Fix6 found')
          o=s.find('{',p)
          c=matching_brace(s,o)
          formatter=s[p:c+1]
          req('return styleDeterministicScreenTextV3492(t);' in formatter,
              'old broad formatter replaced by deterministic formatter')
          req('java.util.regex.Pattern costs=' not in formatter and
              'java.util.regex.Pattern income=' not in formatter and
              'java.util.regex.Pattern signed=' not in formatter,
              'broad semantic regexes removed from direct formatter')

          sig2='void styleGlobalSemanticTextV3483(android.widget.TextView t)'
          p2=s.find(sig2)
          req(p2>=0,'global TextView hook found')
          o2=s.find('{',p2)
          c2=matching_brace(s,o2)
          hook=s[p2:c2+1]
          req('styleDeterministicScreenTextV3492(t);' in hook,
              'global hook uses deterministic formatter')

          for marker in [
              'String currentColorScreenV3492=""',
              'deterministicModeV3492',
              'styleDeterministicScreenTextV3492',
              'colorMoneyOnlyV3492',
              '"([+\\\\-]?[0-9][0-9\\\\.,]*)\\\\s*€"',
              '"round up","versamento","prelievo"',
              '"ritenuta","tobin tax","commission"',
              '"provent","dividend","cedol","distribuz","interessi"'
          ]:
              req(marker in s,'deterministic marker '+marker)

          ps='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          pp=s.find(ps)
          req(pp>=0,'Performance cost engine preserved')
          po=s.find('{',pp)
          pc=matching_brace(s,po)
          perf=s[pp:pc+1]
          req('boolean total=(broker==null)||TOTAL.equals(broker);' in perf,
              'Performance Totale remains SQL null-safe')

          req('},100);' in s,'single 100 ms deterministic color pass')
          req('new int[]{0,120,360,900}' not in s,'old four-pass color scheduler absent')

          print('FIX10 FIX6 FIX1 verification passed')
          PYCHECK

      - name: Build signed FIX6 FIX1 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed FIX6 FIX1 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX6 FIX1 signed APK verified"

      - name: Upload signed FIX6 FIX1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX6-FIX1-DETERMINISTIC-SCREEN-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
