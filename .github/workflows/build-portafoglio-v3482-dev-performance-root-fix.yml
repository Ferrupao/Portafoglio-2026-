name: Build Portafoglio 2026 V3.4.82 Performance Root Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3482-dev-performance-root-fix.yml"
      - ".github/workflows/build-portafoglio-v3481-dev-performance-total-fix-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3480-dev-performance-diagnostics-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3478-dev-ui-consistency-FIX1.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.81 FIX2 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          workflow_path=Path('.github/workflows/build-portafoglio-v3481-dev-performance-total-fix-FIX2.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing workflow: {workflow_path}')

          lines=workflow_path.read_text(encoding='utf-8').splitlines()
          parsed=[]; i=0
          while i<len(lines):
              line=lines[i]
              if not line.startswith('      - name: '):
                  i+=1; continue
              name=line[len('      - name: '):].strip()
              j=i+1; script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1; block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '): break
                          if raw.startswith('          '):
                              block.append(raw[10:]); k+=1; continue
                          if raw.strip()=='':
                              block.append(''); k+=1; continue
                          if raw.startswith('        '): break
                          block.append(raw); k+=1
                      script='\n'.join(block)+'\n'; break
                  j+=1
              if script is not None:
                  parsed.append((name,script))
              i=j if j>i else i+1

          start='Rebuild exact V3.4.80 FIX1 source'
          end='Verify V3.4.81 FIX2 Performance total fix and safety'
          started=False; reached=False
          for name,script in parsed:
              if name==start:
                  started=True
              if not started:
                  continue
              print(f'===== REPLAY {name} =====')
              subprocess.run(
                  ['bash','-euo','pipefail','-c',script],
                  check=True,
                  env=os.environ.copy()
              )
              if name==end:
                  reached=True
                  break

          if not started or not reached:
              raise RuntimeError('Could not reconstruct exact V3.4.81 FIX2 source')
          print('V3.4.81 FIX2 reconstructed successfully')
          PYREPLAY

      - name: Patch V3.4.82 Performance root cause
        shell: bash
        run: |
          python3 - <<'PY3482'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          if 'versionCode 139' not in gradle:
              raise RuntimeError('Expected V3.4.81 versionCode 139')
          if 'versionName "3.4.81-dev-performance-total-fix"' not in gradle:
              raise RuntimeError('Expected V3.4.81 versionName')
          if 'DEV 3.4.81 PERF TOTAL FIX' not in main:
              raise RuntimeError('Expected V3.4.81 visible label')

          gradle=gradle.replace('versionCode 139','versionCode 140',1)
          gradle=gradle.replace(
              'versionName "3.4.81-dev-performance-total-fix"',
              'versionName "3.4.82-dev-performance-root-fix"',
              1
          )
          main=main.replace(
              'DEV 3.4.81 PERF TOTAL FIX',
              'DEV 3.4.82 PERF ROOT FIX'
          )

          # 1) Historical Performance button:
          # "Totale" was incorrectly passed as selectedDay.
          broken='showPerformance(1,Calendar.getInstance().get(Calendar.MONTH)+1,"Totale")'
          fixed='showPerformance(1,Calendar.getInstance().get(Calendar.MONTH)+1,null)'
          if broken not in main:
              raise RuntimeError('Broken historical Performance call not found')
          main=main.replace(broken,fixed,1)

          # 2) Root crash:
          # brokerFilter() intentionally returns null for the aggregate Totale view.
          # Treat BOTH null and TOTAL as aggregate, therefore no broker=? binding.
          old='boolean total=TOTAL.equals(broker);'
          new='boolean total=(broker==null)||TOTAL.equals(broker);'
          if old not in main:
              raise RuntimeError('performanceCostsForPeriod total test not found')
          main=main.replace(old,new,1)

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('V3.4.82 root fix applied')
          PY3482

      - name: Verify V3.4.82 Performance navigation crash fix and safety
        shell: bash
        run: |
          python3 - <<'PY3482CHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def require(cond,msg):
              if not cond:
                  raise RuntimeError(msg)
              print('OK:',msg)

          require('versionCode 140' in g,'versionCode 140')
          require('versionName "3.4.82-dev-performance-root-fix"' in g,'versionName V3.4.82')
          require('DEV 3.4.82 PERF ROOT FIX' in s,'visible version label')
          require(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB version 18')

          # Historical button no longer abuses selectedDay.
          require(
              'showPerformance(1,Calendar.getInstance().get(Calendar.MONTH)+1,"Totale")' not in s,
              'no Totale passed as selectedDay'
          )
          require(
              'showPerformance(1,Calendar.getInstance().get(Calendar.MONTH)+1,null)' in s,
              'historical Performance opens directly with null day'
          )

          # Aggregate Performance must NEVER bind a null broker.
          require(
              'boolean total=(broker==null)||TOTAL.equals(broker);' in s,
              'null broker is aggregate Totale'
          )
          require(
              'String[] bargs=total?new String[]{}:new String[]{broker};' in s,
              'aggregate uses zero SQL bind args'
          )
          require(
              'String bwhere=total?"broker IN (SELECT name FROM portfolios WHERE active=1)":"broker=?";' in s,
              'aggregate query uses active portfolios'
          )

          # Dashboard Performance remains broker-scoped for individual portfolios.
          require(
              'perf.setOnClickListener(v->showPerformance(1,Calendar.getInstance().get(Calendar.MONTH)+1,null))' in s,
              'dashboard Performance route preserved'
          )

          # Keep diagnostics until device confirmation.
          for marker in [
              'installPerformanceCrashDiagnosticsV3480',
              'recordPerformanceScreenV3480',
              'showPerformanceCrashDiagnosticCardV3480',
          ]:
              require(marker in s,'diagnostic '+marker)

          # Existing data and accounting protections.
          for marker in [
              'stylePositionIncomeLabelV3478Fix1',
              'applyUpdatePortfolioSemanticColorsV3478',
              'stylePositionCardAmountTextV3473',
              'repairTradeRepublicPricesV3477',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'V3474_FIX2_NORMALIZED_BROKER_TOTALS',
              'V3474_FIX3_POSITION_FIRST_HOME_TOTAL',
              'V3473_POSITION_CARD_AMOUNT_COLORS',
              'V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC',
          ]:
              require(marker in s or marker in d,'preserved '+marker)

          # V3.4.82 is read/navigation logic only.
          # DbHelper schema stays untouched.
          print('V3.4.82 verified: total Performance direct navigation + null-safe aggregate SQL')
          PY3482CHECK

      - name: Build signed V3.4.82 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.82 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "V3.4.82 signed APK verified"

      - name: Upload signed V3.4.82 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3482-PERFORMANCE-ROOT-FIX-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
