name: Build Portafoglio 2026 V3.4.49 DEV History Crash Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3449-history-fix.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Extract V3.4.44 source
        run: |
          rm -rf android-project-v3449
          mkdir android-project-v3449
          unzip -q "portafoglio-v3444-dev.zip" -d android-project-v3449

      - name: Patch V3.4.49 history crash fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android-project-v3449")
          main_path = root / "app/src/main/java/it/portafoglio2026/v3/MainActivity.java"
          db_path = root / "app/src/main/java/it/portafoglio2026/v3/DbHelper.java"
          gradle_path = root / "app/build.gradle"

          main = main_path.read_text(encoding="utf-8")
          db = db_path.read_text(encoding="utf-8")
          gradle = gradle_path.read_text(encoding="utf-8")

          assert 'versionCode 86' in gradle
          assert 'versionName "3.4.44-dev"' in gradle
          assert 'DB_VERSION = 16' in db

          gradle = gradle.replace('versionCode 86', 'versionCode 91', 1)
          gradle = gradle.replace(
              'versionName "3.4.44-dev"',
              'versionName "3.4.49-dev-history-fix"',
              1
          )

          # The device DB is already at user_version 17 from the repair/diagnostic builds.
          # Keeping DB_VERSION at 17 prevents SQLiteOpenHelper from treating this as a downgrade.
          db = db.replace('DB_VERSION = 16', 'DB_VERSION = 17', 1)

          needle = 'Math.abs(autoGross)>0.0001?autoGross:'
          replacement = 'Math.abs(autoGross)>0.0001?Double.valueOf(autoGross):'
          count = main.count(needle)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 nullable autoGross ternaries, found {count}")
          main = main.replace(needle, replacement)

          # Marker update when present.
          main = main.replace(
              "PORTAFOGLIO2026_V3444;16",
              "PORTAFOGLIO2026_V3449_HISTORY_FIX;17"
          )

          main_path.write_text(main, encoding="utf-8")
          db_path.write_text(db, encoding="utf-8")
          gradle_path.write_text(gradle, encoding="utf-8")

          print("Patched both nullable gross ternaries to avoid Double.doubleValue() on null")
          PY

      - name: Verify V3.4.49 source
        run: |
          set -e
          MAIN="android-project-v3449/app/src/main/java/it/portafoglio2026/v3/MainActivity.java"
          DB="android-project-v3449/app/src/main/java/it/portafoglio2026/v3/DbHelper.java"
          GRADLE="android-project-v3449/app/build.gradle"

          grep -Fq 'applicationId "it.portafoglio2026.v32"' "$GRADLE"
          grep -Fq 'versionCode 91' "$GRADLE"
          grep -Fq 'versionName "3.4.49-dev-history-fix"' "$GRADLE"
          grep -Fq 'DB_VERSION = 17' "$DB"
          test "$(grep -o 'Math.abs(autoGross)>0.0001?Double.valueOf(autoGross):' "$MAIN" | wc -l)" -eq 2
          ! grep -Fq 'Math.abs(autoGross)>0.0001?autoGross:' "$MAIN"

      - name: Build signed V3.4.49 APK
        working-directory: android-project-v3449
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed APK
        run: |
          test -f android-project-v3449/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-project-v3449/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed V3.4.49 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3449-DEV-HISTORY-FIX-SIGNED-APK
          path: android-project-v3449/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
