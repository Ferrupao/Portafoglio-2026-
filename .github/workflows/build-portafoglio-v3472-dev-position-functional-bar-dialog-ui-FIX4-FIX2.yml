name: Build Portafoglio 2026 V3.4.72 DEV Position Functional Bar & Dialog UI FIX4 FIX2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX4-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX3.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui.yml"
      - ".github/workflows/build-portafoglio-v3471-dev-instrument-lifecycle-acc-div.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX4.yml"
      - ".github/workflows/build-portafoglio-v3464-dev-global-cash-position-safety-FIX2.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.72 FIX2 source chain
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os
          import subprocess

          workflow_path = Path('.github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX2.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing previous workflow: {workflow_path}')

          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          parsed = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if not line.startswith('      - name: '):
                  i += 1
                  continue

              name = line[len('      - name: '):].strip()
              j = i + 1
              script = None
              while j < len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j] == '        run: |':
                      k = j + 1
                      block = []
                      while k < len(lines):
                          raw = lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k += 1
                              continue
                          if raw.strip() == '':
                              block.append('')
                              k += 1
                              continue
                          # A new step-level YAML key after run: ends the shell block.
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k += 1
                      script = '\n'.join(block) + '\n'
                      break
                  j += 1
              if script is not None:
                  parsed.append((name, script))
              i = j if j > i else i + 1

          start_name = 'Extract V3.4.44 source'
          end_name = 'Verify V3.4.72 FIX2 synchronized filters and all safety regressions'
          started = False
          reached_end = False
          executed = 0

          for name, script in parsed:
              if name == start_name:
                  started = True
              if not started:
                  continue

              print(f'\\n===== Replaying FIX2 step: {name} =====')
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', script],
                  check=True,
                  env=os.environ.copy(),
              )
              executed += 1

              if name == end_name:
                  reached_end = True
                  break

          if not started:
              raise RuntimeError(f'Could not find replay start step: {start_name}')
          if not reached_end:
              raise RuntimeError(f'Could not find replay end step: {end_name}')
          if executed < 10:
              raise RuntimeError(f'Unexpectedly short FIX2 replay: only {executed} run steps')

          print(f'Exact V3.4.72 FIX2 source chain replayed successfully ({executed} run steps)')
          PYREPLAY

      - name: Patch V3.4.72 FIX3 compile-safe default position category
        shell: bash
        run: |
          python3 - <<'PY3472FIX3'
          from pathlib import Path

          root = Path('android-project-v3460')
          main_path = root / 'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path = root / 'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path = root / 'app/build.gradle'

          main = main_path.read_text(encoding='utf-8')
          db = db_path.read_text(encoding='utf-8')
          gradle = gradle_path.read_text(encoding='utf-8')

          if 'versionCode 119' not in gradle:
              raise RuntimeError('V3.4.72 FIX2 versionCode missing')
          if 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix2"' not in gradle:
              raise RuntimeError('V3.4.72 FIX2 versionName missing')
          if 'DEV 3.4.72 FIX2' not in main:
              raise RuntimeError('V3.4.72 FIX2 DEV label missing')

          gradle = gradle.replace('versionCode 119', 'versionCode 120', 1)
          gradle = gradle.replace(
              'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix2"',
              'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix3"',
              1,
          )
          main = main.replace('DEV 3.4.72 FIX2', 'DEV 3.4.72 FIX3', 1)

          def matching_brace(text, open_pos):
              depth = 0
              i = open_pos
              in_str = in_char = in_line = in_block = False
              esc = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if in_line:
                      if c == '\n':
                          in_line = False
                      i += 1
                      continue
                  if in_block:
                      if c == '*' and n == '/':
                          in_block = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if in_str:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == '"':
                          in_str = False
                      i += 1
                      continue
                  if in_char:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue
                  if c == '/' and n == '/':
                      in_line = True
                      i += 2
                      continue
                  if c == '/' and n == '*':
                      in_block = True
                      i += 2
                      continue
                  if c == '"':
                      in_str = True
                      i += 1
                      continue
                  if c == "'":
                      in_char = True
                      i += 1
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError('Unbalanced Java braces')

          sig = '    void showPositionsList('
          p = main.find(sig)
          if p < 0:
              raise RuntimeError('showPositionsList missing')
          o = main.find('{', p)
          if o < 0:
              raise RuntimeError('showPositionsList body missing')
          c = matching_brace(main, o)
          segment = main[p:c + 1]

          bad = 'positionCategoryV3472Fix2=(category==null||category.trim().isEmpty())?"Tutti":category.trim();'
          if bad not in segment:
              raise RuntimeError('FIX2 compile-error line not found inside showPositionsList')

          good = 'positionCategoryV3472Fix2="Tutti"; // V3472_FIX3_DEFAULT_CATEGORY_COMPILE_FIX'
          segment = segment.replace(bad, good, 1)
          main = main[:p] + segment + main[c + 1:]

          main_path.write_text(main, encoding='utf-8')
          db_path.write_text(db, encoding='utf-8')
          gradle_path.write_text(gradle, encoding='utf-8')
          print('V3.4.72 FIX3 compile-safe showPositionsList default-category patch applied')
          PY3472FIX3

      - name: Verify V3.4.72 FIX3 compile fix and all safety regressions
        shell: bash
        run: |
          python3 - <<'PY3472FIX3CHECK'
          from pathlib import Path
          import re

          root = Path('android-project-v3460')
          s = (root / 'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d = (root / 'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g = (root / 'app/build.gradle').read_text(encoding='utf-8')
          compact = lambda x: re.sub(r'\s+', '', x)

          assert 'versionCode 120' in g
          assert 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix3"' in g
          assert 'DEV 3.4.72 FIX3' in s
          assert re.search(r'DB_VERSION\s*=\s*18', d)

          # FIX3 compile regression: showPositionsList has no local "category" variable.
          m = re.search(r'void\s+showPositionsList\s*\([^)]*\)\s*\{', s)
          assert m, 'showPositionsList declaration missing'

          def matching_brace(text, open_pos):
              depth = 0
              i = open_pos
              in_str = in_char = in_line = in_block = False
              esc = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if in_line:
                      if c == '\n': in_line = False
                      i += 1; continue
                  if in_block:
                      if c == '*' and n == '/': in_block = False; i += 2; continue
                      i += 1; continue
                  if in_str:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == '"': in_str = False
                      i += 1; continue
                  if in_char:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == "'": in_char = False
                      i += 1; continue
                  if c == '/' and n == '/': in_line = True; i += 2; continue
                  if c == '/' and n == '*': in_block = True; i += 2; continue
                  if c == '"': in_str = True; i += 1; continue
                  if c == "'": in_char = True; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              raise AssertionError('Unbalanced showPositionsList braces')

          open_pos = s.find('{', m.start())
          close_pos = matching_brace(s, open_pos)
          show_list = s[m.start():close_pos + 1]
          bad = 'positionCategoryV3472Fix2=(category==null||category.trim().isEmpty())?"Tutti":category.trim();'
          assert bad not in show_list
          assert 'positionCategoryV3472Fix2="Tutti"; // V3472_FIX3_DEFAULT_CATEGORY_COMPILE_FIX' in show_list
          assert 'schedulePositionFilterBindingsV3472Fix2();' in show_list

          for marker in [
              'positionCategoryV3472Fix2="Tutti"',
              'positionStateV3472Fix2="Aperte"',
              'syncPositionFilterStateV3472Fix2(category,state,order,query)',
              'applyPositionFilterBindingsV3472Fix2',
              'schedulePositionFilterBindingsV3472Fix2',
              'showPositionsListFiltered(target,positionStateV3472Fix2,positionOrderV3472Fix2,positionQueryV3472Fix2)',
              'showPositionsListFiltered(positionCategoryV3472Fix2,"Aperte",positionOrderV3472Fix2,positionQueryV3472Fix2)',
              'showPositionsListFiltered(positionCategoryV3472Fix2,"Chiuse",positionOrderV3472Fix2,positionQueryV3472Fix2)',
              'stylePositionCategoryV3472(b,cat.equals(positionCategoryV3472Fix2))',
          ]:
              assert marker in s, marker

          for marker in [
              'closedPurchaseDateDialogV3472Fix1',
              'Inserisci data acquisto',
              'updateLatestClosedPurchaseDateV3472Fix1',
              'latestClosedSaleDateV3472Fix1',
          ]:
              assert marker in s or marker in d, marker

          for marker in [
              'V3472_FUNCTIONAL_BAR',
              'Tipologia ETF • ACC / DIV',
              'Data acquisto *',
              'Data scadenza certificato (facoltativa)',
              'new String[]{"Vendita","Richiamo","Scadenza"}',
          ]:
              assert marker in s, marker

          for marker in [
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'FIX2 imposta plusvalenza riparata',
              'Imposta su plusvalenza non valida: supera la plusvalenza lorda',
              'semanticSpanV3470Fix3(sp,amount.start(1),amount.end(),C_RED)',
          ]:
              assert marker in s, marker

          assert '"IMPOSTA","Imposta su plusvalenza",safeCapitalGainTax' in d
          assert 'safeCapitalGainTax>Math.max(0,plGross)+0.01' in compact(d)

          for marker in [
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'applyHistoricalUiSafetyV3462',
          ]:
              assert marker in s, marker

          assert re.search(r'cv\.put\(\s*"price"\s*,\s*baseline\s*\[\s*i\s*\]\s*\)', s)
          assert re.search(r'current_value\s*=\s*quantity\s*\*\s*price', s)
          assert 'UPDATEportfolio_statusSETcash=0,total_value=COALESCE(invested,0)' in compact(s)

          m1 = re.search(r'void\s+repairTradeRepublicPlaceholderPricesV3464\s*\(\s*\)\s*\{', s)
          assert m1
          m2 = re.search(r'void\s+applyDashboardCashUiV3464\s*\(\s*\)\s*\{', s[m1.end():])
          assert m2
          repair = s[m1.start():m1.end() + m2.start()]
          rc = compact(repair)
          assert 'cv.put("quantity"' not in rc
          assert 'cv.put("pmc"' not in rc

          print('V3.4.72 FIX3 compile fix + synchronized filters + all safety regressions OK')
          PY3472FIX3CHECK

      - name: Patch V3.4.72 FIX4 FIX2 single filter state and immediate visual sync
        shell: bash
        run: |
          python3 - <<'PY3472FIX4FIX2'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'
          main=main_path.read_text(encoding='utf-8')
          db=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          if 'versionCode 120' not in gradle: raise RuntimeError('FIX3 versionCode missing')
          if 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix3"' not in gradle: raise RuntimeError('FIX3 versionName missing')
          if 'DEV 3.4.72 FIX3' not in main: raise RuntimeError('FIX3 label missing')

          gradle=gradle.replace('versionCode 120','versionCode 123',1)
          gradle=gradle.replace('versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix3"','versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix4-fix2"',1)
          main=main.replace('DEV 3.4.72 FIX3','DEV 3.4.72 FIX4 FIX2',1)

          # FIX2 created a second filter state and then replaced the original button
          # listeners asynchronously. That allowed the visible selection and the real
          # category/state/query/order to diverge. Remove that overlay completely and
          # keep the original showPositionsList local state as the sole filter state.
          main=main.replace('        positionCategoryV3472Fix2="Tutti"; // V3472_FIX3_DEFAULT_CATEGORY_COMPILE_FIX\n','',1)
          main=main.replace('        schedulePositionFilterBindingsV3472Fix2();\n','')
          main=main.replace('        syncPositionFilterStateV3472Fix2(category,state,order,query);\n','',1)

          helper_start=main.find('    String positionCategoryV3472Fix2="Tutti";')
          helper_end=main.find('    void showPositionDetail(String broker,String isin){',helper_start)
          if helper_start<0 or helper_end<0:
              raise RuntimeError('FIX2 duplicate filter helper block missing')
          main=main[:helper_start]+main[helper_end:]

          # The visual selection must come from the header generated by the exact
          # category/state parameters used to query rows. Apply it immediately,
          # including the zero-results path, instead of relying only on delayed tasks.
          sig='    void showPositionsListFiltered(String category,String state,String order,String query){'
          p=main.find(sig)
          if p<0: raise RuntimeError('showPositionsListFiltered missing')
          next_method=main.find('\n    android.widget.Button findPositionButtonV3472',p)
          if next_method<0: raise RuntimeError('filtered method end anchor missing')
          seg=main[p:next_method]
          head='content.addView(head);'
          if head not in seg: raise RuntimeError('results header insertion missing')
          marker='applyPositionFunctionalBarV3472(); /* V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC */'
          if marker not in seg:
              seg=seg.replace(head,head+marker,1)
          main=main[:p]+seg+main[next_method:]

          main_path.write_text(main,encoding='utf-8')
          db_path.write_text(db,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')
          print('V3.4.72 FIX4 FIX2 single-state filter patch applied')
          PY3472FIX4FIX2

      - name: Verify V3.4.72 FIX4 FIX2 filter behavior and all safety regressions
        shell: bash
        run: |
          python3 - <<'PY3472FIX4FIX2CHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')
          compact=lambda x:re.sub(r'\s+','',x)

          assert 'versionCode 123' in g
          assert 'versionName "3.4.72-dev-position-functional-bar-dialog-ui-fix4-fix2"' in g
          assert 'DEV 3.4.72 FIX4 FIX2' in s
          assert re.search(r'DB_VERSION\s*=\s*18',d)

          # There must be exactly one filter state: the original local arrays/listeners.
          for bad in ['positionCategoryV3472Fix2','positionStateV3472Fix2','positionOrderV3472Fix2','positionQueryV3472Fix2','syncPositionFilterStateV3472Fix2','applyPositionFilterBindingsV3472Fix2','schedulePositionFilterBindingsV3472Fix2','positionCategory=']:
              assert bad not in s, bad

          m=re.search(r'void\s+showPositionsList\s*\(String\s+initialCategory\)\s*\{',s); assert m
          n=s.find('\n    void showPositionsListFiltered',m.start()); assert n>m.start()
          list_body=s[m.start():n]
          assert 'final String[] category={initialCategory==null?"Tutti":initialCategory},state={"Aperte"},order={"Valore"};' in list_body
          assert 'category[0]=c;showPositionsListFiltered(category[0],state[0],order[0],search.getText().toString())' in list_body
          assert 'state[0]="Aperte";showPositionsListFiltered(category[0],state[0],order[0],search.getText().toString())' in list_body
          assert 'state[0]="Chiuse";showPositionsListFiltered(category[0],state[0],order[0],search.getText().toString())' in list_body
          assert 'order[0]=new String[]{"Valore","P/L","Nome"}[w];showPositionsListFiltered(category[0],state[0],order[0],search.getText().toString())' in list_body
          assert 'showPositionsListFiltered(category[0],state[0],order[0],x.toString())' in list_body

          fm=re.search(r'void\s+showPositionsListFiltered\s*\(String\s+category,String\s+state,String\s+order,String\s+query\)\s*\{',s); assert fm
          fn=s.find('\n    android.widget.Button findPositionButtonV3472',fm.start()); assert fn>fm.start()
          filtered=s[fm.start():fn]
          assert 'applyPositionFunctionalBarV3472(); /* V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC */' in filtered
          assert filtered.index('content.addView(head);') < filtered.index('V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC') < filtered.index('if(rows.isEmpty())')
          assert 'if(!category.equals("Tutti")&&!cat.equals(category))continue;' in filtered
          assert '(category.equals("Tutti")?"Tutti i titoli":category)+" • "+state+" • "+rows.size()+" risultati"' in filtered

          # Styling is summary-driven, so the highlighted category/state is the same
          # one displayed in the results header, including 0-result renders.
          assert 'String summary=findPositionSummaryV3472(content)' in s
          assert 'if(summary.startsWith("Tutti i titoli • "))selected="Tutti"' in s
          assert 'String[] cats={"Tutti","Azioni","ETF","ETP","Certificati","Altro"}' in s
          assert 'stylePositionCategoryV3472(findPositionButtonV3472(content,c),c.equals(selected))' in s

          # Lifecycle/accounting and critical V3.4.64 integrity protections unchanged.
          for marker in ['closedPurchaseDateDialogV3472Fix1','Inserisci data acquisto','updateLatestClosedPurchaseDateV3472Fix1','latestClosedSaleDateV3472Fix1','V3472_FUNCTIONAL_BAR','Tipologia ETF • ACC / DIV','Data acquisto *','Data scadenza certificato (facoltativa)','new String[]{"Vendita","Richiamo","Scadenza"}','repairInvalidCapitalGainTaxesV3470Fix2','FIX2 imposta plusvalenza riparata','Imposta su plusvalenza non valida: supera la plusvalenza lorda','semanticSpanV3470Fix3(sp,amount.start(1),amount.end(),C_RED)','positions_archive_before_delete_v3464','positions_block_tr_placeholder14_v3464','repairTradeRepublicPlaceholderPricesV3464','applyHistoricalUiSafetyV3462']:
              assert marker in s or marker in d, marker
          assert '"IMPOSTA","Imposta su plusvalenza",safeCapitalGainTax' in d
          assert 'safeCapitalGainTax>Math.max(0,plGross)+0.01' in compact(d)
          assert re.search(r'cv\.put\(\s*"price"\s*,\s*baseline\s*\[\s*i\s*\]\s*\)',s)
          assert re.search(r'current_value\s*=\s*quantity\s*\*\s*price',s)
          assert 'UPDATEportfolio_statusSETcash=0,total_value=COALESCE(invested,0)' in compact(s)
          m1=re.search(r'void\s+repairTradeRepublicPlaceholderPricesV3464\s*\(\s*\)\s*\{',s); assert m1
          m2=re.search(r'void\s+applyDashboardCashUiV3464\s*\(\s*\)\s*\{',s[m1.end():]); assert m2
          repair=s[m1.start():m1.end()+m2.start()];rc=compact(repair)
          assert 'cv.put("quantity"' not in rc and 'cv.put("pmc"' not in rc

          print('V3.4.72 FIX4 FIX2 verified: one filter state, immediate summary-driven selection, all safeguards intact')
          PY3472FIX4FIX2CHECK

      - name: Build signed V3.4.72 FIX4 FIX2 DEV Single-State Position Filters APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
