name: Build Portafoglio 2026 V3.4.42 DEV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3442.yml"
      - "portafoglio-v3442-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE" || (echo "Missing PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing PORTAFOGLIO_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing PORTAFOGLIO_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing PORTAFOGLIO_KEY_PASSWORD" && exit 1)

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"
          keytool -list -storetype PKCS12 \
            -keystore "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            -storepass "$STORE_PASSWORD" >/dev/null

      - name: Extract V3.4.42 DEV project
        run: |
          rm -rf android-project-v3442
          mkdir android-project-v3442
          unzip -q "portafoglio-v3442-dev.zip" -d android-project-v3442

      - name: Verify V3.4.42 DEV source
        run: |
          grep -q 'applicationId "it.portafoglio2026.v32"' android-project-v3442/app/build.gradle
          grep -q 'versionCode 84' android-project-v3442/app/build.gradle
          grep -q 'versionName "3.4.42-dev"' android-project-v3442/app/build.gradle
          grep -q 'DB_VERSION = 16' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'PORTAFOGLIO2026_V3442;16' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'if(oldVersion < 16)' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'annual_portfolio_history' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'sumGrossIncomeYearActive' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'saveAnnualPortfolioHistory' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'sumExternalDepositsYear' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'sumExternalWithdrawalsYear' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'sumNetIncomeYearActive' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'sumAdditionalTaxesYearActive' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'Dividendi e cedole incassati' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Flussi esterni: DA INSERIRE / VERIFICARE' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'non vengono più dedotti dalla differenza patrimoniale' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Inserisci versamenti/aumenti di capitale e prelievi reali' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'externalFlowStatsYear' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'sumKnownTaxesYearActive' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/DbHelper.java
          grep -q 'Versamenti / aumenti capitale' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Risultato patrimoniale al netto dei flussi' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Variazione patrimonio' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'non è il rendimento' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Risultato dopo perdita/minus' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'annualStatusLabel' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'DA CHIUDERE' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'TOTALE • tutti i portafogli' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'syncAnnualPortfolioRows' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'annualReturnFromCapitals' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'addLabeledField' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Chiudi anno' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Riapri anno' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'maybeAutoRefreshQuotes' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Borsa Italiana / Euronext • BID' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'historyMonthFinanceText' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Costi/tasse noti' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'Netto noto' android-project-v3442/app/src/main/java/it/portafoglio2026/v3/MainActivity.java
          grep -q 'android.permission.INTERNET' android-project-v3442/app/src/main/AndroidManifest.xml
          test -f android-project-v3442/ROADMAP-V3.4.19-AGGIORNATA.md

      - name: Build signed V3.4.42 DEV APK
        working-directory: android-project-v3442
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed APK
        run: |
          test -f android-project-v3442/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-project-v3442/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed DEV APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3442-DEV-SIGNED-APK
          path: android-project-v3442/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
