name: Build Portafoglio 2026 V3.4.86 FIX10 FIX6 LATEST Deterministic Screen Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix6-latest-deterministic-screen-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-full-app-color-hooks-FIX5.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-global-value-colors-FIX4-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-performance-sql-null-safe-FIX3.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-performance-safe-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-deterministic-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix9-performance-colors-stability.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact latest FIX5 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-full-app-color-hooks-FIX5.yml')
          if not wf.exists():
              raise RuntimeError('Missing latest FIX5 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                          continue
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact V3.4.86 FIX10 FIX4 FIX1 source',
              'Patch V3.4.86 FIX10 FIX5 Full App Color Hooks'
          ]

          for target in wanted:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('Latest FIX5 reconstructed')
          PYREPLAY

      - name: Patch FIX6 latest deterministic screen colors
        shell: bash
        run: |
          python3 - <<'PYFIX6'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          db=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 154' in gradle,'FIX5 versionCode')
          req('versionName "3.4.86-dev-fix10-fix5-full-app-color-hooks"' in gradle,'FIX5 versionName')
          req('DEV 3.4.86 FIX10 FIX5 FULL APP COLORS' in main,'FIX5 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',db) is not None,'DB18')

          gradle=gradle.replace('versionCode 154','versionCode 155',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix5-full-app-color-hooks"',
              'versionName "3.4.86-dev-fix10-fix6-latest-deterministic-screen-colors"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX5 FULL APP COLORS',
              'DEV 3.4.86 FIX10 FIX6 LATEST COLORS'
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          def replace_method(text,signature,replacement):
              p=text.find(signature)
              if p<0:
                  raise RuntimeError('Method not found: '+signature)
              o=text.find('{',p)
              c=matching_brace(text,o)
              return text[:p]+replacement+text[c+1:]

          # Track current screen using heading(), so colors are deterministic per screen.
          hm=re.search(r'\bvoid\s+heading\s*\(([^)]*)\)\s*\{',main)
          req(hm is not None,'heading(...) found')
          params=hm.group(1).strip()
          first=params.split(',')[0].strip()
          title_var=first.split()[-1].replace('...','').strip()
          ho=main.find('{',hm.start())
          hc=matching_brace(main,ho)
          hbody=main[hm.start():hc+1]
          assign='currentColorScreenV3492=(' + title_var + '==null?"":' + title_var + '.trim());'
          if assign not in hbody:
              hbody=hbody[:hbody.find('{')+1]+'\n        '+assign+hbody[hbody.find('{')+1:]
          main=main[:hm.start()]+hbody+main[hc+1:]

          helpers=r'''
              String currentColorScreenV3492="";

              boolean textHasAnyV3492(String low,String... keys){
                  if(low==null||keys==null)return false;
                  for(String k:keys){
                      if(k!=null&&low.contains(k))return true;
                  }
                  return false;
              }

              int deterministicModeV3492(String screen,String s){
                  if(s==null)return 0;
                  String low=s.toLowerCase(java.util.Locale.ROOT);
                  String sc=screen==null?"":screen.toLowerCase(java.util.Locale.ROOT);

                  boolean cost=textHasAnyV3492(
                      low,
                      "ritenuta","tobin tax","commission","imposta","imposte",
                      "tassazione","costi/tasse","costi fiscali","altre tasse",
                      "minusvalenz","perdita","minus"
                  );
                  boolean income=textHasAnyV3492(
                      low,
                      "provent","dividend","cedol","distribuz","interessi",
                      "premio","saveback","recupero fiscale"
                  );
                  boolean signed=textHasAnyV3492(
                      low,
                      "p/l","rendimento","risultato","guadagno/perdita",
                      "plusvalenz","netto ytd"
                  );
                  boolean neutral=textHasAnyV3492(
                      low,
                      "patrimonio","valore titoli","liquidità","liquidita",
                      "capitale proprio","capitale iniziale","investito",
                      "round up","versamento","prelievo","pmc","prezzo","q.tà","q.ta"
                  );

                  if(sc.contains("performance")){
                      if(cost)return 2;
                      if(textHasAnyV3492(low,"lordo","netto","provent"))return 1;
                      if(signed)return 3;
                      if(low.matches("(?s).*\\d{2}/\\d{2}/\\d{4}.*€.*"))return 3;
                      return neutral?4:0;
                  }

                  if(sc.contains("provent")){
                      if(cost)return 2;
                      if(income||low.contains("lordo")||low.contains("netto"))return 1;
                      return neutral?4:0;
                  }

                  if(sc.contains("storico")||sc.contains("moviment")){
                      if(cost)return 2;
                      if(textHasAnyV3492(low,"saveback","premio","provent","dividend","cedol"))return 1;
                      if(neutral)return 4;
                      if(signed)return 3;
                      return 0;
                  }

                  if(sc.contains("portafoglio 2026")||sc.equals("home")){
                      if(cost)return 2;
                      if(low.contains("proventi lordi"))return 1;
                      if(signed)return 3;
                      if(neutral)return 4;
                      return 0;
                  }

                  if(cost)return 2;
                  if(income)return 1;
                  if(signed)return 3;
                  if(neutral)return 4;
                  return 0;
              }

              void colorMoneyOnlyV3492(
                  android.text.SpannableString sp,
                  String s,
                  int mode
              ){
                  java.util.regex.Matcher m=java.util.regex.Pattern.compile(
                      "([+\\-]?[0-9][0-9\\.,]*)\\s*€"
                  ).matcher(s);
                  while(m.find()){
                      double n=parseSemanticNumberV3483(m.group(1));
                      int color=android.graphics.Color.WHITE;
                      if(mode==1){
                          color=semanticIncomeColorV3483(n);
                      }else if(mode==2){
                          color=Math.abs(n)<=0.0000001
                              ?android.graphics.Color.WHITE:C_RED;
                      }else if(mode==3){
                          color=semanticSignedColorV3483(n);
                      }
                      semanticAmountSpanV3483(sp,m.start(1),m.end(),color);
                  }
              }

              boolean styleDeterministicScreenTextV3492(android.widget.TextView t){
                  if(t==null)return false;
                  if(t instanceof android.widget.EditText)return false;
                  if(t instanceof android.widget.Button)return false;

                  CharSequence q=t.getText();
                  if(q==null)return false;
                  String s=q.toString();
                  if(s.trim().isEmpty())return false;

                  int mode=deterministicModeV3492(currentColorScreenV3492,s);
                  if(mode==0)return false;

                  android.text.SpannableString sp=new android.text.SpannableString(s);

                  sp.setSpan(
                      new android.text.style.ForegroundColorSpan(android.graphics.Color.WHITE),
                      0,sp.length(),android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );
                  sp.setSpan(
                      new android.text.style.StyleSpan(android.graphics.Typeface.BOLD),
                      0,sp.length(),android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );

                  if(mode!=4){
                      colorMoneyOnlyV3492(sp,s,mode);
                  }

                  t.setTextColor(android.graphics.Color.WHITE);
                  t.setText(sp);
                  t.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD);
                  return true;
              }
          '''

          last=main.rfind('}')
          req(last>=0,'MainActivity closing brace')
          main=main[:last]+'\n'+helpers+'\n'+main[last:]

          # Global pass uses ONLY the deterministic formatter.
          global_text=r'''void styleGlobalSemanticTextV3483(android.widget.TextView t){
                  if(t==null)return;
                  styleDeterministicScreenTextV3492(t);
              }'''
          main=replace_method(
              main,
              'void styleGlobalSemanticTextV3483(android.widget.TextView t)',
              global_text
          )

          # FIX5 routed through broad regex formatter. Remove that route completely.
          direct=r'''boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t){
                  return styleDeterministicScreenTextV3492(t);
              }'''
          main=replace_method(
              main,
              'boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t)',
              direct
          )

          # Home KPI cards: label and value are separate TextViews.
          kpi=r'''void styleSemanticKpiGroupV3486Fix7(android.view.ViewGroup g){
                  if(g==null||g.getChildCount()>8)return;
                  java.util.ArrayList<android.widget.TextView> all=new java.util.ArrayList<>();
                  collectLocalKpiTextV3489(g,all);
                  if(all.size()<2||all.size()>12)return;

                  StringBuilder labels=new StringBuilder();
                  java.util.ArrayList<android.widget.TextView> vals=new java.util.ArrayList<>();

                  for(android.widget.TextView tv:all){
                      if(tv==null||tv.getText()==null)continue;
                      String x=tv.getText().toString().trim();
                      if(x.isEmpty())continue;
                      if(x.matches("[+\\-]?[0-9][0-9\\.,]*\\s*(€|%)?")){
                          vals.add(tv);
                      }else{
                          if(labels.length()>0)labels.append(" ");
                          labels.append(x.toLowerCase(java.util.Locale.ROOT));
                      }
                  }

                  if(vals.isEmpty())return;

                  String low=labels.toString();
                  int mode=4;

                  if(textHasAnyV3492(low,"ritenut","tobin","commission","impost","tassazione","costi")){
                      mode=2;
                  }else if(textHasAnyV3492(low,"proventi lordi","dividend","cedol","premio","saveback")){
                      mode=1;
                  }else if(textHasAnyV3492(low,"p/l","rendimento","risultato","plusvalenz","minusvalenz","perdita")){
                      mode=3;
                  }

                  for(android.widget.TextView v:vals){
                      double n=parseSemanticNumberV3483(v.getText().toString());
                      int color=android.graphics.Color.WHITE;

                      if(mode==1){
                          color=semanticIncomeColorV3483(n);
                      }else if(mode==2){
                          color=Math.abs(n)<=0.0000001
                              ?android.graphics.Color.WHITE:C_RED;
                      }else if(mode==3){
                          color=semanticSignedColorV3483(n);
                      }

                      v.setTextColor(color);
                      v.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD);
                  }
              }'''
          main=replace_method(
              main,
              'void styleSemanticKpiGroupV3486Fix7(android.view.ViewGroup g)',
              kpi
          )

          # Keep one delayed pass only.
          schedule=r'''void scheduleGlobalSemanticColorsV3483(){
                  if(content==null)return;
                  content.postDelayed(new Runnable(){
                      @Override public void run(){
                          applyGlobalSemanticColorsV3483(content);
                      }
                  },100);
              }'''
          main=replace_method(
              main,
              'void scheduleGlobalSemanticColorsV3483()',
              schedule
          )

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('LATEST FIX6 applied: deterministic per-screen color rules')
          PYFIX6

      - name: Verify FIX6 latest deterministic colors
        shell: bash
        run: |
          python3 - <<'PYCHECK6'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 155' in g,'versionCode 155')
          req('versionName "3.4.86-dev-fix10-fix6-latest-deterministic-screen-colors"' in g,'latest FIX6 version')
          req('DEV 3.4.86 FIX10 FIX6 LATEST COLORS' in s,'latest visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          for marker in [
              'String currentColorScreenV3492=""',
              'deterministicModeV3492',
              'styleDeterministicScreenTextV3492',
              'colorMoneyOnlyV3492',
              '"([+\\\\-]?[0-9][0-9\\\\.,]*)\\\\s*€"',
              '"round up","versamento","prelievo"',
              'currentColorScreenV3492=('
          ]:
              req(marker in s,'deterministic marker '+marker)

          req(
              'boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t){\n                  return styleDeterministicScreenTextV3492(t);' in s,
              'old broad formatter replaced by deterministic formatter'
          )

          req(
              'styleDeterministicScreenTextV3492(t);' in s,
              'global TextView hook uses deterministic formatter'
          )

          # Critical regression protection: FIX3 Performance crash remains solved.
          sig='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          p=s.find(sig)
          req(p>=0,'Performance cost engine preserved')
          req(
              'boolean total=(broker==null)||TOTAL.equals(broker);' in s[p:p+6000],
              'Performance Totale remains SQL null-safe'
          )

          req('},100);' in s,'single 100ms global pass')
          req('new int[]{0,120,360,900}' not in s,'old multi-pass scheduler absent')

          for marker in [
              '"Q.tà "+quantityItV3470(r.qty)',
              'decimalInputItV3470(r.pmc)+" €"',
              'decimalInputItV3470(r.price)+" €"',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462',
              'Performance = proventi lordi + P/L realizzato lordo.'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('LATEST FIX6 verified')
          PYCHECK6

      - name: Build signed FIX6 latest APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed FIX6 latest APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX6 latest signed APK verified"

      - name: Upload signed FIX6 latest APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX6-LATEST-DETERMINISTIC-SCREEN-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
