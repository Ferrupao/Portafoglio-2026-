name: Build Portafoglio 2026 V3.4.53 DEV Startup Recursion Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3453-startup-recursion-fix.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Extract V3.4.44 source
        run: |
          rm -rf android-project-v3453
          mkdir android-project-v3453
          unzip -q "portafoglio-v3444-dev.zip" -d android-project-v3453

      - name: Patch V3.4.53
        shell: bash
        run: |
          cat > /tmp/make_v3453.py <<'PY'
          from pathlib import Path

          root = Path("android-project-v3453")
          main_path = root / "app/src/main/java/it/portafoglio2026/v3/MainActivity.java"
          db_path = root / "app/src/main/java/it/portafoglio2026/v3/DbHelper.java"
          gradle_path = root / "app/build.gradle"

          main = main_path.read_text(encoding="utf-8")
          db = db_path.read_text(encoding="utf-8")
          gradle = gradle_path.read_text(encoding="utf-8")

          assert 'versionCode 86' in gradle
          assert 'versionName "3.4.44-dev"' in gradle
          assert 'DB_VERSION = 16' in db
          assert 'void showHistory()' in main
          assert 'void showIncomeMonth(int month)' in main
          assert 'boolean isHistoricalAggregateIncome' in main

          gradle = gradle.replace('versionCode 86', 'versionCode 95', 1)
          gradle = gradle.replace(
              'versionName "3.4.44-dev"',
              'versionName "3.4.53-dev-startup-recursion-fix"',
              1
          )

          # Device DB is already at 17 after the recovery builds.
          db = db.replace('DB_VERSION = 16', 'DB_VERSION = 17', 1)

          # Keep the proven V3.4.49 fix for the Storico NPE.
          needle = 'Math.abs(autoGross)>0.0001?autoGross:'
          replacement = 'Math.abs(autoGross)>0.0001?Double.valueOf(autoGross):'
          count = main.count(needle)
          if count != 2:
              raise RuntimeError(f"Expected 2 V3.4.49 history ternaries, found {count}")
          main = main.replace(needle, replacement)

          # V3.4.53: keep the Home label aligned with the installed APK.
          home_version_hits = main.count("DEV 3.4.42")
          if home_version_hits < 1:
              raise RuntimeError("Home DEV 3.4.42 label not found")
          main = main.replace("DEV 3.4.42", "DEV 3.4.53")

          def matching_brace(text, open_pos):
              depth = 0
              i = open_pos
              in_str = in_char = in_line = in_block = False
              esc = False
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i+1 < len(text) else ""
                  if in_line:
                      if c == "\n": in_line = False
                      i += 1
                      continue
                  if in_block:
                      if c == "*" and n == "/":
                          in_block = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if in_str:
                      if esc: esc = False
                      elif c == "\\": esc = True
                      elif c == '"': in_str = False
                      i += 1
                      continue
                  if in_char:
                      if esc: esc = False
                      elif c == "\\": esc = True
                      elif c == "'": in_char = False
                      i += 1
                      continue
                  if c == "/" and n == "/":
                      in_line = True; i += 2; continue
                  if c == "/" and n == "*":
                      in_block = True; i += 2; continue
                  if c == '"':
                      in_str = True; i += 1; continue
                  if c == "'":
                      in_char = True; i += 1; continue
                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError("Unbalanced Java braces")

          def replace_method(text, signature, replacement_text):
              start = text.index(signature)
              open_pos = text.index("{", start)
              close_pos = matching_brace(text, open_pos)
              return text[:start] + replacement_text + text[close_pos+1:]

          # V3.4.52: synchronize the current-year annual_history row with the
          # live current-year values so Home and Storico use the same numbers.
          home_anchor = '    void showHome(){'
          if home_anchor not in main:
              raise RuntimeError("showHome anchor not found")

          annual_sync_helper = r'''
              void syncCurrentAnnualHistoryV3453(){
                  int y=dataYear();
                  if(db.isAnnualClosed(y))return;

                  if(!db.annualHistoryExists(y)){
                      db.saveAnnualHistory(
                          y,null,null,null,null,null,null,
                          inferAnnualStartingCapital(y),
                          null,null,
                          inferAnnualFinalCapital(y),
                          null,null,false,null,""
                      );
                  }

                  Double startCap=null,annualLoss=null,recovery=null;
                  Cursor c=db.annualHistory();
                  try{
                      while(c.moveToNext()){
                          if(c.getInt(c.getColumnIndexOrThrow("year"))!=y)continue;
                          startCap=getNullable(c,"starting_capital");
                          annualLoss=getNullable(c,"annual_loss");
                          recovery=getNullable(c,"fiscal_recovery");
                          break;
                      }
                  }finally{c.close();}

                  double gross=db.sumIncomeActive("gross");
                  double taxes=Math.max(0,db.sumIncomeTaxesActive());
                  Double grossBox=Double.valueOf(gross);
                  Double taxesBox=Double.valueOf(taxes);
                  Double afterMinus=annualResultAfterMinus(grossBox,annualLoss);
                  Double overall=annualOverallResult(grossBox,annualLoss,recovery,taxesBox);
                  Double rr=annualReturnFromResult(y,startCap,overall);

                  android.content.ContentValues cv=new android.content.ContentValues();
                  cv.put("gross_income",gross);
                  cv.put("portfolio_profit",gross);
                  if(afterMinus!=null)cv.put("net_income",afterMinus);
                  cv.put("annual_taxes",taxes);
                  if(overall!=null)cv.put("overall_result",overall);
                  if(rr!=null)cv.put("return_rate",rr);

                  db.getWritableDatabase().update(
                      "annual_history",cv,"year=?",
                      new String[]{String.valueOf(y)}
                  );
              }

          '''
          main = main.replace(home_anchor, annual_sync_helper + home_anchor, 1)

          # Repair the stale current-year row before Home reads annual_history.
          main = main.replace(
              home_anchor,
              '    void showHome(){syncCurrentAnnualHistoryV3453();',
              1
          )

          # Helpers: monthly values only from genuinely dated records.
          helper_anchor = '    void showIncome(){'
          if helper_anchor not in main:
              raise RuntimeError("showIncome anchor not found")

          helpers = r'''
              boolean incomeRowForYearMonth(Cursor c,int year,int month){
                  int di=c.getColumnIndex("date"),mi=c.getColumnIndex("month");
                  if(di<0||c.isNull(di))return false;
                  String dt=c.getString(di);
                  if(dt==null||dt.length()<7||!dt.startsWith(String.valueOf(year)+"-"))return false;
                  if(month>0){
                      int cm=mi>=0&&!c.isNull(mi)?c.getInt(mi):0;
                      if(cm!=month)return false;
                  }
                  return true;
              }

              boolean historicalAggregateRow(Cursor c){
                  String b="",inst="",notes="";
                  int bi=c.getColumnIndex("broker"),ii=c.getColumnIndex("instrument"),ni=c.getColumnIndex("notes");
                  if(bi>=0&&!c.isNull(bi))b=c.getString(bi);
                  if(ii>=0&&!c.isNull(ii))inst=c.getString(ii);
                  if(ni>=0&&!c.isNull(ni))notes=c.getString(ni);
                  return isHistoricalAggregateIncome(b,inst,notes);
              }

              Cursor incomeCursorForBroker(String broker){
                  return broker==null?db.incomesActive():db.incomes(broker);
              }

              double datedIncomeMonth(String broker,int year,int month,String field){
                  double total=0;Cursor c=incomeCursorForBroker(broker);
                  try{
                      int fi=c.getColumnIndexOrThrow(field);
                      while(c.moveToNext()){
                          if(!incomeRowForYearMonth(c,year,month)||historicalAggregateRow(c))continue;
                          if(!c.isNull(fi))total+=c.getDouble(fi);
                      }
                  }finally{c.close();}
                  return total;
              }

              int datedIncomeCount(String broker,int year,int month){
                  int total=0;Cursor c=incomeCursorForBroker(broker);
                  try{
                      while(c.moveToNext())if(incomeRowForYearMonth(c,year,month)&&!historicalAggregateRow(c))total++;
                  }finally{c.close();}
                  return total;
              }

              boolean datedIncompleteNet(String broker,int year,int month){
                  Cursor c=incomeCursorForBroker(broker);
                  try{
                      while(c.moveToNext()){
                          if(!incomeRowForYearMonth(c,year,month)||historicalAggregateRow(c))continue;
                          int ai=c.getColumnIndex("amount_mode"),ni=c.getColumnIndex("notes");
                          String mode=ai>=0&&!c.isNull(ai)?c.getString(ai):"LORDO";
                          String notes=ni>=0&&!c.isNull(ni)?c.getString(ni):"";
                          String low=notes.toLowerCase(Locale.ROOT);
                          if(!"NETTO".equalsIgnoreCase(mode)&&low.contains("da completare")&&(low.contains("netto")||low.contains("imposte")))return true;
                      }
                  }finally{c.close();}
                  return false;
              }

              double datedKnownNet(String broker,int year,int month){
                  double total=0;Cursor c=incomeCursorForBroker(broker);
                  try{
                      while(c.moveToNext()){
                          if(!incomeRowForYearMonth(c,year,month)||historicalAggregateRow(c))continue;
                          int ai=c.getColumnIndex("amount_mode"),ni=c.getColumnIndex("notes"),neti=c.getColumnIndex("net");
                          String mode=ai>=0&&!c.isNull(ai)?c.getString(ai):"LORDO";
                          String notes=ni>=0&&!c.isNull(ni)?c.getString(ni):"";
                          String low=notes.toLowerCase(Locale.ROOT);
                          boolean incomplete=!"NETTO".equalsIgnoreCase(mode)&&low.contains("da completare")&&(low.contains("netto")||low.contains("imposte"));
                          if(!incomplete&&neti>=0&&!c.isNull(neti))total+=c.getDouble(neti);
                      }
                  }finally{c.close();}
                  return total;
              }

              double datedIncomeTaxes(String broker,int year,int month){
                  double total=0;Cursor c=incomeCursorForBroker(broker);
                  try{
                      while(c.moveToNext()){
                          if(!incomeRowForYearMonth(c,year,month)||historicalAggregateRow(c))continue;
                          int gi=c.getColumnIndex("gross"),ni=c.getColumnIndex("net"),ai=c.getColumnIndex("amount_mode");
                          String mode=ai>=0&&!c.isNull(ai)?c.getString(ai):"LORDO";
                          if("NETTO".equalsIgnoreCase(mode))continue;
                          double g=gi>=0&&!c.isNull(gi)?c.getDouble(gi):0;
                          double n=ni>=0&&!c.isNull(ni)?c.getDouble(ni):0;
                          total+=Math.max(0,g-n);
                      }
                  }finally{c.close();}
                  return total;
              }

              double historicalAggregateGross(String broker,int year){
                  double total=0;Cursor c=incomeCursorForBroker(broker);
                  try{
                      int gi=c.getColumnIndex("gross");
                      while(c.moveToNext()){
                          if(!incomeRowForYearMonth(c,year,0)||!historicalAggregateRow(c))continue;
                          if(gi>=0&&!c.isNull(gi))total+=c.getDouble(gi);
                      }
                  }finally{c.close();}
                  return total;
              }

              double[] monthlyIncomeForYear(String broker,int year){
                  double[] a=new double[12];
                  for(int m=1;m<=12;m++)a[m-1]=datedIncomeMonth(broker,year,m,"gross");
                  return a;
              }

          '''
          main = main.replace(helper_anchor, helpers + helper_anchor, 1)

          old_scope = 'double scopeIncomeMonth(int month,String field){return current.equals(TOTAL)?db.sumIncomeMonthActive(month,field):db.sumIncomeMonth(current,month,field);}'
          if old_scope not in main:
              raise RuntimeError("scopeIncomeMonth implementation not found")
          main = main.replace(
              old_scope,
              'double scopeIncomeMonth(int month,String field){return datedIncomeMonth(brokerFilter(),dataYear(),month,field);}',
              1
          )

          old_monthly = 'double[] monthlyIncome(String broker){double[] a=new double[12];for(int m=1;m<=12;m++)a[m-1]=broker==null?db.sumIncomeMonthActive(m,"gross"):db.sumIncomeMonth(broker,m,"gross");return a;}'
          if old_monthly not in main:
              raise RuntimeError("monthlyIncome implementation not found")
          main = main.replace(
              old_monthly,
              'double[] monthlyIncome(String broker){return monthlyIncomeForYear(broker,dataYear());}',
              1
          )

          # Proventi: month KPIs/counts must exclude historical aggregate rows.
          old_line = 'double incomeTaxes=broker==null?db.sumIncomeTaxesActive():db.sumIncomeTaxes(broker);double monthTaxes=broker==null?db.sumIncomeTaxesMonthActive(curMonth):db.sumIncomeTaxesMonth(broker,curMonth);boolean monthIncomplete=scopeIncompleteNetMonth(curMonth);double monthKnownNet=current.equals(TOTAL)?db.sumKnownNetMonthActive(curMonth):db.sumKnownNetMonth(current,curMonth);double monthNet=scopeIncomeMonth(curMonth,"net");'
          new_line = 'double incomeTaxes=broker==null?db.sumIncomeTaxesActive():db.sumIncomeTaxes(broker);double monthTaxes=datedIncomeTaxes(broker,dataYear(),curMonth);boolean monthIncomplete=datedIncompleteNet(broker,dataYear(),curMonth);double monthKnownNet=datedKnownNet(broker,dataYear(),curMonth);double monthNet=scopeIncomeMonth(curMonth,"net");'
          if old_line not in main:
              raise RuntimeError("showIncome monthly KPI line not found")
          main = main.replace(old_line, new_line, 1)

          old_months_card = 'LinearLayout monthsCard=card();monthsCard.addView(sectionTitle("Elenco proventi 2026 — mese per mese"));for(int m=1;m<=12;m++){final int month=m;double g=scopeIncomeMonth(m,"gross");Cursor cc=scopeIncomesForMonth(m);int cnt=cc.getCount();cc.close();if(g==0&&cnt==0&&m!=curMonth)continue;LinearLayout row=hrow();String movLabel=cnt==1?"1 movimento":cnt+" movimenti";TextView label=financeText(months[m-1]+"\\n"+euro.format(g)+" € • "+movLabel,13,C_GREEN,false);row.addView(label,new LinearLayout.LayoutParams(0,-2,1));Button open=ghostBtn("Apri ›");open.setOnClickListener(v->showIncomeMonth(month));row.addView(open,new LinearLayout.LayoutParams(dp(84),dp(46)));monthsCard.addView(row);}content.addView(monthsCard);'
          new_months_card = 'double historicalYtd=historicalAggregateGross(broker,dataYear());if(Math.abs(historicalYtd)>0.0001){LinearLayout historicalCard=card();historicalCard.addView(sectionTitle("Pregresso "+dataYear()+" non ripartito"));historicalCard.addView(financeText(euro.format(historicalYtd)+" € lordi",15,C_GREEN,true));historicalCard.addView(muted("Storico aggregato Directa: incluso nel totale annuale, ma escluso dai singoli mesi e dal grafico perché la data 31/08 è tecnica e non rappresenta il mese reale di accredito.",12));content.addView(historicalCard);}LinearLayout monthsCard=card();monthsCard.addView(sectionTitle("Elenco proventi 2026 — mese per mese"));for(int m=1;m<=12;m++){final int month=m;double g=scopeIncomeMonth(m,"gross");int cnt=datedIncomeCount(broker,dataYear(),m);if(g==0&&cnt==0&&m!=curMonth)continue;LinearLayout row=hrow();String movLabel=cnt==1?"1 movimento":cnt+" movimenti";TextView label=financeText(months[m-1]+"\\n"+euro.format(g)+" € • "+movLabel,13,C_GREEN,false);row.addView(label,new LinearLayout.LayoutParams(0,-2,1));Button open=ghostBtn("Apri ›");open.setOnClickListener(v->showIncomeMonth(month));row.addView(open,new LinearLayout.LayoutParams(dp(84),dp(46)));monthsCard.addView(row);}content.addView(monthsCard);'
          if old_months_card not in main:
              raise RuntimeError("showIncome months card not found")
          main = main.replace(old_months_card, new_months_card, 1)

          new_show_income_month = r'''    void showIncomeMonth(int month){
                  if(month<1||month>12){showIncome();return;}heading("Proventi • "+months[month-1],current);
                  Button back=btn("← Tutti i mesi");back.setOnClickListener(v->showIncome());content.addView(back);
                  String broker=brokerFilter();int year=dataYear();
                  double gross=datedIncomeMonth(broker,year,month,"gross"),net=datedIncomeMonth(broker,year,month,"net");
                  boolean incomplete=datedIncompleteNet(broker,year,month);
                  double knownNet=datedKnownNet(broker,year,month),taxesMonth=datedIncomeTaxes(broker,year,month);
                  int count=datedIncomeCount(broker,year,month);
                  LinearLayout summary=card();summary.addView(tv(months[month-1]+" "+year,19,true));LinearLayout mr1=hrow();mr1.addView(kpiValueColor("Lordo mese",euro.format(gross)+" €",C_GREEN),new LinearLayout.LayoutParams(0,-2,1));gap(mr1,6);mr1.addView(kpiValueColor(incomplete?"Netto noto":"Netto mese",euro.format(incomplete?knownNet:net)+" €",C_GREEN),new LinearLayout.LayoutParams(0,-2,1));summary.addView(mr1);gap(summary,6);LinearLayout mr2=hrow();mr2.addView(kpiValueColor("Tasse mese",euro.format(taxesMonth)+" €",C_RED),new LinearLayout.LayoutParams(0,-2,1));gap(mr2,6);mr2.addView(kpi("Movimenti",String.valueOf(count)),new LinearLayout.LayoutParams(0,-2,1));summary.addView(mr2);if(incomplete)summary.addView(muted("Netto mese parziale.",12));content.addView(summary);

                  LinkedHashMap<String,Double> groups=new LinkedHashMap<>();groups.put("Cedole",0.0);groups.put("Dividendi",0.0);groups.put("Distribuzioni",0.0);groups.put("Interessi",0.0);groups.put("Altri proventi",0.0);
                  LinkedHashMap<String,Double> brokers=new LinkedHashMap<>();Cursor agg=scopeIncomesForMonth(month);while(agg.moveToNext()){
                      String ab=agg.getString(agg.getColumnIndexOrThrow("broker")),inst=agg.getString(agg.getColumnIndexOrThrow("instrument"));int noteIdx=agg.getColumnIndex("notes");String notes=noteIdx>=0&&!agg.isNull(noteIdx)?agg.getString(noteIdx):"";
                      if(!incomeRowForYearMonth(agg,year,month)||isHistoricalAggregateIncome(ab,inst,notes))continue;
                      String t=incomeGroupLabel(agg.getString(agg.getColumnIndexOrThrow("income_type")));double g=agg.getDouble(agg.getColumnIndexOrThrow("gross"));groups.put(t,groups.get(t)+g);brokers.put(ab,brokers.containsKey(ab)?brokers.get(ab)+g:g);
                  }agg.close();
                  LinearLayout breakdown=card();breakdown.addView(tv("Composizione del mese",17,true));for(Map.Entry<String,Double> e:groups.entrySet())if(e.getValue()!=0){TextView pv=financeText(e.getKey()+": "+euro.format(e.getValue())+" €",13,C_GREEN,false);breakdown.addView(pv);};if(count==0)breakdown.addView(tv("Nessun provento datato in questo mese.",13,false));if(current.equals(TOTAL)&&!brokers.isEmpty()){breakdown.addView(tv("Per portafoglio",14,true));for(Map.Entry<String,Double> e:brokers.entrySet()){TextView pv=financeText(e.getKey()+": "+euro.format(e.getValue())+" €",13,C_GREEN,false);breakdown.addView(pv);};}content.addView(breakdown);

                  LinearLayout list=card();list.addView(tv("Movimenti di "+months[month-1],17,true));Cursor c=scopeIncomesForMonth(month);int n=0;while(c.moveToNext()){
                      long id=c.getLong(c.getColumnIndexOrThrow("id"));String b=c.getString(c.getColumnIndexOrThrow("broker")),dt=c.getString(c.getColumnIndexOrThrow("date")),inst=c.getString(c.getColumnIndexOrThrow("instrument")),ca=c.getString(c.getColumnIndexOrThrow("category")),rawType=c.getString(c.getColumnIndexOrThrow("income_type")),isinVal=c.getString(c.getColumnIndexOrThrow("isin"));double g=c.getDouble(c.getColumnIndexOrThrow("gross")),ne=c.getDouble(c.getColumnIndexOrThrow("net")),tr=c.getDouble(c.getColumnIndexOrThrow("tax_rate"));int mi=c.getColumnIndex("amount_mode");String mode=mi>=0&&!c.isNull(mi)?c.getString(mi):"LORDO";int noteIdx=c.getColumnIndex("notes");String notes=noteIdx>=0&&!c.isNull(noteIdx)?c.getString(noteIdx):"";
                      if(!incomeRowForYearMonth(c,year,month)||isHistoricalAggregateIncome(b,inst,notes))continue;
                      LinearLayout rr=new LinearLayout(this);rr.setOrientation(LinearLayout.HORIZONTAL);TextView tx=financeText(dt+" • "+b+"\n"+incomeGroupLabel(rawType)+" • "+inst+"\n"+incomeAmountLine(g,ne,mode,notes),13,C_GREEN,false);tx.setOnClickListener(v->showIncomeRecordDetail(dt,b,ca,rawType,inst,isinVal,g,ne,tr,mode,notes));rr.addView(tx,new LinearLayout.LayoutParams(0,-2,1));Button del=ghostBtn("×");del.setTextColor(C_RED);del.setOnClickListener(v->new AlertDialog.Builder(this).setMessage("Eliminare questo provento?").setPositiveButton("Elimina",(dd,w)->{db.deleteIncome(id);showIncomeMonth(month);}).setNegativeButton("Annulla",null).show());rr.addView(del,new LinearLayout.LayoutParams(dp(40),dp(40)));list.addView(rr);n++;
                  }c.close();if(n==0)list.addView(tv("Nessun movimento datato nel mese.",13,false));content.addView(list);

                  double historical=historicalAggregateGross(broker,year);
                  if(Math.abs(historical)>0.0001){LinearLayout info=card();info.addView(muted("Il pregresso Directa non ripartito ("+euro.format(historical)+" € lordi) non è attribuito a "+months[month-1]+".",12));content.addView(info);}
              }'''
          main = replace_method(main, '    void showIncomeMonth(int month)', new_show_income_month)

          new_show_history = r'''    void showHistory(){
                  heading("Storico",current);
                  ensureCurrentAnnualYearRecord();
                  syncAnnualPortfolioRows(calendarYear(),false);

                  ArrayList<Integer> years=new ArrayList<>();Cursor yc=db.annualHistory();while(yc.moveToNext()){int y=yc.getInt(yc.getColumnIndexOrThrow("year"));if(!years.contains(y))years.add(y);}yc.close();int currentDataYear=dataYear();if(!years.contains(currentDataYear))years.add(currentDataYear);java.util.Collections.sort(years,java.util.Collections.reverseOrder());

                  int savedYear=currentDataYear;try{savedYear=Integer.parseInt(db.getSetting("history_year_filter",String.valueOf(currentDataYear)));}catch(Exception ignored){}
                  if(!years.contains(savedYear))savedYear=years.isEmpty()?currentDataYear:years.get(0);
                  final int historyYear=savedYear;

                  LinearLayout filter=card();filter.addView(sectionTitle("Anno dello storico"));
                  String[] labels=new String[years.size()];int selectedIndex=0;for(int i=0;i<years.size();i++){labels[i]=String.valueOf(years.get(i));if(years.get(i)==historyYear)selectedIndex=i;}
                  Spinner yearSpinner=spinner(labels,selectedIndex);filter.addView(yearSpinner);
