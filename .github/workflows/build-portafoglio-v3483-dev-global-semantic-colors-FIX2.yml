name: Build Portafoglio 2026 V3.4.83 FIX2 Global Semantic Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3483-dev-global-semantic-colors-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3483-dev-global-semantic-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3483-dev-global-semantic-colors.yml"
      - ".github/workflows/build-portafoglio-v3482-dev-performance-root-fix.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.83 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          workflow_path=Path('.github/workflows/build-portafoglio-v3483-dev-global-semantic-colors.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing workflow: {workflow_path}')

          lines=workflow_path.read_text(encoding='utf-8').splitlines()
          parsed=[]; i=0
          while i<len(lines):
              line=lines[i]
              if not line.startswith('      - name: '):
                  i+=1; continue
              name=line[len('      - name: '):].strip()
              j=i+1; script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1; block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '): break
                          if raw.startswith('          '):
                              block.append(raw[10:]); k+=1; continue
                          if raw.strip()=='':
                              block.append(''); k+=1; continue
                          if raw.startswith('        '): break
                          block.append(raw); k+=1
                      script='\n'.join(block)+'\n'; break
                  j+=1
              if script is not None:
                  parsed.append((name,script))
              i=j if j>i else i+1

          start='Rebuild exact V3.4.82 source'
          end='Verify V3.4.83 global colors and all safety regressions'
          started=False; reached=False
          for name,script in parsed:
              if name==start:
                  started=True
              if not started:
                  continue
              print(f'===== REPLAY {name} =====')
              subprocess.run(
                  ['bash','-euo','pipefail','-c',script],
                  check=True,
                  env=os.environ.copy()
              )
              if name==end:
                  reached=True
                  break

          if not started or not reached:
              raise RuntimeError('Could not reconstruct exact V3.4.83 source')
          print('V3.4.83 reconstructed successfully')
          PYREPLAY

      - name: Patch V3.4.83 FIX2 cost precedence and year labels
        shell: bash
        run: |
          python3 - <<'PY3483FIX2'
          from pathlib import Path

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          if 'versionCode 141' not in gradle:
              raise RuntimeError('Expected V3.4.83 versionCode 141')
          if 'versionName "3.4.83-dev-global-semantic-colors"' not in gradle:
              raise RuntimeError('Expected V3.4.83 versionName')
          if 'DEV 3.4.83 GLOBAL COLORS' not in main:
              raise RuntimeError('Expected V3.4.83 visible label')

          gradle=gradle.replace('versionCode 141','versionCode 142',1)
          gradle=gradle.replace(
              'versionName "3.4.83-dev-global-semantic-colors"',
              'versionName "3.4.83-dev-global-semantic-colors-fix2"',
              1
          )
          main=main.replace(
              'DEV 3.4.83 GLOBAL COLORS',
              'DEV 3.4.83 FIX2 COLORS',
              1
          )

          method_start=main.find(
              'void styleGlobalSemanticTextV3483(android.widget.TextView t)'
          )
          if method_start<0:
              raise RuntimeError('styleGlobalSemanticTextV3483 not found')

          costs_start=main.find(
              'java.util.regex.Pattern costs=java.util.regex.Pattern.compile(',
              method_start
          )
          if costs_start<0:
              raise RuntimeError('costs Pattern start not found')

          income_start=main.find(
              'java.util.regex.Pattern income=java.util.regex.Pattern.compile(',
              costs_start
          )
          if income_start<0:
              raise RuntimeError('income Pattern start not found')

          robust_costs = r'''java.util.regex.Pattern costs=java.util.regex.Pattern.compile(
                      "(?i)(Commissione(?:\\s+acquisto\\s+residua)?"+
                      "|Commissioni(?:\\s+[0-9]{4})?"+
                      "|Imposta(?:\\s+su\\s+plusvalenza)?"+
                      "|Altre\\s+imposte(?:\\s+[0-9]{4})?"+
                      "|Imposte(?:\\s+(?:proventi|operazioni))?(?:\\s+[0-9]{4})?"+
                      "|Tasse(?:\\s+(?:proventi|registrate))?(?:\\s+YTD)?"+
                      "|Costi(?:\\s+totali)?)\\s*:?\\s*"+
                      "([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  '''
          main=main[:costs_start]+robust_costs+main[income_start:]

          a='applySemanticPatternV3483(sp,s,signed,0);'
          b='applySemanticPatternV3483(sp,s,costs,1);'
          c='applySemanticPatternV3483(sp,s,income,2);'
          d='applySemanticPatternV3483(sp,s,loss,3);'

          order_pos=main.find(a,method_start)
          if order_pos<0:
              raise RuntimeError('semantic apply block not found')

          method_end=main.find('t.setText(sp);', order_pos)
          if method_end<0:
              raise RuntimeError('semantic method end marker not found')

          block=main[order_pos:method_end]
          for marker in [a,b,c,d]:
              if marker not in block:
                  raise RuntimeError('Missing semantic call: '+marker)

          cleaned=block
          for marker in [a,b,c,d]:
              cleaned=cleaned.replace(marker,'',1)

          reordered=(
              a+'\n'
              '                  '+c+'\n'
              '                  '+d+'\n'
              '\n'
              '                  // FIX2: costs/taxes applied last for precedence.\n'
              '                  '+b+'\n'
          )

          main=main[:order_pos]+reordered+cleaned+main[method_end:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('V3.4.83 FIX2 applied: robust cost regex + tax precedence')
          PY3483FIX2

      - name: Verify V3.4.83 FIX2 semantic color regressions
        shell: bash
        run: |
          python3 - <<'PY3483FIX2CHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def require(cond,msg):
              if not cond:
                  raise RuntimeError(msg)
              print('OK:',msg)

          require('versionCode 142' in g,'versionCode 142')
          require(
              'versionName "3.4.83-dev-global-semantic-colors-fix2"' in g,
              'versionName FIX2'
          )
          require('DEV 3.4.83 FIX2 COLORS' in s,'visible FIX2 label')
          require(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB version 18')

          method=s.find('void styleGlobalSemanticTextV3483(android.widget.TextView t)')
          require(method>=0,'global semantic method present')
          window=s[method:method+14000]

          require('Altre\\\\s+imposte(?:\\\\s+[0-9]{4})?' in window,
                  'Altre imposte year handled')
          require('Tasse(?:\\\\s+(?:proventi|registrate))?' in window,
                  'Tasse proventi/registrate handled')

          signed=window.find('applySemanticPatternV3483(sp,s,signed,0);')
          income=window.find('applySemanticPatternV3483(sp,s,income,2);')
          loss=window.find('applySemanticPatternV3483(sp,s,loss,3);')
          costs=window.find('applySemanticPatternV3483(sp,s,costs,1);')
          require(min(signed,income,loss,costs)>=0,'all semantic passes present')
          require(signed<income<loss<costs,'cost/tax pass has final precedence')

          for marker in [
              'styleGlobalSemanticTextV3483',
              'applyGlobalSemanticColorsV3483',
              'scheduleGlobalSemanticColorsV3483',
              'stylePositionIncomeLabelV3478Fix1',
              'applyUpdatePortfolioSemanticColorsV3478',
              'stylePositionCardAmountTextV3473',
              'applyOperationSemanticColorsV3470Fix3',
              'boolean total=(broker==null)||TOTAL.equals(broker);',
              'String[] bargs=total?new String[]{}:new String[]{broker};',
              'applyHistoricalUiSafetyV3462',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'V3474_FIX2_NORMALIZED_BROKER_TOTALS',
              'V3474_FIX3_POSITION_FIRST_HOME_TOTAL',
              'V3473_POSITION_CARD_AMOUNT_COLORS',
              'V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC',
              'repairInvalidCapitalGainTaxesV3470Fix2',
          ]:
              require(marker in s or marker in d,'preserved '+marker)

          print('V3.4.83 FIX2 verified')
          PY3483FIX2CHECK

      - name: Build signed V3.4.83 FIX2 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.83 FIX2 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "V3.4.83 FIX1 signed APK verified"

      - name: Upload signed V3.4.83 FIX2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3483-FIX2-GLOBAL-SEMANTIC-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
