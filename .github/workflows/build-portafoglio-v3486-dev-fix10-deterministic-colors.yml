name: Build Portafoglio 2026 V3.4.86 FIX10 Deterministic Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-deterministic-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix9-performance-colors-stability.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix8-fiscal-labels-history-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix7-fiscal-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix6-global-colors-no-pac-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix6-global-colors-no-pac.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix5-neutral-own-capital.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.86 FIX9 source
        shell: bash
        run: |
          python3 - <<'PYREPLAYFIX10'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix9-performance-colors-stability.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX9 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact V3.4.86 FIX8 source',
              'Patch V3.4.86 FIX9 performance colors stability'
          ]
          for target in wanted:
              for name,script in steps:
                  if name==target:
                      print('===== REPLAY',target,'=====')
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing FIX9 replay step: '+target)

          print('FIX9 source reconstructed')
          PYREPLAYFIX10

      - name: Patch V3.4.86 FIX10 deterministic colors
        shell: bash
        run: |
          python3 - <<'PYFIX10'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          db_text=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 149' in gradle,'FIX9 versionCode')
          req('versionName "3.4.86-dev-fix9-performance-colors-stability"' in gradle,'FIX9 versionName')
          req('styleAllScreenFinanceV3486Fix6' in main,'FIX9 formatter')
          req('scheduleUniversalSemanticColorsV3479' in main,'legacy V3479 scheduler present')
          req(re.search(r'DB_VERSION\s*=\s*18',db_text) is not None,'DB18')

          gradle=gradle.replace('versionCode 149','versionCode 150',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix9-performance-colors-stability"',
              'versionName "3.4.86-dev-fix10-deterministic-colors"',
              1
          )

          # Normalize any stale visible build label.
          for old in [
              'DEV 3.4.86 FIX7 FISCO COLORS',
              'DEV 3.4.86 FIX8 FISCO COLORS',
              'DEV 3.4.86 FIX9 PERF COLORS'
          ]:
              main=main.replace(old,'DEV 3.4.86 FIX10 COLORS')
          main=re.sub(
              r'DEV 3\.4\.86 FIX(?:7|8|9|10)[^"\n]*COLORS',
              'DEV 3.4.86 FIX10 COLORS',
              main
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=False; inc=False; esc=False
              line=False; block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          def replace_method(text,sig,repl):
              p=text.find(sig)
              if p<0: raise RuntimeError('Missing method: '+sig)
              o=text.find('{',p)
              c=matching_brace(text,o)
              return text[:p]+repl+text[c+1:]

          # Root cause FIX9:
          # parseSemanticNumberV3483(s) received the whole label ("Commissioni 12,00 €"),
          # failed parsing because of letters and returned 0 => white.
          number_helper=r'''
              double semanticLineNumberV3490(String raw){
                  if(raw==null)return 0;
                  java.util.regex.Matcher m=java.util.regex.Pattern.compile(
                      "([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  ).matcher(raw);
                  String last=null;
                  while(m.find())last=m.group(1);
                  return last==null?0:parseSemanticNumberV3483(last);
              }
          '''
          last=main.rfind('}')
          main=main[:last]+'\n'+number_helper+'\n'+main[last:]

          # Fix the current formatter in place: use the LAST numeric token,
          # so "Ritenuta 26% ... 50,57 €" resolves to 50,57, not 26.
          sig='boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t)'
          p=main.find(sig)
          req(p>=0,'formatter signature')
          o=main.find('{',p); c=matching_brace(main,o)
          body=main[p:c+1]

          old_count=body.count('double n=parseSemanticNumberV3483(s);')
          req(old_count>=3,'whole-line numeric parser occurrences')
          body=body.replace(
              'double n=parseSemanticNumberV3483(s);',
              'double n=semanticLineNumberV3490(s);'
          )

          old_order='''applySemanticPatternV3483(sp,s,costs,1);
                  applySemanticPatternV3483(sp,s,signed,0);
                  applySemanticPatternV3483(sp,s,income,2);
                  applySemanticPatternV3483(sp,s,loss,3);'''
          new_order='''applySemanticPatternV3483(sp,s,signed,0);
                  applySemanticPatternV3483(sp,s,income,2);
                  applySemanticPatternV3483(sp,s,loss,3);
                  applySemanticPatternV3483(sp,s,costs,1);'''
          req(old_order in body,'semantic span order')
          body=body.replace(old_order,new_order,1)
          main=main[:p]+body+main[c+1:]

          # Legacy V3.4.79 still schedules its own formatter from heading().
          # Redirect it to the current formatter so it can no longer paint rows white.
          universal_schedule=r'''void scheduleUniversalSemanticColorsV3479(){
                  scheduleGlobalSemanticColorsV3483();
              }'''
          main=replace_method(
              main,
              'void scheduleUniversalSemanticColorsV3479()',
              universal_schedule
          )

          universal_apply=r'''void applyUniversalSemanticColorsV3479(android.view.View v){
                  applyGlobalSemanticColorsV3483(v);
              }'''
          main=replace_method(
              main,
              'void applyUniversalSemanticColorsV3479(android.view.View v)',
              universal_apply
          )

          # Also neutralize the old text formatter if anything calls it directly.
          universal_style=r'''void styleUniversalMetricTextV3479(android.widget.TextView t){
                  styleGlobalSemanticTextV3483(t);
              }'''
          main=replace_method(
              main,
              'void styleUniversalMetricTextV3479(android.widget.TextView t)',
              universal_style
          )

          # Explicit Performance summary gets final colors immediately,
          # independent of any delayed pass.
          perf_sig='void addPerformanceCostsSummary(double gross,double costs,boolean incomplete)'
          pp=main.find(perf_sig)
          req(pp>=0,'Performance summary method')
          po=main.find('{',pp); pc=matching_brace(main,po)
          perf=main[pp:pc+1]

          # Existing FIX8/FIX9 rows already set colors. Add an immediate local re-apply
          # just before the card is added, using the corrected deterministic formatter.
          anchor='content.addView(c);'
          req(anchor in perf,'Performance card add')
          if 'applyGlobalSemanticColorsV3483(c);' not in perf:
              perf=perf.replace(
                  anchor,
                  'applyGlobalSemanticColorsV3483(c);\n                  '+anchor,
                  1
              )
          main=main[:pp]+perf+main[pc+1:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX10 applied: exact numeric parsing + legacy formatter redirected')
          PYFIX10

      - name: Verify V3.4.86 FIX10
        shell: bash
        run: |
          python3 - <<'PYCHECKFIX10'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c: raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 150' in g,'versionCode 150')
          req('versionName "3.4.86-dev-fix10-deterministic-colors"' in g,'FIX10 version')
          req('DEV 3.4.86 FIX10 COLORS' in s,'FIX10 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          req('double semanticLineNumberV3490(String raw)' in s,'line number extractor')
          req('double n=semanticLineNumberV3490(s);' in s,'formatter uses extracted number')
          req('double n=parseSemanticNumberV3483(s);' not in s,'broken whole-line parse removed')

          req(
              'void scheduleUniversalSemanticColorsV3479(){\n                  scheduleGlobalSemanticColorsV3483();' in s,
              'legacy V3479 scheduler redirected'
          )
          req(
              'void applyUniversalSemanticColorsV3479(android.view.View v){\n                  applyGlobalSemanticColorsV3483(v);' in s,
              'legacy V3479 apply redirected'
          )
          req(
              'void styleUniversalMetricTextV3479(android.widget.TextView t){\n                  styleGlobalSemanticTextV3483(t);' in s,
              'legacy V3479 text formatter redirected'
          )

          # Costs must be applied last so "Ritenuta ... sui proventi" stays RED,
          # not recolored green by the word "proventi".
          order=[
              'applySemanticPatternV3483(sp,s,signed,0);',
              'applySemanticPatternV3483(sp,s,income,2);',
              'applySemanticPatternV3483(sp,s,loss,3);',
              'applySemanticPatternV3483(sp,s,costs,1);'
          ]
          pos=[s.find(x) for x in order]
          req(all(x>=0 for x in pos) and pos==sorted(pos),'cost semantic span applied last')

          req('applyGlobalSemanticColorsV3483(c);' in s,'Performance summary immediate color pass')

          # Formula sanity checks for the screenshot examples.
          # The extractor must select the last number, not the 26% inside the label.
          def parse_it(x):
              return float(x.replace('.','').replace(',','.'))
          import re as _re
          for raw,expected in [
              ('Commissioni 12,00 €',12.00),
              ('Ritenuta 26% sui proventi 50,57 €',50.57),
              ('Ritenuta su plusvalenza (26%) 33,10 €',33.10),
              ('Lordo 321,80 €',321.80),
              ('Netto 226,13 €',226.13),
          ]:
              vals=_re.findall(r'([+\-]?[0-9][0-9\.,]*)\s*(?:€|%)?',raw)
              val=parse_it(vals[-1])
              req(abs(val-expected)<0.001,'extract '+raw)

          for marker in [
              '"Q.tà "+quantityItV3470(r.qty)',
              'decimalInputItV3470(r.pmc)+" €"',
              'decimalInputItV3470(r.price)+" €"',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'V3474_FIX2_NORMALIZED_BROKER_TOTALS',
              'V3474_FIX3_POSITION_FIRST_HOME_TOTAL',
              'V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462',
              'Performance = proventi lordi + P/L realizzato lordo.'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('V3.4.86 FIX10 verified')
          PYCHECKFIX10

      - name: Build signed V3.4.86 FIX10 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.86 FIX10 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "V3.4.86 FIX10 signed APK verified"

      - name: Upload signed V3.4.86 FIX10 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-DETERMINISTIC-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
