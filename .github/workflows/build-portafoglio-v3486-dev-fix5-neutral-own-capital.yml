name: Build Portafoglio 2026 V3.4.86 FIX5 Neutral Own Capital

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix5-neutral-own-capital.yml"
      - ".github/workflows/build-portafoglio-v3485-dev-fix4-source-formatting-CORRETTO.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.85 FIX4 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY3486'
          from pathlib import Path
          import os, subprocess

          workflow_path=Path('.github/workflows/build-portafoglio-v3485-dev-fix4-source-formatting-CORRETTO.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing workflow: {workflow_path}')

          lines=workflow_path.read_text(encoding='utf-8').splitlines()
          parsed=[]; i=0
          while i<len(lines):
              line=lines[i]
              if not line.startswith('      - name: '):
                  i+=1; continue
              name=line[len('      - name: '):].strip()
              j=i+1; script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1; block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '): break
                          if raw.startswith('          '):
                              block.append(raw[10:]); k+=1; continue
                          if raw.strip()=='':
                              block.append(''); k+=1; continue
                          if raw.startswith('        '): break
                          block.append(raw); k+=1
                      script='\n'.join(block)+'\n'; break
                  j+=1
              if script is not None:
                  parsed.append((name,script))
              i=j if j>i else i+1

          start='Rebuild exact V3.4.84 FIX3 source'
          end='Verify V3.4.85 FIX4 source formatting and regressions'
          started=False; reached=False
          for name,script in parsed:
              if name==start:
                  started=True
              if not started:
                  continue
              print(f'===== REPLAY {name} =====')
              subprocess.run(['bash','-euo','pipefail','-c',script],check=True,env=os.environ.copy())
              if name==end:
                  reached=True
                  break

          if not started or not reached:
              raise RuntimeError('Could not reconstruct exact V3.4.85 FIX4 source')
          print('V3.4.85 FIX4 reconstructed successfully')
          PYREPLAY3486

      - name: Patch V3.4.86 FIX5 neutral own-capital summary
        shell: bash
        run: |
          python3 - <<'PY3486'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          if 'versionCode 144' not in gradle:
              raise RuntimeError('Expected V3.4.85 FIX4 versionCode 144')
          if 'versionName "3.4.85-dev-fix4-source-formatting"' not in gradle:
              raise RuntimeError('Expected V3.4.85 FIX4 versionName')
          if 'DEV 3.4.85 FIX4 FORMAT' not in main:
              raise RuntimeError('Expected V3.4.85 FIX4 visible label')

          gradle=gradle.replace('versionCode 144','versionCode 145',1)
          gradle=gradle.replace(
              'versionName "3.4.85-dev-fix4-source-formatting"',
              'versionName "3.4.86-dev-fix5-neutral-own-capital"',
              1
          )
          main=main.replace(
              'DEV 3.4.85 FIX4 FORMAT',
              'DEV 3.4.86 FIX5 CAPITAL',
              1
          )

          sig='void styleGlobalSemanticTextV3483(android.widget.TextView t)'
          p=main.find(sig)
          if p<0:
              raise RuntimeError('Global semantic formatter missing')

          anchor='String s=q.toString();'
          a=main.find(anchor,p)
          if a<0:
              raise RuntimeError('Global semantic string anchor missing')
          insert_at=a+len(anchor)

          guard = r'''
                  String lowNeutralV3486=s.toLowerCase(java.util.Locale.ROOT);
                  if(lowNeutralV3486.contains("round up / capitale proprio:")){
                      android.text.SpannableString neutralV3486=
                          new android.text.SpannableString(s);
                      neutralV3486.setSpan(
                          new android.text.style.ForegroundColorSpan(
                              android.graphics.Color.WHITE
                          ),
                          0,neutralV3486.length(),
                          android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                      );
                      neutralV3486.setSpan(
                          new android.text.style.StyleSpan(
                              android.graphics.Typeface.BOLD
                          ),
                          0,neutralV3486.length(),
                          android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                      );
                      t.setText(neutralV3486);
                      return;
                  }
          '''
          if 'lowNeutralV3486' not in main[p:p+5000]:
              main=main[:insert_at]+guard+main[insert_at:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('V3.4.86 FIX5 applied: own-capital summary neutral white')
          PY3486

      - name: Verify V3.4.86 FIX5 regression safety
        shell: bash
        run: |
          python3 - <<'PY3486CHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def require(cond,msg):
              if not cond:
                  raise RuntimeError(msg)
              print('OK:',msg)

          require('versionCode 145' in g,'versionCode 145')
          require('versionName "3.4.86-dev-fix5-neutral-own-capital"' in g,'V3.4.86 versionName')
          require('DEV 3.4.86 FIX5 CAPITAL' in s,'visible V3.4.86 label')
          require(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB version 18 unchanged')

          require('lowNeutralV3486.contains("round up / capitale proprio:")' in s,
                  'classified own-capital summary detected')
          require('neutralV3486' in s and 'android.graphics.Color.WHITE' in s,
                  'classified own-capital summary forced white')

          require('"Q.tà "+quantityItV3470(r.qty)' in s,'quantity formatting preserved')
          require('decimalInputItV3470(r.pmc)+" €"' in s,'PMC formatting preserved')
          require('decimalInputItV3470(r.price)+" €"' in s,'price formatting preserved')
          require('src.contains("PMC")&&src.contains("Prezzo"))return src;' in s,
                  'legacy position reformatter still blocked')

          for marker in [
              'stylePositionCardAmountTextV3473',
              'stylePositionIncomeLabelV3478Fix1',
              'applyOperationSemanticColorsV3470Fix3',
              'low.contains("premio")',
              'low.contains("saveback")',
              '!low.contains("capitale proprio")',
              'if(positionFinance)return;',
              'if(value>0.0000001)return C_GREEN;',
              'if(value<-0.0000001)return C_RED;',
              'if(Math.abs(value)<=0.0000001)return android.graphics.Color.WHITE;',
              'boolean total=(broker==null)||TOTAL.equals(broker);',
              'Performance = proventi lordi + P/L realizzato lordo.'
          ]:
              require(marker in s,'preserved '+marker)

          for marker in [
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'V3474_FIX2_NORMALIZED_BROKER_TOTALS',
              'V3474_FIX3_POSITION_FIRST_HOME_TOTAL',
              'V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462'
          ]:
              require(marker in s or marker in d,'preserved '+marker)

          print('V3.4.86 FIX5 verified: only own-capital summary color changed')
          PY3486CHECK

      - name: Build signed V3.4.86 FIX5 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.86 FIX5 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "V3.4.86 FIX5 signed APK verified"

      - name: Upload signed V3.4.86 FIX5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX5-NEUTRAL-OWN-CAPITAL-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
