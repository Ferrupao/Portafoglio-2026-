name: Build Portafoglio 2026 V3.4.13 Stable Beta

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build-v3413-stable-beta.yml"
      - "portafoglio-v3413-stable-beta.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.PORTAFOGLIO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing PORTAFOGLIO_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing PORTAFOGLIO_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing PORTAFOGLIO_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing PORTAFOGLIO_KEY_PASSWORD" && exit 1)

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.PORTAFOGLIO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/portafoglio2026-release.p12"
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Extract V3.4.13 Stable Beta project
        run: |
          rm -rf android-project-v3413
          mkdir android-project-v3413
          unzip -q portafoglio-v3413-stable-beta.zip -d android-project-v3413

      - name: Build signed V3.4.13 release APK
        working-directory: android-project-v3413
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed APK
        run: |
          test -f android-project-v3413/app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose --print-certs android-project-v3413/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed Stable Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3413-STABLE-BETA-SIGNED-APK
          path: android-project-v3413/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
