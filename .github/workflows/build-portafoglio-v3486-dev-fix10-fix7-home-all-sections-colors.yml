name: Build Portafoglio 2026 V3.4.86 FIX10 FIX7 HOME All Sections Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix7-home-all-sections-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix6-latest-deterministic-screen-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-full-app-color-hooks-FIX5.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.86 FIX10 FIX6 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-fix6-latest-deterministic-screen-colors.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX6 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                          continue
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact latest FIX5 source',
              'Patch FIX6 latest deterministic screen colors'
          ]
          for target in wanted:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('FIX6 reconstructed')
          PYREPLAY

      - name: Patch FIX7 HOME all sections colors
        shell: bash
        run: |
          python3 - <<'PYHOME'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 155' in gradle,'FIX6 versionCode')
          req('DEV 3.4.86 FIX10 FIX6 LATEST COLORS' in main,'FIX6 visible label')

          gradle=gradle.replace('versionCode 155','versionCode 156',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix6-latest-deterministic-screen-colors"',
              'versionName "3.4.86-dev-fix10-fix7-home-all-sections-colors"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX6 LATEST COLORS',
              'DEV 3.4.86 FIX10 FIX7 HOME COLORS'
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          # HOME is now explicitly responsible for its own color pass.
          hp=main.find('void showHome()')
          req(hp>=0,'showHome found')
          ho=main.find('{',hp)
          home_start='''{
                  homeColorSessionV3493++;
                  scheduleHomeColorsV3493(homeColorSessionV3493);'''
          main=main[:ho]+home_start+main[ho+1:]

          helpers=r'''
              int homeColorSessionV3493=0;

              boolean isHomeScreenV3493(){
                  String s=currentColorScreenV3492==null?"":currentColorScreenV3492.trim().toLowerCase(java.util.Locale.ROOT);
                  return s.equals("home") || s.contains("portafoglio 2026");
              }

              int homeModeV3493(String s){
                  if(s==null)return 0;
                  String low=s.toLowerCase(java.util.Locale.ROOT);

                  if(textHasAnyV3492(
                      low,
                      "ritenuta","ritenute","commission","tobin",
                      "imposta","imposte","tassazione","costi/tasse",
                      "costi fiscali","costi totali","minusvalenz","perdita"
                  ))return 2;

                  if(textHasAnyV3492(
                      low,
                      "proventi lordi","proventi netti","dividend","cedol",
                      "distribuz","interessi","premio","saveback",
                      "recupero fiscale"
                  ))return 1;

                  if(textHasAnyV3492(
                      low,
                      "p/l","rendimento","risultato","plusvalenz",
                      "guadagno/perdita","performance"
                  ))return 3;

                  if(textHasAnyV3492(
                      low,
                      "patrimonio","valore titoli","liquidità","liquidita",
                      "capitale","investito","versamenti","prelievi",
                      "pmc","prezzo","q.tà","q.ta"
                  ))return 4;

                  return 0;
              }

              void styleHomeTextV3493(android.widget.TextView t){
                  if(t==null)return;
                  if(t instanceof android.widget.EditText)return;
                  if(t instanceof android.widget.Button)return;
                  CharSequence q=t.getText();
                  if(q==null)return;
                  String s=q.toString();
                  if(s.trim().isEmpty())return;

                  int mode=homeModeV3493(s);
                  if(mode==0)return;

                  android.text.SpannableString sp=new android.text.SpannableString(s);
                  sp.setSpan(
                      new android.text.style.ForegroundColorSpan(android.graphics.Color.WHITE),
                      0,sp.length(),android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );

                  java.util.regex.Matcher money=java.util.regex.Pattern.compile(
                      "([+\\-]?[0-9][0-9\\.,]*)\\s*€"
                  ).matcher(s);

                  while(money.find()){
                      double n=parseSemanticNumberV3483(money.group(1));
                      int color=android.graphics.Color.WHITE;
                      if(mode==1){
                          color=semanticIncomeColorV3483(n);
                      }else if(mode==2){
                          color=Math.abs(n)<=0.0000001
                              ?android.graphics.Color.WHITE:C_RED;
                      }else if(mode==3){
                          color=semanticSignedColorV3483(n);
                      }
                      semanticAmountSpanV3483(
                          sp,money.start(1),money.end(),color
                      );
                  }

                  if(mode==3){
                      java.util.regex.Matcher pct=java.util.regex.Pattern.compile(
                          "([+\\-]?[0-9][0-9\\.,]*)\\s*%"
                      ).matcher(s);
                      while(pct.find()){
                          double n=parseSemanticNumberV3483(pct.group(1));
                          semanticAmountSpanV3483(
                              sp,pct.start(1),pct.end(),semanticSignedColorV3483(n)
                          );
                      }
                  }

                  t.setTextColor(android.graphics.Color.WHITE);
                  t.setText(sp);
                  t.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD);
              }

              void styleHomeKpiGroupV3493(android.view.ViewGroup g){
                  if(g==null || g.getChildCount()>10)return;

                  java.util.ArrayList<android.widget.TextView> all=
                      new java.util.ArrayList<>();
                  collectLocalKpiTextV3489(g,all);
                  if(all.size()<2 || all.size()>12)return;

                  java.lang.StringBuilder labels=new java.lang.StringBuilder();
                  java.util.ArrayList<android.widget.TextView> values=
                      new java.util.ArrayList<>();

                  for(android.widget.TextView tv:all){
                      if(tv==null || tv.getText()==null)continue;
                      String x=tv.getText().toString().trim();
                      if(x.isEmpty())continue;

                      if(x.matches("[+\\-]?[0-9][0-9\\.,]*\\s*(€|%)?")){
                          values.add(tv);
                      }else{
                          if(labels.length()>0)labels.append(" ");
                          labels.append(x);
                      }
                  }

                  if(values.isEmpty())return;
                  int mode=homeModeV3493(labels.toString());
                  if(mode==0)return;

                  for(android.widget.TextView tv:values){
                      String x=tv.getText().toString().trim();
                      double n=parseSemanticNumberV3483(x);
                      int color=android.graphics.Color.WHITE;

                      if(mode==1){
                          color=semanticIncomeColorV3483(n);
                      }else if(mode==2){
                          color=Math.abs(n)<=0.0000001
                              ?android.graphics.Color.WHITE:C_RED;
                      }else if(mode==3){
                          color=semanticSignedColorV3483(n);
                      }

                      tv.setTextColor(color);
                      tv.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD);
                  }
              }

              void applyHomeColorsV3493(android.view.View v){
                  if(v==null)return;

                  if(v instanceof android.widget.TextView){
                      styleHomeTextV3493((android.widget.TextView)v);
                      return;
                  }

                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      styleHomeKpiGroupV3493(g);
                      for(int i=0;i<g.getChildCount();i++){
                          applyHomeColorsV3493(g.getChildAt(i));
                      }
                  }
              }

              void scheduleHomeColorsV3493(final int token){
                  if(content==null)return;
                  final android.view.View root=content;

                  int[] delays=new int[]{70,220,600};
                  for(final int delay:delays){
                      content.postDelayed(new java.lang.Runnable(){
                          @Override public void run(){
                              if(token!=homeColorSessionV3493)return;
                              if(root!=content)return;
                              if(!isHomeScreenV3493())return;
                              applyHomeColorsV3493(root);
                          }
                      },delay);
                  }
              }
          '''

          last=main.rfind('}')
          req(last>=0,'MainActivity closing brace')
          main=main[:last]+'\n'+helpers+'\n'+main[last:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX7 HOME applied')
          PYHOME

      - name: Verify FIX7 HOME all sections colors
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 156' in g,'versionCode 156')
          req('versionName "3.4.86-dev-fix10-fix7-home-all-sections-colors"' in g,'FIX7 HOME versionName')
          req('DEV 3.4.86 FIX10 FIX7 HOME COLORS' in s,'FIX7 HOME visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          for marker in [
              'homeColorSessionV3493++',
              'scheduleHomeColorsV3493(homeColorSessionV3493);',
              'int homeColorSessionV3493=0;',
              'boolean isHomeScreenV3493()',
              'int homeModeV3493(String s)',
              'void styleHomeTextV3493',
              'void styleHomeKpiGroupV3493',
              'void applyHomeColorsV3493',
              'void scheduleHomeColorsV3493',
              'new int[]{70,220,600}',
              '"proventi lordi","proventi netti"',
              '"ritenuta","ritenute","commission","tobin"',
              '"patrimonio","valore titoli","liquidità","liquidita"',
              '"p/l","rendimento","risultato","plusvalenz"'
          ]:
              req(marker in s,'HOME marker '+marker)

          # Preserve the working Performance fix exactly.
          ps='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          pp=s.find(ps)
          req(pp>=0,'Performance cost engine preserved')
          req(
              'boolean total=(broker==null)||TOTAL.equals(broker);' in s[pp:pp+7000],
              'Performance Totale SQL null-safe preserved'
          )

          # FIX7 must be Home-only: no changes to DB or Performance logic.
          req('applyHomeColorsV3493(root);' in s,'HOME-local color traversal')
          req('if(!isHomeScreenV3493())return;' in s,'HOME guard prevents other tabs being touched')

          print('FIX7 HOME verified')
          PYCHECK

      - name: Build signed FIX7 HOME APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed FIX7 HOME APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX7 HOME signed APK verified"

      - name: Upload signed FIX7 HOME APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX7-HOME-ALL-SECTIONS-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
