name: Build Portafoglio 2026 V3.4.86 FIX8 Fiscal Labels History Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix8-fiscal-labels-history-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix7-fiscal-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix6-global-colors-no-pac-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix6-global-colors-no-pac.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix5-neutral-own-capital.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.86 FIX7 FIX1 source
        shell: bash
        run: |
          python3 - <<'PYREPLAYFIX8'
          from pathlib import Path
          import os, subprocess

          workflow_path=Path('.github/workflows/build-portafoglio-v3486-dev-fix7-fiscal-colors-FIX1.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing workflow: {workflow_path}')

          lines=workflow_path.read_text(encoding='utf-8').splitlines()
          parsed=[]
          i=0
          while i<len(lines):
              line=lines[i]
              if not line.startswith('      - name: '):
                  i+=1
                  continue
              name=line[len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  parsed.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact V3.4.86 FIX6 FIX2 source',
              'Patch V3.4.86 FIX7 FIX1 accounting and colors'
          ]
          for target in wanted:
              for name,script in parsed:
                  if name==target:
                      print('===== REPLAY',name,'=====')
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('V3.4.86 FIX7 FIX1 reconstructed successfully')
          PYREPLAYFIX8

      - name: Patch V3.4.86 FIX8 fiscal labels history colors
        shell: bash
        run: |
          python3 - <<'PYFIX8'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 147' in gradle,'FIX7 versionCode 147')
          req('versionName "3.4.86-dev-fix7-fix1-fiscal-colors"' in gradle,'FIX7 versionName')
          req('DEV 3.4.86 FIX7 FISCO COLORS' in main,'FIX7 visible label')
          req('styleSemanticKpiGroupV3486Fix7' in main,'FIX7 KPI formatter')
          req('addFiscalDrawerV3486Fix7' in main,'FIX7 fiscal drawer')
          req(re.search(r'DB_VERSION\s*=\s*18',db) is not None,'DB18 base')

          gradle=gradle.replace('versionCode 147','versionCode 148',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix7-fix1-fiscal-colors"',
              'versionName "3.4.86-dev-fix8-fiscal-labels-history-colors"',
              1
          )
          main=main.replace('DEV 3.4.86 FIX7 FISCO COLORS','DEV 3.4.86 FIX8 FISCO COLORS',1)

          def matching_brace(text,open_pos):
              depth=0
              ins=False
              inc=False
              esc=False
              line=False
              block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          def replace_method(text,signature,replacement):
              p=text.find(signature)
              if p<0:
                  raise RuntimeError('Missing method: '+signature)
              o=text.find('{',p)
              c=matching_brace(text,o)
              return text[:p]+replacement+text[c+1:]

          # 1) User-facing wording: no generic "imposte" labels.
          replacements=[
              ('Calcola imposta plusvalenza al 26%','Calcola ritenuta su plusvalenza al 26%'),
              ('Calcola imposta su plusvalenza al 26%','Calcola ritenuta su plusvalenza al 26%'),
              ('Imposta su plusvalenza €','Ritenuta su plusvalenza €'),
              ('Imposta plusvalenza €','Ritenuta su plusvalenza €'),
              ('Imposta su plusvalenza','Ritenuta su plusvalenza'),
              ('Imposta plusvalenza','Ritenuta su plusvalenza'),
              ('Altre imposte €','Altri costi fiscali €'),
              ('Altre imposte','Altri costi fiscali'),
              ('Totale imposte','Costi fiscali'),
              ('Imposte proventi','Ritenuta 26% sui proventi'),
              ('Imposte operazioni','Costi fiscali operazioni'),
              ('Tasse proventi YTD','Ritenute 26% proventi YTD'),
              ('Tasse/costi proventi','Costi fiscali proventi'),
              ('Costi/imposte operazioni','Costi fiscali operazioni'),
              ('Costi/imposte','Costi fiscali')
          ]
          for old,new in replacements:
              main=main.replace(old,new)

          # New sale rows use the precise label; internal cost_kind remains compatible.
          db=db.replace(
              '"IMPOSTA","Imposta su plusvalenza",safeCapitalGainTax',
              '"IMPOSTA","Ritenuta su plusvalenza 26%",safeCapitalGainTax'
          )
          db=db.replace(
              '"IMPOSTA","Ritenuta su plusvalenza",safeCapitalGainTax',
              '"IMPOSTA","Ritenuta su plusvalenza 26%",safeCapitalGainTax'
          )

          # 2) Recursive KPI color discovery (Home/Panoramica included).
          collect_helper=r'''
              void collectTextViewsV3488(android.view.View v,java.util.ArrayList<android.widget.TextView> out){
                  if(v==null)return;
                  if(v instanceof android.widget.TextView){
                      out.add((android.widget.TextView)v);
                      return;
                  }
                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      for(int i=0;i<g.getChildCount();i++)collectTextViewsV3488(g.getChildAt(i),out);
                  }
              }
          '''
          last=main.rfind('}')
          req(last>=0,'MainActivity closing brace')
          main=main[:last]+'\n'+collect_helper+'\n'+main[last:]

          kpi_method=r'''void styleSemanticKpiGroupV3486Fix7(android.view.ViewGroup g){
                  if(g==null)return;
                  java.util.ArrayList<android.widget.TextView> all=new java.util.ArrayList<>();
                  collectTextViewsV3488(g,all);
                  if(all.size()<2)return;

                  StringBuilder labels=new StringBuilder();
                  java.util.ArrayList<android.widget.TextView> vals=new java.util.ArrayList<>();
                  for(android.widget.TextView tv:all){
                      if(tv==null||tv.getText()==null)continue;
                      String x=tv.getText().toString().trim();
                      if(x.isEmpty())continue;
                      if(x.matches("[+\\-]?[0-9][0-9\\.,]*\\s*(€|%)?")){
                          vals.add(tv);
                      }else{
                          if(labels.length()>0)labels.append(" ");
                          labels.append(x.toLowerCase(java.util.Locale.ROOT));
                      }
                  }
                  if(vals.isEmpty()||labels.length()==0)return;
                  String low=labels.toString();

                  boolean cost=
                      low.contains("ritenut")||low.contains("tobin")||
                      low.contains("commission")||low.contains("costi")||
                      low.contains("tassazione")||low.contains("tasse")||
                      low.contains("impost");
                  boolean signed=
                      low.contains("provent")||low.contains("dividend")||
                      low.contains("cedol")||low.contains("premio")||
                      low.contains("saveback")||low.contains("recupero fiscale")||
                      low.contains("p/l")||low.contains("risultato")||
                      low.contains("rendimento")||low.contains("plusvalenz")||
                      low.contains("minusvalenz")||low.contains("perdita");

                  for(android.widget.TextView v:vals){
                      double n=parseSemanticNumberV3483(v.getText().toString());
                      int color=android.graphics.Color.WHITE;
                      if(cost){
                          color=Math.abs(n)<=0.0000001?android.graphics.Color.WHITE:C_RED;
                      }else if(signed){
                          color=semanticSignedColorV3483(n);
                      }
                      v.setTextColor(color);
                      v.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD);
                  }
              }'''
          main=replace_method(main,'void styleSemanticKpiGroupV3486Fix7(android.view.ViewGroup g)',kpi_method)

          main=main.replace(
              'low.contains("tassazione")||low.contains("tasse")',
              'low.contains("tassazione")||low.contains("ritenuta")||low.contains("tobin")||low.contains("tasse")'
          )

          # 3) Fiscal recognition helpers.
          fiscal_helpers=r'''
              double lastPerfIncome26V3488=0;
              double lastPerfIncomeOtherV3488=0;
              double lastPerfCapitalGainWithholdingV3488=0;
              double lastPerfTobinV3488=0;
              double lastPerfOtherFiscalV3488=0;

              boolean approx26V3488(double tax,double base){
                  if(base<=0||tax<0)return false;
                  double expected=base*0.26;
                  double tolerance=Math.max(0.02,Math.abs(expected)*0.01);
                  return Math.abs(tax-expected)<=tolerance;
              }

              double annualFiscalCostByTypeV3488(int year,String token){
                  android.database.Cursor c=db.getReadableDatabase().rawQuery(
                      "SELECT c.amount,c.cost_type FROM cost_records c "+
                      "JOIN portfolios p ON p.name=c.broker "+
                      "WHERE p.active=1 AND substr(c.date,1,4)=? "+
                      "AND upper(COALESCE(c.cost_kind,''))='IMPOSTA'",
                      new String[]{String.valueOf(year)}
                  );
                  double out=0;
                  try{
                      while(c.moveToNext()){
                          String type=c.isNull(1)?"":c.getString(1);
                          if(type.toUpperCase(java.util.Locale.ROOT).contains(token))
                              out+=Math.abs(c.getDouble(0));
                      }
                  }finally{c.close();}
                  return out;
              }

              double annualCommissionV3488(int year){
                  android.database.Cursor c=db.getReadableDatabase().rawQuery(
                      "SELECT COALESCE(SUM(ABS(c.amount)),0) FROM cost_records c "+
                      "JOIN portfolios p ON p.name=c.broker "+
                      "WHERE p.active=1 AND substr(c.date,1,4)=? "+
                      "AND upper(COALESCE(c.cost_kind,''))='COMMISSIONE'",
                      new String[]{String.valueOf(year)}
                  );
                  try{return c.moveToFirst()&&!c.isNull(0)?c.getDouble(0):0;}
                  finally{c.close();}
              }

              double annualCapitalGainWithholdingV3488(int year){
                  android.database.Cursor c=db.getReadableDatabase().rawQuery(
                      "SELECT c.amount,c.cost_type FROM cost_records c "+
                      "JOIN portfolios p ON p.name=c.broker "+
                      "WHERE p.active=1 AND substr(c.date,1,4)=? "+
                      "AND upper(COALESCE(c.cost_kind,''))='IMPOSTA'",
                      new String[]{String.valueOf(year)}
                  );
                  double out=0;
                  try{
                      while(c.moveToNext()){
                          String type=c.isNull(1)?"":c.getString(1);
                          if(type.toUpperCase(java.util.Locale.ROOT).contains("PLUSVALENZA"))
                              out+=Math.abs(c.getDouble(0));
                      }
                  }finally{c.close();}
                  return out;
              }

              double annualTobinV3488(int year){
                  return annualFiscalCostByTypeV3488(year,"TOBIN");
              }

              double annualOtherFiscalV3488(int year){
                  android.database.Cursor c=db.getReadableDatabase().rawQuery(
                      "SELECT c.amount,c.cost_type FROM cost_records c "+
                      "JOIN portfolios p ON p.name=c.broker "+
                      "WHERE p.active=1 AND substr(c.date,1,4)=? "+
                      "AND upper(COALESCE(c.cost_kind,''))='IMPOSTA'",
                      new String[]{String.valueOf(year)}
                  );
                  double out=0;
                  try{
                      while(c.moveToNext()){
                          String type=c.isNull(1)?"":c.getString(1);
                          String u=type.toUpperCase(java.util.Locale.ROOT);
                          if(u.contains("PLUSVALENZA")||u.contains("TOBIN"))continue;
                          out+=Math.abs(c.getDouble(0));
                      }
                  }finally{c.close();}
                  return out;
              }
          '''
          last=main.rfind('}')
          main=main[:last]+'\n'+fiscal_helpers+'\n'+main[last:]

          # 4) Performance: split 26%, Tobin Tax, commissions and other costs.
          performance_method=r'''double performanceCostsForPeriod(String broker,int year,int month,String day){
                  lastPerfCommissionV3470=0;
                  lastPerfOperationTaxV3470=0;
                  lastPerfIncomeTaxV3470=0;
                  lastPerfIncome26V3488=0;
                  lastPerfIncomeOtherV3488=0;
                  lastPerfCapitalGainWithholdingV3488=0;
                  lastPerfTobinV3488=0;
                  lastPerfOtherFiscalV3488=0;

                  android.database.sqlite.SQLiteDatabase w=db.getReadableDatabase();
                  boolean total=TOTAL.equals(broker);
                  String bwhere=total?"broker IN (SELECT name FROM portfolios WHERE active=1)":"broker=?";
                  String[] bargs=total?new String[]{}:new String[]{broker};

                  android.database.Cursor ci=w.rawQuery(
                      "SELECT date,gross,net,tax_rate,amount_mode FROM income_records WHERE "+bwhere,bargs
                  );
                  try{
                      while(ci.moveToNext()){
                          String dt=ci.getString(0);
                          if(!dateMatchesPerformancePeriod(dt,year,month,day))continue;
                          String mode=ci.isNull(4)?"LORDO":ci.getString(4);
                          double gross=ci.isNull(1)?0:ci.getDouble(1);
                          double net=ci.isNull(2)?gross:ci.getDouble(2);
                          double withholding=!"NETTO".equalsIgnoreCase(mode)?Math.max(0,gross-net):0;
                          if(withholding<=0)continue;
                          if(approx26V3488(withholding,Math.max(0,gross)))
                              lastPerfIncome26V3488+=withholding;
                          else
                              lastPerfIncomeOtherV3488+=withholding;
                      }
                  }finally{ci.close();}

                  android.database.Cursor cc=w.rawQuery(
                      "SELECT broker,date,cost_kind,cost_type,amount,isin FROM cost_records "+
                      "WHERE "+bwhere+" AND upper(COALESCE(cost_kind,'')) IN ('COMMISSIONE','IMPOSTA')",
                      bargs
                  );
                  try{
                      while(cc.moveToNext()){
                          String dt=cc.getString(1);
                          if(!dateMatchesPerformancePeriod(dt,year,month,day))continue;
                          String kind=cc.isNull(2)?"":cc.getString(2);
                          String type=cc.isNull(3)?"":cc.getString(3);
                          double amount=Math.abs(cc.getDouble(4));
                          String upper=type.toUpperCase(java.util.Locale.ROOT);
                          if("COMMISSIONE".equalsIgnoreCase(kind)){
                              lastPerfCommissionV3470+=amount;
                          }else if(upper.contains("PLUSVALENZA")){
                              lastPerfCapitalGainWithholdingV3488+=amount;
                          }else if(upper.contains("TOBIN")){
                              lastPerfTobinV3488+=amount;
                          }else{
                              lastPerfOtherFiscalV3488+=amount;
                          }
                      }
                  }finally{cc.close();}

                  android.database.Cursor ct=w.rawQuery(
                      "SELECT broker,date,isin,commission,taxes,realized_pl_gross FROM trade_records "+
                      "WHERE "+bwhere+" AND trade_type='SELL'",bargs
                  );
                  try{
                      while(ct.moveToNext()){
                          String br=ct.getString(0);
                          String dt=ct.getString(1);
                          String isin=ct.getString(2)==null?"":ct.getString(2);
                          if(!dateMatchesPerformancePeriod(dt,year,month,day))continue;

                          double commission=Math.abs(ct.getDouble(3));
                          double taxes=Math.abs(ct.getDouble(4));
                          double plGross=ct.getDouble(5);

                          if(commission>0&&!hasCanonicalCostV3470(br,dt,isin,"COMMISSIONE"))
                              lastPerfCommissionV3470+=commission;

                          if(taxes>0&&!hasCanonicalCostV3470(br,dt,isin,"IMPOSTA")){
                              double gain=Math.max(0,plGross);
                              if(approx26V3488(taxes,gain))
                                  lastPerfCapitalGainWithholdingV3488+=taxes;
                              else
                                  lastPerfOtherFiscalV3488+=taxes;
                          }
                      }
                  }finally{ct.close();}

                  lastPerfIncomeTaxV3470=lastPerfIncome26V3488+lastPerfIncomeOtherV3488;
                  lastPerfOperationTaxV3470=
                      lastPerfCapitalGainWithholdingV3488+
                      lastPerfTobinV3488+
                      lastPerfOtherFiscalV3488;

                  return lastPerfCommissionV3470+
                         lastPerfIncomeTaxV3470+
                         lastPerfOperationTaxV3470;
              }'''
          main=replace_method(
              main,
              'double performanceCostsForPeriod(String broker,int year,int month,String day)',
              performance_method
          )

          summary_method=r'''void addPerformanceCostsSummary(double gross,double costs,boolean incomplete){
                  android.widget.LinearLayout c=card();

                  android.widget.TextView l=tv("Lordo  "+moneyItV3470(gross),18,true);
                  l.setTextColor(gross>0?C_GREEN:gross<0?C_RED:android.graphics.Color.WHITE);
                  c.addView(l);

                  if(lastPerfCommissionV3470>0){
                      android.widget.TextView t=tv("Commissioni  "+moneyItV3470(lastPerfCommissionV3470),17,true);
                      t.setTextColor(C_RED);c.addView(t);
                  }
                  if(lastPerfIncome26V3488>0){
                      android.widget.TextView t=tv("Ritenuta 26% sui proventi  "+moneyItV3470(lastPerfIncome26V3488),17,true);
                      t.setTextColor(C_RED);c.addView(t);
                  }
                  if(lastPerfIncomeOtherV3488>0){
                      android.widget.TextView t=tv("Altre ritenute sui proventi  "+moneyItV3470(lastPerfIncomeOtherV3488),17,true);
                      t.setTextColor(C_RED);c.addView(t);
                  }
                  if(lastPerfCapitalGainWithholdingV3488>0){
                      android.widget.TextView t=tv("Ritenuta su plusvalenza (26%)  "+moneyItV3470(lastPerfCapitalGainWithholdingV3488),17,true);
                      t.setTextColor(C_RED);c.addView(t);
                  }
                  if(lastPerfTobinV3488>0){
                      android.widget.TextView t=tv("Tobin Tax  "+moneyItV3470(lastPerfTobinV3488),17,true);
                      t.setTextColor(C_RED);c.addView(t);
                  }
                  if(lastPerfOtherFiscalV3488>0){
                      android.widget.TextView t=tv("Altri costi fiscali  "+moneyItV3470(lastPerfOtherFiscalV3488),17,true);
                      t.setTextColor(C_RED);c.addView(t);
                  }

                  double net=gross-costs;
                  android.widget.TextView n=tv("Netto  "+moneyItV3470(net),18,true);
                  n.setTextColor(net>0?C_GREEN:net<0?C_RED:android.graphics.Color.WHITE);
                  c.addView(n);

                  if(costs>Math.max(1000.0,Math.abs(gross)*5.0))
                      c.addView(muted("⚠ Costi fiscali molto elevati rispetto al lordo: verifica i dati registrati.",13));
                  if(incomplete)
                      c.addView(muted("Netto noto: alcuni dati fiscali possono essere ancora incompleti.",13));

                  content.addView(c);
              }'''
          main=replace_method(
              main,
              'void addPerformanceCostsSummary(double gross,double costs,boolean incomplete)',
              summary_method
          )

          # 5) Storico annuale: bypass the legacy text renderer.
          annual_renderer=r'''
              TextView historyAnnualFinanceTextV3488(
                  String legacy,
                  Double startCap,Double invested,Double cash,Double finalCap,
                  Double grossBase,Double annualLoss,Double afterMinus,
                  Double recovery,Double taxes,Double overall,Double rr,
                  boolean currentYear
              ){
                  if(!currentYear){
                      TextView v=tv(legacy==null?"":legacy.replace("\\n","\n"),13,true);
                      styleAllScreenFinanceV3486Fix6(v);
                      return v;
                  }

                  int year=dataYear();
                  double gross=grossBase==null?db.sumIncomeActive("gross"):grossBase;
                  double income26=Math.max(0,reclassifiedIncomeTaxV3486Fix7(year));
                  double plus=realizedPlusV3486Fix7(year);
                  double minus=realizedMinusV3486Fix7(year);
                  double realizedNet=realizedNetV3486Fix7(year);
                  double cg=annualCapitalGainWithholdingV3488(year);
                  double tobin=annualTobinV3488(year);
                  double commissions=annualCommissionV3488(year);
                  double otherFiscal=annualOtherFiscalV3488(year);
                  double rec=recovery==null?0:Math.max(0,recovery);

                  double netIncome=gross-income26;
                  double result=netIncome+realizedNet+rec;

                  StringBuilder b=new StringBuilder();
                  if(startCap!=null)b.append("Capitale iniziale: ").append(euro.format(startCap)).append(" €");
                  if(invested!=null){
                      if(b.length()>0)b.append("\n");
                      b.append("Titoli a fine anno: ").append(euro.format(invested)).append(" €");
                  }
                  if(cash!=null)b.append("\nLiquidità a fine anno: ").append(euro.format(cash)).append(" €");
                  b.append("\nPatrimonio finale: ")
                   .append(finalCap==null?"in aggiornamento":euro.format(finalCap)+" €");

                  b.append("\n\nDividendi e cedole lordi: +").append(euro.format(gross)).append(" €");
                  if(income26>0.0001)
                      b.append("\nRitenuta 26% sui proventi: -").append(euro.format(income26)).append(" €");
                  b.append("\nProventi netti: ")
                   .append(netIncome>0?"+":"").append(euro.format(netIncome)).append(" €");

                  if(plus>0.0001)
                      b.append("\nPlusvalenze realizzate: +").append(euro.format(plus)).append(" €");
                  if(minus>0.0001)
                      b.append("\nMinusvalenze realizzate: -").append(euro.format(minus)).append(" €");

                  if(cg>0.0001)
                      b.append("\nRitenuta su plusvalenza (26%): -").append(euro.format(cg)).append(" €");
                  if(tobin>0.0001)
                      b.append("\nTobin Tax: -").append(euro.format(tobin)).append(" €");
                  if(commissions>0.0001)
                      b.append("\nCommissioni: -").append(euro.format(commissions)).append(" €");
                  if(otherFiscal>0.0001)
                      b.append("\nAltri costi fiscali: -").append(euro.format(otherFiscal)).append(" €");
                  if(rec>0.0001)
                      b.append("\nRecupero fiscale minus: +").append(euro.format(rec)).append(" €");

                  b.append("\nRisultato complessivo: ")
                   .append(result>0?"+":"").append(euro.format(result)).append(" €");

                  Double rate=annualReturnFromResult(year,startCap,Double.valueOf(result));
                  if(rate!=null)
                      b.append("\nRendimento annuale: ").append(pct.format(rate)).append(" • flussi neutralizzati");

                  TextView v=tv(b.toString(),13,true);
                  styleAllScreenFinanceV3486Fix6(v);
                  return v;
              }
          '''
          last=main.rfind('}')
          main=main[:last]+'\n'+annual_renderer+'\n'+main[last:]

          annual_call='historyAnnualFinanceText(sb.toString(),startCap,invested,cash,finalCap,grossBase,annualLoss,afterMinus,recovery,taxes,overall,rr)'
          req(annual_call in main,'legacy annual renderer call')
          main=main.replace(
              annual_call,
              'historyAnnualFinanceTextV3488(sb.toString(),startCap,invested,cash,finalCap,grossBase,annualLoss,afterMinus,recovery,taxes,overall,rr,historyYear==currentDataYear)'
          )

          # 6) Storico mensile: real line breaks; PAC stays removed.
          month_renderer=r'''
              TextView historyMonthFinanceTextV3488(
                  double value,double gross,double net,boolean incomplete,
                  double knownNet,double tax,double pac,Double r
              ){
                  StringBuilder b=new StringBuilder();
                  b.append("Patrimonio: ");
                  if(Math.abs(value)>0.0001)b.append(euro.format(value)).append(" €");
                  else b.append("-");

                  if(Math.abs(gross)>0.0001||Math.abs(net)>0.0001||Math.abs(knownNet)>0.0001){
                      double shownNet=incomplete?knownNet:net;
                      b.append("\nLordo: ").append(euro.format(gross)).append(" €");
                      b.append(" | Netto: ").append(euro.format(shownNet)).append(" €");
                  }

                  if(Math.abs(tax)>0.0001)
                      b.append("\nRitenute fiscali mese: -").append(euro.format(Math.abs(tax))).append(" €");

                  b.append("\nRendimento: ");
                  if(r==null)b.append("-");
                  else b.append(pct.format(r));

                  TextView v=tv(b.toString(),13,true);
                  styleAllScreenFinanceV3486Fix6(v);
                  return v;
              }
          '''
          last=main.rfind('}')
          main=main[:last]+'\n'+month_renderer+'\n'+main[last:]

          month_call='historyMonthFinanceText(value,gross,net,incomplete,knownNet,taxesMonth,pac,r)'
          req(month_call in main,'legacy monthly renderer call')
          main=main.replace(
              month_call,
              'historyMonthFinanceTextV3488(value,gross,net,incomplete,knownNet,taxesMonth,0,r)'
          )

          # 7) Cassetto fiscale with residual minus to recover.
          drawer_method=r'''void addFiscalDrawerV3486Fix7(int year){
                  double minus=realizedMinusV3486Fix7(year);
                  double recovery=Math.max(0,annualStoredV3486Fix7(year,"fiscal_recovery"));
                  double recoveredBase=recovery>0?recovery/0.26:0;
                  double residual=Math.max(0,minus-recoveredBase);

                  LinearLayout c=card();
                  c.addView(sectionTitle("Cassetto fiscale • minusvalenze"));

                  TextView m=tv("Minusvalenze generate: -"+euro.format(minus)+" €",15,true);
                  m.setTextColor(minus>0?C_RED:android.graphics.Color.WHITE);
                  c.addView(m);

                  TextView r=tv("Recupero fiscale registrato: "+
                      (recovery>0?"+":"")+euro.format(recovery)+" €",15,true);
                  r.setTextColor(recovery>0?C_GREEN:android.graphics.Color.WHITE);
                  c.addView(r);

                  TextView x=tv("Minusvalenze residue da recuperare: "+
                      euro.format(residual)+" €",15,true);
                  x.setTextColor(residual>0?C_RED:android.graphics.Color.WHITE);
                  c.addView(x);

                  c.addView(muted(
                      "Le minusvalenze nascono solo da vendite realizzate sotto il costo di acquisto. "+
                      "La ritenuta su plusvalenza, la Tobin Tax e le commissioni restano voci separate. "+
                      "Per minus pregresse non presenti nell'app, il residuo va allineato al rendiconto fiscale dell'intermediario.",
                      12
                  ));
                  content.addView(c);
              }'''
          main=replace_method(main,'void addFiscalDrawerV3486Fix7(int year)',drawer_method)

          # 8) New repair wording.
          main=main.replace(
              'Imposta su plusvalenza non valida: supera la plusvalenza lorda',
              'Ritenuta su plusvalenza non valida: supera la plusvalenza lorda'
          )
          main=main.replace(
              'FIX2 imposta plusvalenza riparata',
              'FIX8 ritenuta plusvalenza 26% riconosciuta'
          )
          main=main.replace(
              'cv.put("cost_type","Imposta su plusvalenza")',
              'cv.put("cost_type","Ritenuta su plusvalenza 26%")'
          )

          main_path.write_text(main,encoding='utf-8')
          db_path.write_text(db,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          print('V3.4.86 FIX8 applied')
          PYFIX8

      - name: Verify V3.4.86 FIX8
        shell: bash
        run: |
          python3 - <<'PYCHECKFIX8'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c: raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 148' in g,'versionCode 148')
          req('versionName "3.4.86-dev-fix8-fiscal-labels-history-colors"' in g,'FIX8 versionName')
          req('DEV 3.4.86 FIX8 FISCO COLORS' in s,'FIX8 visible label')
