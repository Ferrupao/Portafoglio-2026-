          ]:
              req(marker in s or marker in d,'marker '+marker)

          req('Imposte proventi' not in s,'old Imposte proventi removed')
          req('Imposte operazioni' not in s,'old Imposte operazioni removed')
          req('Totale imposte' not in s,'old Totale imposte removed')
          req('Tasse proventi YTD' not in s,'old Tasse proventi YTD removed')
          req('historyMonthFinanceText(value,gross,net,incomplete,knownNet,taxesMonth,pac,r)' not in s,
              'old monthly renderer call removed')
          req('historyAnnualFinanceText(sb.toString(),startCap,invested,cash,finalCap,grossBase,annualLoss,afterMinus,recovery,taxes,overall,rr)' not in s,
