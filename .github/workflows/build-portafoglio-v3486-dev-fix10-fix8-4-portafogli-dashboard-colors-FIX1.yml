name: Build Portafoglio 2026 V3.4.86 FIX10 FIX8.4 Portafogli Dashboard Colors FIX1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-4-portafogli-dashboard-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-3-portfolio-final-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-2-trade-republic-date-performance.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact FIX8.3 FIX2 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-fix8-3-portfolio-final-FIX2.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX8.3 FIX2 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          for target in [
              'Rebuild exact FIX8.2 source',
              'Patch FIX8.3 Portfolio final colors and Trade Republic Performance'
          ]:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('FIX8.3 FIX2 source reconstructed')
          PYREPLAY

      - name: Patch FIX8.4 FIX1 Dashboard semantic colors
        shell: bash
        run: |
          python3 - <<'PYFIX84'
          from pathlib import Path

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 160' in gradle,'FIX8.3 versionCode')
          req('versionName "3.4.86-dev-fix10-fix8-3-portfolio-final"' in gradle,'FIX8.3 versionName')
          req('DEV 3.4.86 FIX10 FIX8.3 PORTFOLIO FINAL' in main,'FIX8.3 visible label')

          gradle=gradle.replace('versionCode 160','versionCode 161',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix8-3-portfolio-final"',
              'versionName "3.4.86-dev-fix10-fix8-4-portafogli-dashboard-colors-fix1"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX8.3 PORTFOLIO FINAL',
              'DEV 3.4.86 FIX10 FIX8.4 PORTAFOGLI COLORS FIX1'
          )

          # Exact reason for the white Dashboard values:
          # - the local P/L regex did not recognize "P/L non realizzato"
          # - the local income regex did not recognize "Proventi netti"
          # Extend those two exact semantic matchers only.

          old_pl=r'''(?i)(?:p/l(?:\\s+realizzato(?:\\s+(?:lordo|netto))?)?|plusvalenza|minusvalenza|risultato|rendimento)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)'''
          new_pl=r'''(?i)(?:p/l(?:\\s+(?:non\\s+realizzato|realizzato(?:\\s+(?:lordo|netto))?))?|plusvalenza|minusvalenza|risultato|rendimento)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)'''
          req(old_pl in main,'old P/L semantic regex found')
          main=main.replace(old_pl,new_pl,1)

          old_inc=r'''(?i)(?:cedole?|div\\.?|dividendi?|proventi?|distribuzioni?|interessi)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*€'''
          new_inc=r'''(?i)(?:cedole?|div\\.?|dividendi?|proventi?(?:\\s+(?:lordi|netti))?(?:\\s+YTD)?|distribuzioni?|interessi)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*€'''
          req(old_inc in main,'old income semantic regex found')
          main=main.replace(old_inc,new_inc,1)

          # Dashboard "Composizione proventi": positive category amount green,
          # zero amount white. Labels and percentages remain white.
          anchor='''        // Costs are always red when non-zero.'''
          req(anchor in main,'cost semantic anchor found')
          composition=r'''
                  // FIX8.4 Dashboard composition-income rows.
                  java.util.regex.Matcher compositionIncomeV3497=
                      java.util.regex.Pattern.compile(
                          "(?i)^(?:Azioni|ETF|ETP|Certificati|Altro)\\s*:\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*€"
                      ).matcher(s);

                  if(compositionIncomeV3497.find()){
                      double n=parseSemanticNumberV3483(compositionIncomeV3497.group(1));
                      semanticAmountSpanV3483(
                          sp,
                          compositionIncomeV3497.start(1),
                          compositionIncomeV3497.end(),
                          semanticIncomeColorV3483(n)
                      );
                  }

          '''
          main=main.replace(anchor,composition+anchor,1)

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX8.4 FIX1 applied: exact Dashboard semantic regex correction')
          PYFIX84

      - name: Verify FIX8.4 FIX1
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 161' in g,'versionCode 161')
          req('versionName "3.4.86-dev-fix10-fix8-4-portafogli-dashboard-colors-fix1"' in g,'FIX8.4 FIX1 versionName')
          req('DEV 3.4.86 FIX10 FIX8.4 PORTAFOGLI COLORS FIX1' in s,'FIX8.4 FIX1 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          req(r'non\\s+realizzato' in s,'P/L non realizzato recognized')
          req(r'proventi?(?:\\s+(?:lordi|netti))?' in s,'Proventi netti recognized')
          req('compositionIncomeV3497' in s,'composition income formatter present')
          req('(?:Azioni|ETF|ETP|Certificati|Altro)' in s,'composition categories targeted')

          # Existing correct color logic remains.
          for marker in [
              'kpiValueColor("Valore titoli",titlesText,C_GREEN)',
              'kpiValueColor("Patrimonio totale"',
              'wealthV3496',
              '"patrimonio totale","valore titoli","valore attuale titoli"'
          ]:
              req(marker in s,'wealth colors preserved '+marker)

          # Performance is frozen.
          for marker in [
              'boolean isTradeRepublicBrokerV3496',
              'grossPerformanceByDateTradeRepublicV3496',
              'performanceMapMonthV3496',
              'performanceMapYearV3496',
              'isTradeRepublicBrokerV3496(broker)?grossPerformanceByDateTradeRepublicV3496(broker):grossPerformanceByDate(broker)'
          ]:
              req(marker in s,'TR Performance preserved '+marker)

          req(':grossPerformanceByDate(broker)' in s,'Directa date Performance preserved')
          req(':grossPerformanceForMonth(broker,viewYear,viewMonth)' in s,'Directa month Performance preserved')
          req(':grossPerformanceForYear(broker,viewYear)' in s,'Directa year Performance preserved')
          req('if(sc.contains("performance"))return false;' in s,'Performance excluded from Portafogli color pass')

          # Home is frozen.
          for marker in [
              'homeColorSessionV3493',
              'scheduleHomeColorsV3493',
              'applyHomeColorsV3493',
              'String wealthLowV3496=s==null?"":s.toLowerCase(java.util.Locale.ROOT);'
          ]:
              req(marker in s,'Home preserved '+marker)

          # Data/accounting protections remain.
          ps='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          pp=s.find(ps)
          req(pp>=0,'Performance cost engine preserved')
          req('boolean total=(broker==null)||TOTAL.equals(broker);' in s[pp:pp+9000],
              'Performance Totale null-safe preserved')

          for marker in [
              'repairTradeRepublicPricesV3477',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462',
              'Performance = proventi lordi + P/L realizzato lordo.'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('FIX8.4 FIX1 verified')
          PYCHECK

      - name: Build signed FIX8.4 FIX1 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed FIX8.4 FIX1 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX8.4 FIX1 signed APK verified"

      - name: Upload signed FIX8.4 FIX1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX8-4-FIX1-PORTAFOGLI-DASHBOARD-COLORS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
