name: Build Portafoglio 2026 V3.4.86 FIX9 Performance Colors Stability

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix9-performance-colors-stability.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix8-fiscal-labels-history-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix7-fiscal-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix6-global-colors-no-pac-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix6-global-colors-no-pac.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix5-neutral-own-capital.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.86 FIX8 source
        shell: bash
        run: |
          python3 - <<'PYREPLAYFIX9'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix8-fiscal-labels-history-colors.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX8 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact V3.4.86 FIX7 FIX1 source',
              'Patch V3.4.86 FIX8 fiscal labels history colors'
          ]
          for target in wanted:
              for name,script in steps:
                  if name==target:
                      print('===== REPLAY',target,'=====')
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing FIX8 replay step: '+target)

          print('FIX8 source reconstructed')
          PYREPLAYFIX9

      - name: Patch V3.4.86 FIX9 performance colors stability
        shell: bash
        run: |
          python3 - <<'PYFIX9'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          db_text=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 148' in gradle,'FIX8 versionCode')
          req('versionName "3.4.86-dev-fix8-fiscal-labels-history-colors"' in gradle,'FIX8 versionName')
          req('lastPerfCapitalGainWithholdingV3488' in main,'FIX8 performance fiscal split')
          req('collectTextViewsV3488' in main,'FIX8 recursive scanner present')
          req(re.search(r'DB_VERSION\s*=\s*18',db_text) is not None,'DB18')

          gradle=gradle.replace('versionCode 148','versionCode 149',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix8-fiscal-labels-history-colors"',
              'versionName "3.4.86-dev-fix9-performance-colors-stability"',
              1
          )

          # Normalize every stale visible DEV label.
          main=re.sub(
              r'DEV 3\.4\.86 FIX(?:7|8|9)[^"\n]*?(?=")',
              'DEV 3.4.86 FIX9 PERF COLORS',
              main
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=False; inc=False; esc=False
              line=False; block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          def replace_method(text,sig,repl):
              p=text.find(sig)
              if p<0: raise RuntimeError('Missing method: '+sig)
              o=text.find('{',p)
              c=matching_brace(text,o)
              return text[:p]+repl+text[c+1:]

          # A bounded local scan only. No recursive subtree scan inside every ViewGroup.
          local_helper=r'''
              void collectLocalKpiTextV3489(
                  android.view.ViewGroup g,
                  java.util.ArrayList<android.widget.TextView> out
              ){
                  if(g==null)return;
                  int children=Math.min(g.getChildCount(),8);
                  for(int i=0;i<children;i++){
                      android.view.View ch=g.getChildAt(i);
                      if(ch instanceof android.widget.TextView){
                          out.add((android.widget.TextView)ch);
                      }else if(ch instanceof android.view.ViewGroup){
                          android.view.ViewGroup sub=(android.view.ViewGroup)ch;
                          if(sub.getChildCount()<=6){
                              for(int j=0;j<sub.getChildCount();j++){
                                  android.view.View x=sub.getChildAt(j);
                                  if(x instanceof android.widget.TextView)
                                      out.add((android.widget.TextView)x);
                              }
                          }
                      }
                      if(out.size()>12)return;
                  }
              }
          '''
          last=main.rfind('}')
          main=main[:last]+'\n'+local_helper+'\n'+main[last:]

          kpi=r'''void styleSemanticKpiGroupV3486Fix7(android.view.ViewGroup g){
                  if(g==null||g.getChildCount()>8)return;
                  java.util.ArrayList<android.widget.TextView> all=new java.util.ArrayList<>();
                  collectLocalKpiTextV3489(g,all);
                  if(all.size()<2||all.size()>12)return;

                  StringBuilder labels=new StringBuilder();
                  java.util.ArrayList<android.widget.TextView> vals=new java.util.ArrayList<>();
                  for(android.widget.TextView tv:all){
                      if(tv==null||tv.getText()==null)continue;
                      String x=tv.getText().toString().trim();
                      if(x.isEmpty())continue;
                      if(x.matches("[+\\-]?[0-9][0-9\\.,]*\\s*(€|%)?")){
                          vals.add(tv);
                      }else{
                          if(labels.length()>0)labels.append(" ");
                          labels.append(x.toLowerCase(java.util.Locale.ROOT));
                      }
                  }
                  if(vals.isEmpty())return;
                  String low=labels.toString();

                  boolean cost=
                      low.contains("ritenut")||
                      low.contains("tobin")||
                      low.contains("commission")||
                      low.contains("costi fiscali")||
                      low.contains("tassazione")||
                      low.contains("tasse");

                  boolean positiveIncome=
                      low.contains("proventi lordi")||
                      low.contains("dividend")||
                      low.contains("cedol")||
                      low.contains("premio")||
                      low.contains("saveback")||
                      low.contains("recupero fiscale");

                  boolean signed=
                      low.contains("p/l")||
                      low.contains("risultato")||
                      low.contains("rendimento")||
                      low.contains("plusvalenz")||
                      low.contains("minusvalenz")||
                      low.contains("perdita")||
                      low.contains("netto");

                  for(android.widget.TextView v:vals){
                      double n=parseSemanticNumberV3483(v.getText().toString());
                      int color=android.graphics.Color.WHITE;
                      if(cost){
                          color=Math.abs(n)<=0.0000001
                              ?android.graphics.Color.WHITE:C_RED;
                      }else if(positiveIncome){
                          color=semanticIncomeColorV3483(n);
                      }else if(signed){
                          color=semanticSignedColorV3483(n);
                      }
                      v.setTextColor(color);
                      v.setTypeface(
                          android.graphics.Typeface.DEFAULT,
                          android.graphics.Typeface.BOLD
                      );
                  }
              }'''
          main=replace_method(
              main,
              'void styleSemanticKpiGroupV3486Fix7(android.view.ViewGroup g)',
              kpi
          )

          # Safe text formatter. Cost rows are always red; positive income green;
          # neutral portfolio amounts remain white.
          style=r'''boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t){
                  if(t==null)return false;
                  CharSequence q=t.getText();
                  if(q==null)return false;
                  String s=q.toString();
                  if(s.trim().isEmpty())return false;

                  s=s.replace("\\n","\n");

                  String[] rows=s.split("\n",-1);
                  StringBuilder clean=new StringBuilder();
                  boolean removedPac=false;
                  for(String row:rows){
                      String lr=row.toLowerCase(java.util.Locale.ROOT);
                      if(lr.contains("pac")){
                          removedPac=true;
                          continue;
                      }
                      if(clean.length()>0)clean.append("\n");
                      clean.append(row);
                  }
                  if(removedPac){
                      s=clean.toString().trim();
                      if(s.isEmpty()){
                          t.setVisibility(android.view.View.GONE);
                          return true;
                      }
                      t.setVisibility(android.view.View.VISIBLE);
                  }

                  String low=s.toLowerCase(java.util.Locale.ROOT).trim();

                  // Explicit one-line financial rows: never allow a delayed formatter
                  // to overwrite their semantic color.
                  boolean oneLine=s.indexOf('\n')<0;
                  if(oneLine){
                      if(low.startsWith("commissioni")||
                         low.startsWith("commissione")||
                         low.startsWith("ritenuta")||
                         low.startsWith("tobin tax")||
                         low.startsWith("costi fiscali")||
                         low.startsWith("altri costi fiscali")||
                         low.startsWith("tassazione")){
                          double n=parseSemanticNumberV3483(s);
                          t.setText(s);
                          t.setTextColor(
                              Math.abs(n)<=0.0000001
                                  ?android.graphics.Color.WHITE:C_RED
                          );
                          t.setTypeface(
                              android.graphics.Typeface.DEFAULT,
                              android.graphics.Typeface.BOLD
                          );
                          return true;
                      }

                      if(low.startsWith("lordo")||
                         low.startsWith("netto")||
                         low.startsWith("proventi")||
                         low.startsWith("dividendi")||
                         low.startsWith("cedole")||
                         low.startsWith("premi/saveback")||
                         low.startsWith("premio")||
                         low.startsWith("saveback")||
                         low.startsWith("recupero fiscale")||
                         low.startsWith("risultato")||
                         low.startsWith("rendimento")||
                         low.startsWith("p/l")||
                         low.startsWith("plusvalenz")){
                          double n=parseSemanticNumberV3483(s);
                          int color=semanticSignedColorV3483(n);
                          if(low.startsWith("proventi")||
                             low.startsWith("dividendi")||
                             low.startsWith("cedole")||
                             low.startsWith("premi/saveback")||
                             low.startsWith("premio")||
                             low.startsWith("saveback")||
                             low.startsWith("recupero fiscale"))
                              color=semanticIncomeColorV3483(n);
                          t.setText(s);
                          t.setTextColor(color);
                          t.setTypeface(
                              android.graphics.Typeface.DEFAULT,
                              android.graphics.Typeface.BOLD
                          );
                          return true;
                      }

                      if(low.startsWith("minusvalenz")||
                         low.startsWith("perdita")){
                          double n=parseSemanticNumberV3483(s);
                          t.setText(s);
                          t.setTextColor(
                              Math.abs(n)<=0.0000001
                                  ?android.graphics.Color.WHITE:C_RED
                          );
                          t.setTypeface(
                              android.graphics.Typeface.DEFAULT,
                              android.graphics.Typeface.BOLD
                          );
                          return true;
                      }
                  }

                  boolean financeRelevant=
                      low.contains("p/l")||
                      low.contains("rendimento")||
                      low.contains("risultato")||
                      low.contains("lordo")||low.contains("netto")||
                      low.contains("divid")||low.contains("cedol")||
                      low.contains("provent")||low.contains("premio")||
                      low.contains("saveback")||low.contains("recupero fiscale")||
                      low.contains("plusvalenz")||low.contains("minusvalenz")||
                      low.contains("perdita")||low.contains("commission")||
                      low.contains("ritenut")||low.contains("tobin")||
                      low.contains("tassazione")||low.contains("costi fiscali")||
                      low.contains("patrimonio")||low.contains("capitale")||
                      low.contains("liquidità")||low.contains("liquidita")||
                      low.contains("valore titoli")||low.contains("titoli a fine anno")||
                      low.contains("investito")||low.contains("q.tà")||
                      low.contains("pmc")||low.contains("prezzo");

                  if(!financeRelevant){
                      if(removedPac)t.setText(s);
                      return removedPac;
                  }

                  android.text.SpannableString sp=new android.text.SpannableString(s);
                  sp.setSpan(
                      new android.text.style.ForegroundColorSpan(
                          android.graphics.Color.WHITE
                      ),
                      0,sp.length(),
                      android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );
                  sp.setSpan(
                      new android.text.style.StyleSpan(
                          android.graphics.Typeface.BOLD
                      ),
                      0,sp.length(),
                      android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );

                  java.util.regex.Pattern costs=java.util.regex.Pattern.compile(
                      "(?i)(Ritenuta(?:\\s+26%\\s+sui\\s+proventi|\\s+su\\s+plusvalenza(?:\\s*\\(26%\\))?)?"+
                      "|Tobin\\s+Tax|Commissioni?|Costi\\s+fiscali(?:\\s+operazioni)?"+
                      "|Altri\\s+costi\\s+fiscali|Tassazione\\s+proventi)"+
                      "[^0-9+\\-\\n]{0,48}([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  java.util.regex.Pattern signed=java.util.regex.Pattern.compile(
                      "(?i)(P/L(?:\\s+(?:non\\s+realizzato|realizzato\\s+netto|realizzato\\s+lordo))?"+
                      "|Rendimento(?:\\s+(?:annuale|YTD|reale|da\\s+inizio\\s+anno))?"+
                      "|Risultato(?:\\s+complessivo)?|Plusvalenze\\s+realizzate"+
                      "|Proventi\\s+netti|Lordo|Netto)"+
                      "\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  java.util.regex.Pattern income=java.util.regex.Pattern.compile(
                      "(?i)(Dividendi\\s+e\\s+cedole(?:\\s+lordi|\\s+incassati)?"+
                      "|Dividendo|Dividendi|Cedole|Proventi\\s+lordi(?:\\s+YTD)?"+
                      "|Recupero\\s+fiscale(?:\\s+minus)?|Premi/Saveback|Premio|Saveback)"+
                      "[^0-9+\\-\\n]{0,48}([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  java.util.regex.Pattern loss=java.util.regex.Pattern.compile(
                      "(?i)(Minusvalenze?\\s+(?:realizzate|generate|residue\\s+da\\s+recuperare)"+
                      "|Perdite?\\s+realizzate|Minusvalenza)"+
                      "[^0-9+\\-\\n]{0,40}([+\\-]?[0-9][0-9\\.,]*)\\s*(€|%)?"
                  );

                  applySemanticPatternV3483(sp,s,costs,1);
                  applySemanticPatternV3483(sp,s,signed,0);
                  applySemanticPatternV3483(sp,s,income,2);
                  applySemanticPatternV3483(sp,s,loss,3);

                  t.setText(sp);
                  t.setTypeface(
                      android.graphics.Typeface.DEFAULT,
                      android.graphics.Typeface.BOLD
                  );
                  return true;
              }'''
          main=replace_method(
              main,
              'boolean styleAllScreenFinanceV3486Fix6(android.widget.TextView t)',
              style
          )

          # One lightweight delayed pass only. This removes the FIX8 O(N^2)-like
          # repeated subtree rescans that affected long Directa Performance lists.
          schedule=r'''void scheduleGlobalSemanticColorsV3483(){
                  if(content==null)return;
                  content.postDelayed(new Runnable(){
                      @Override public void run(){
                          applyGlobalSemanticColorsV3483(content);
                      }
                  },80);
              }'''
          main=replace_method(
              main,
              'void scheduleGlobalSemanticColorsV3483()',
              schedule
          )

          # Keep normal tree traversal, but only tiny local groups receive KPI pairing.
          apply=r'''void applyGlobalSemanticColorsV3483(android.view.View v){
                  if(v==null)return;

                  if(v instanceof android.widget.TextView){
                      styleGlobalSemanticTextV3483((android.widget.TextView)v);
                      return;
                  }

                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      if(g.getChildCount()<=8)
                          styleSemanticKpiGroupV3486Fix7(g);
                      for(int i=0;i<g.getChildCount();i++){
                          applyGlobalSemanticColorsV3483(g.getChildAt(i));
                      }
                  }
              }'''
          main=replace_method(
              main,
              'void applyGlobalSemanticColorsV3483(android.view.View v)',
              apply
          )

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX9 applied: stable Performance + deterministic colors')
          PYFIX9

      - name: Verify V3.4.86 FIX9
        shell: bash
        run: |
          python3 - <<'PYCHECKFIX9'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c: raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 149' in g,'versionCode 149')
          req('versionName "3.4.86-dev-fix9-performance-colors-stability"' in g,'FIX9 version')
          req('DEV 3.4.86 FIX9 PERF COLORS' in s,'FIX9 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          req('collectLocalKpiTextV3489' in s,'bounded local KPI scan')
          req('collectTextViewsV3488(g,all)' not in s,'recursive FIX8 subtree scan removed')
          req('},80);' in s,'single 80ms color pass')
          req('new int[]{0,120,360,900}' not in s,'four-pass scheduler removed')

          for marker in [
              'low.startsWith("ritenuta")',
              'low.startsWith("tobin tax")',
              'Ritenuta(?:\\\\s+26%',
              'Tobin\\\\s+Tax',
              'semanticCostColorV3483',
              'lastPerfCapitalGainWithholdingV3488',
              'Ritenuta su plusvalenza (26%)',
              'Ritenuta 26% sui proventi'
          ]:
              req(marker in s,'color/performance marker '+marker)

          # Performance arithmetic/data model stays FIX8; FIX9 is UI/stability only.
          req('double performanceCostsForPeriod(String broker,int year,int month,String day)' in s,
              'performance cost engine preserved')
          req('void addPerformanceCostsSummary(double gross,double costs,boolean incomplete)' in s,
              'performance summary preserved')

          for marker in [
              '"Q.tà "+quantityItV3470(r.qty)',
              'decimalInputItV3470(r.pmc)+" €"',
              'decimalInputItV3470(r.price)+" €"',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'V3474_FIX2_NORMALIZED_BROKER_TOTALS',
              'V3474_FIX3_POSITION_FIRST_HOME_TOTAL',
              'V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462',
              'Performance = proventi lordi + P/L realizzato lordo.'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('V3.4.86 FIX9 verified')
          PYCHECKFIX9

      - name: Build signed V3.4.86 FIX9 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.86 FIX9 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
