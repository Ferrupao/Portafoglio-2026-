name: Build Portafoglio 2026 V3.4.74 FIX1 Live Position Total Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync.yml"
      - ".github/workflows/build-portafoglio-v3473-dev-position-card-amount-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX4-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3471-dev-instrument-lifecycle-acc-div.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX4.yml"
      - ".github/workflows/build-portafoglio-v3464-dev-global-cash-position-safety-FIX2.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.74 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          workflow_path=Path('.github/workflows/build-portafoglio-v3474-dev-live-position-total-sync.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing V3.4.74 workflow: {workflow_path}')

          lines=workflow_path.read_text(encoding='utf-8').splitlines()
          parsed=[]; i=0
          while i<len(lines):
              line=lines[i]
              if not line.startswith('      - name: '):
                  i+=1; continue
              name=line[len('      - name: '):].strip()
              j=i+1; script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1; block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '): break
                          if raw.startswith('          '):
                              block.append(raw[10:]); k+=1; continue
                          if raw.strip()=='':
                              block.append(''); k+=1; continue
                          if raw.startswith('        '): break
                          block.append(raw); k+=1
                      script='\n'.join(block)+'\n'; break
                  j+=1
              if script is not None: parsed.append((name,script))
              i=j if j>i else i+1

          start_name='Rebuild exact V3.4.73 FIX1 stable source'
          end_name='Verify V3.4.74 live total sync and all safety regressions'
          started=False; reached=False; executed=0
          for name,script in parsed:
              if name==start_name: started=True
              if not started: continue
              print(f'\n===== Replaying V3.4.74 step: {name} =====')
              subprocess.run(['bash','-euo','pipefail','-c',script],check=True,env=os.environ.copy())
              executed+=1
              if name==end_name:
                  reached=True; break

          if not started: raise RuntimeError(f'Could not find replay start: {start_name}')
          if not reached: raise RuntimeError(f'Could not find replay end: {end_name}')
          if executed<3: raise RuntimeError(f'Unexpectedly short V3.4.74 replay: {executed}')
          print(f'V3.4.74 source rebuilt successfully ({executed} steps)')
          PYREPLAY

      - name: Patch V3.4.74 FIX1 quantity-price authoritative totals
        shell: bash
        run: |
          python3 - <<'PY3474FIX1'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          if 'versionCode 125' not in gradle:
              raise RuntimeError('V3.4.74 versionCode missing')
          if 'versionName "3.4.74-dev-live-position-total-sync"' not in gradle:
              raise RuntimeError('V3.4.74 versionName missing')
          if 'DEV 3.4.74' not in main:
              raise RuntimeError('V3.4.74 visible label missing')
          if 'V3.4.74: current portfolio value is authoritative from OPEN positions' not in main:
              raise RuntimeError('V3.4.74 total-sync method missing')

          gradle=gradle.replace('versionCode 125','versionCode 126',1)
          gradle=gradle.replace(
              'versionName "3.4.74-dev-live-position-total-sync"',
              'versionName "3.4.74-dev-live-position-total-sync-fix1"',
              1
          )
          main=main.replace('DEV 3.4.74','DEV 3.4.74 FIX1')

          def matching_brace(text, open_pos):
              depth=0;i=open_pos;in_str=in_char=in_line=in_block=False;esc=False
              while i<len(text):
                  c=text[i];n=text[i+1] if i+1<len(text) else ''
                  if in_line:
                      if c=='\n':in_line=False
                      i+=1;continue
                  if in_block:
                      if c=='*' and n=='/':in_block=False;i+=2;continue
                      i+=1;continue
                  if in_str:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':in_str=False
                      i+=1;continue
                  if in_char:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=="'":in_char=False
                      i+=1;continue
                  if c=='/' and n=='/':in_line=True;i+=2;continue
                  if c=='/' and n=='*':in_block=True;i+=2;continue
                  if c=='"':in_str=True;i+=1;continue
                  if c=="'":in_char=True;i+=1;continue
                  if c=='{':depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced Java braces')

          signature='void normalizeLiveCashAllPortfoliosV3464()'
          p=main.find(signature)
          if p<0: raise RuntimeError('normalizeLiveCashAllPortfoliosV3464 missing')
          o=main.find('{',p); c=matching_brace(main,o)
          old=main[p:c+1]

          if 'SUM(COALESCE(p.current_value,0))' not in old:
              raise RuntimeError('Expected V3.4.74 current_value summation missing')

          new=r'''void normalizeLiveCashAllPortfoliosV3464(){
                  android.database.sqlite.SQLiteDatabase w=db.getWritableDatabase();

                  // V3.4.74 FIX1:
                  // quantity * price is the authoritative live market value for every OPEN position.
                  // Older current_value cells may be stale even when the card correctly displays quantity x price.
                  // Quantity and PMC are NEVER modified here.
                  w.execSQL(
                      "UPDATE positions SET current_value=COALESCE(quantity,0)*COALESCE(price,0) "+
                      "WHERE COALESCE(quantity,0)>0 AND price IS NOT NULL "+
                      "AND (current_value IS NULL OR "+
                      "ABS(COALESCE(current_value,0)-(COALESCE(quantity,0)*COALESCE(price,0)))>0.0001)"
                  );

                  // Rebuild each live portfolio total from the same formula used by the position cards.
                  w.execSQL(
                      "UPDATE portfolio_status SET invested=("+
                      "SELECT COALESCE(SUM(COALESCE(p.quantity,0)*COALESCE(p.price,0)),0) FROM positions p "+
                      "WHERE lower(trim(COALESCE(p.broker,'')))=lower(trim(COALESCE(portfolio_status.broker,''))) "+
                      "AND COALESCE(p.quantity,0)>0"+
                      ")"
                  );

                  // Preserve the established live-cash rule.
                  w.execSQL(
                      "UPDATE portfolio_status SET cash=0, total_value=COALESCE(invested,0) "+
                      "WHERE cash IS NULL OR ABS(COALESCE(cash,0))>0.0001 "+
                      "OR total_value IS NULL OR ABS(COALESCE(total_value,0)-COALESCE(invested,0))>0.0001"
                  );
              }'''

          main=main[:p]+new+main[c+1:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DB changed unexpectedly')

          print('V3.4.74 FIX1 applied: quantity*price totals + current_value repair')
          PY3474FIX1

      - name: Verify V3.4.74 FIX1 totals and all safety regressions
        shell: bash
        run: |
          python3 - <<'PY3474FIX1CHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')
          compact=lambda x:re.sub(r'\s+','',x)
          sc=compact(s)

          assert 'versionCode 126' in g
          assert 'versionName "3.4.74-dev-live-position-total-sync-fix1"' in g
          assert 'DEV 3.4.74 FIX1' in s
          assert re.search(r'DB_VERSION\s*=\s*18',d)

          for marker in [
              'V3.4.74 FIX1:',
              'UPDATE positions SET current_value=COALESCE(quantity,0)*COALESCE(price,0)',
              'SUM(COALESCE(p.quantity,0)*COALESCE(p.price,0))',
              "lower(trim(COALESCE(p.broker,'')))=lower(trim(COALESCE(portfolio_status.broker,'')))",
              'AND COALESCE(p.quantity,0)>0',
              'UPDATE portfolio_status SET cash=0, total_value=COALESCE(invested,0)',
              'Quantity and PMC are NEVER modified here',
          ]:
              assert marker in s,marker

          m=re.search(r'void\s+normalizeLiveCashAllPortfoliosV3464\s*\(\s*\)\s*\{',s);assert m
          o=s.find('{',m.start())
          depth=0;c=None
          in_str=in_char=in_line=in_block=False;esc=False;i=o
          while i<len(s):
              ch=s[i];n=s[i+1] if i+1<len(s) else ''
              if in_line:
                  if ch=='\n':in_line=False
                  i+=1;continue
              if in_block:
                  if ch=='*' and n=='/':in_block=False;i+=2;continue
                  i+=1;continue
              if in_str:
                  if esc:esc=False
                  elif ch=='\\':esc=True
                  elif ch=='"':in_str=False
                  i+=1;continue
              if in_char:
                  if esc:esc=False
                  elif ch=='\\':esc=True
                  elif ch=="'":in_char=False
                  i+=1;continue
              if ch=='/' and n=='/':in_line=True;i+=2;continue
              if ch=='/' and n=='*':in_block=True;i+=2;continue
              if ch=='"':in_str=True;i+=1;continue
              if ch=="'":in_char=True;i+=1;continue
              if ch=='{':depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0:
                      c=i;break
              i+=1
          assert c is not None
          norm=s[m.start():c+1]
          assert 'SUM(COALESCE(p.current_value,0))' not in norm
          assert 'cv.put("quantity"' not in norm
          assert 'cv.put("pmc"' not in norm

          q=10.0; price=983.0
          assert round(q*price,2)==9830.00
          assert round(107607.23 + q*price,2)==117437.23

          for marker in [
              'V3473_POSITION_CARD_AMOUNT_COLORS',
              'stylePositionCardAmountTextV3473',
              'schedulePositionCardAmountColorsV3473',
          ]:
              assert marker in s,marker

          for marker in [
              'final String[] category={initialCategory==null?"Tutti":initialCategory},state={"Aperte"},order={"Valore"}',
              'if(!category.equals("Tutti")&&!cat.equals(category))continue;',
              'V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC',
          ]:
              assert marker in s,marker

          for marker in [
              'applyOperationSemanticColorsV3470Fix3',
              'semanticSpanV3470Fix3',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'FIX2 imposta plusvalenza riparata',
          ]:
              assert marker in s,marker

          for marker in [
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'applyHistoricalUiSafetyV3462',
          ]:
              assert marker in s,marker

          assert re.search(r'cv\.put\(\s*"price"\s*,\s*baseline\s*\[\s*i\s*\]\s*\)',s)
          assert re.search(r'current_value\s*=\s*quantity\s*\*\s*price',s)
          assert 'UPDATEportfolio_statusSETcash=0,total_value=COALESCE(invested,0)' in sc

          rp=re.search(r'void\s+repairTradeRepublicPlaceholderPricesV3464\s*\(\s*\)\s*\{',s);assert rp
          nxt=re.search(r'void\s+applyDashboardCashUiV3464\s*\(\s*\)\s*\{',s[rp.end():]);assert nxt
          repair=compact(s[rp.start():rp.end()+nxt.start()])
          assert 'cv.put("quantity"' not in repair
          assert 'cv.put("pmc"' not in repair

          print('V3.4.74 FIX1 verified: totals use quantity*price; current_value repaired; DB18, filters, colors and safety intact')
          PY3474FIX1CHECK

      - name: Build signed V3.4.74 FIX1 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.74 FIX1 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "V3.4.74 FIX1 signed APK verified"

      - name: Upload signed V3.4.74 FIX1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3474-FIX1-LIVE-POSITION-TOTAL-SYNC-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
