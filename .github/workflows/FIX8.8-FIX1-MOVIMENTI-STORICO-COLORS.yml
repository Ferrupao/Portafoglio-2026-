name: Build Portafoglio 2026 V3.4.86 FIX10 FIX8.8 FIX1 Movimenti Storico Semantic Colors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/FIX8.8-FIX1-MOVIMENTI-STORICO-COLORS.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-7-clean-stable-rebuild.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-6-proventi-taxes-semantic-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-5-proventi-zero-taxes-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-4-portafogli-dashboard-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-3-portfolio-final-FIX2.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact FIX8.7 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-fix8-7-clean-stable-rebuild.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX8.7 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          for target in [
              'Rebuild exact FIX8.6 source',
              'Patch FIX8.7 clean stable version'
          ]:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('FIX8.7 exact source reconstructed')
          PYREPLAY

      - name: Patch FIX8.8 FIX1 Movimenti Storico semantic colors
        shell: bash
        run: |
          python3 - <<'PYFIX88'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          def replace_method(text,signature,replacement):
              p=text.find(signature)
              if p<0:
                  raise RuntimeError('Method not found: '+signature)
              o=text.find('{',p)
              c=matching_brace(text,o)
              return text[:p]+replacement+text[c+1:]

          req('versionCode 164' in gradle,'FIX8.7 versionCode')
          req(
              'versionName "3.4.86-dev-fix10-fix8-7-clean-stable-rebuild"' in gradle,
              'FIX8.7 versionName'
          )
          req(
              'DEV 3.4.86 FIX10 FIX8.7 CLEAN STABLE' in main,
              'FIX8.7 visible label'
          )

          gradle=gradle.replace('versionCode 164','versionCode 165',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix8-7-clean-stable-rebuild"',
              'versionName "3.4.86-dev-fix10-fix8-8-fix1-movimenti-storico-semantic-colors"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX8.7 CLEAN STABLE',
              'DEV 3.4.86 FIX10 FIX8.8 FIX1 MOVIMENTI STORICO COLORS'
          )

          helpers=r'''
              boolean isMovimentiStoricoScreenV3499(){
                  String sc=currentColorScreenV3492==null
                      ?""
                      :currentColorScreenV3492.toLowerCase(java.util.Locale.ROOT);
                  return sc.contains("storico")
                      ||sc.contains("operazioni")
                      ||sc.contains("moviment");
              }

              int semanticColorV3499(double n,int mode){
                  if(Math.abs(n)<=0.0000001)return android.graphics.Color.WHITE;
                  if(mode==1)return n>0?C_GREEN:C_RED;
                  if(mode==2)return C_RED;
                  if(mode==3)return semanticSignedColorV3483(n);
                  return android.graphics.Color.WHITE;
              }

              void colorMatchesV3499(
                  android.text.SpannableString sp,
                  String s,
                  String regex,
                  int mode
              ){
                  java.util.regex.Matcher m=java.util.regex.Pattern.compile(
                      regex,
                      java.util.regex.Pattern.CASE_INSENSITIVE
                      |java.util.regex.Pattern.MULTILINE
                      |java.util.regex.Pattern.DOTALL
                  ).matcher(s);

                  while(m.find()){
                      String raw=m.group(2);
                      if(raw==null)continue;
                      double n=parseSemanticNumberV3483(raw);
                      int color=semanticColorV3499(n,mode);
                      int start=m.start(2);
                      int end=m.end(2);
                      if(m.groupCount()>=3 && m.group(3)!=null){
                          end=m.end(3);
                      }
                      sp.setSpan(
                          new android.text.style.ForegroundColorSpan(color),
                          start,end,
                          android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                      );
                      sp.setSpan(
                          new android.text.style.StyleSpan(android.graphics.Typeface.BOLD),
                          start,end,
                          android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                      );
                  }
              }

              void styleMovimentiStoricoTextV3499(android.widget.TextView t){
                  if(t==null || !isMovimentiStoricoScreenV3499())return;
                  if(t instanceof android.widget.EditText)return;
                  if(t instanceof android.widget.Button)return;
                  CharSequence q=t.getText();
                  if(q==null)return;
                  String s=q.toString();
                  if(s.trim().isEmpty())return;

                  String low=s.toLowerCase(java.util.Locale.ROOT);
                  boolean relevant=
                      low.contains("capitale iniziale")
                      ||low.contains("titoli a fine anno")
                      ||low.contains("patrimonio finale")
                      ||low.contains("liquidità a fine anno")
                      ||low.contains("dividendi")
                      ||low.contains("cedole")
                      ||low.contains("proventi netti")
                      ||low.contains("ritenuta")
                      ||low.contains("tasse")
                      ||low.contains("costi fiscali")
                      ||low.contains("commission")
                      ||low.contains("imposta")
                      ||low.contains("p/l")
                      ||low.contains("plusvalenz")
                      ||low.contains("minusvalenz")
                      ||low.contains("risultato")
                      ||low.contains("rendimento")
                      ||low.contains("saveback")
                      ||low.contains("premio")
                      ||low.contains("round up")
                      ||low.contains("capitale proprio");

                  if(!relevant)return;

                  android.text.SpannableString sp=
                      new android.text.SpannableString(s);

                  sp.setSpan(
                      new android.text.style.ForegroundColorSpan(android.graphics.Color.WHITE),
                      0,sp.length(),
                      android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                  );

                  colorMatchesV3499(
                      sp,s,
                      "(Titoli\\s+a\\s+fine\\s+anno|Patrimonio\\s+finale)\\s*:\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(€)",
                      1
                  );

                  colorMatchesV3499(
                      sp,s,
                      "(Dividendi\\s+e\\s+cedole(?:\\s+lordi|\\s+incassati)?|Proventi\\s+netti|Recupero\\s+fiscale(?:\\s+minus)?|Premi/Saveback)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(€)",
                      1
                  );
                  colorMatchesV3499(
                      sp,s,
                      "(Saveback|Premio)[^0-9+\\-\\n]{0,60}([+\\-]?[0-9][0-9\\.,]*)\\s*(€)",
                      1
                  );

                  colorMatchesV3499(
                      sp,s,
                      "(Ritenuta\\s+26%\\s+sui\\s+proventi|Ritenuta\\s+su\\s+plusvalenza\\s*\\(26%\\)|Tasse\\s+trattenute\\s+sui\\s+proventi|Altri\\s+costi\\s+fiscali\\s+registrat[ei]|Commissioni)\\s*:\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(€)",
                      2
                  );
                  colorMatchesV3499(
                      sp,s,
                      "(commissioni|imposte)\\s+([+\\-]?[0-9][0-9\\.,]*)\\s*(€)",
                      2
                  );
                  colorMatchesV3499(
                      sp,s,
                      "(COMMISSIONE|IMPOSTA)(?:(?!\\n[0-9]{2}/[0-9]{2}/[0-9]{4}).){0,240}?([+\\-]?[0-9][0-9\\.,]*)\\s*(€)",
                      2
                  );

                  colorMatchesV3499(
                      sp,s,
                      "(P/L(?:\\s+realizzato)?(?:\\s+netto|\\s+lordo)?|Plusvalenze\\s+realizzate|Minusvalenze\\s+realizzate|Risultato\\s+complessivo|Risultato)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(€)",
                      3
                  );
                  colorMatchesV3499(
                      sp,s,
                      "(Rendimento(?:\\s+annuale)?)\\s*:?\\s*([+\\-]?[0-9][0-9\\.,]*)\\s*(%)",
                      3
                  );

                  t.setTextColor(android.graphics.Color.WHITE);
                  t.setText(sp);
                  t.setTypeface(
                      android.graphics.Typeface.DEFAULT,
                      android.graphics.Typeface.BOLD
                  );
              }
          '''

          req('isMovimentiStoricoScreenV3499' not in main,'FIX8.8 helper not already present')
          last=main.rfind('}')
          req(last>=0,'MainActivity closing brace')
          main=main[:last]+'\n'+helpers+'\n'+main[last:]

          replacement=r'''void styleGlobalSemanticTextV3483(android.widget.TextView t){
                  if(t==null)return;
                  styleDeterministicScreenTextV3492(t);
                  styleMovimentiStoricoTextV3499(t);
              }'''
          main=replace_method(
              main,
              'void styleGlobalSemanticTextV3483(android.widget.TextView t)',
              replacement
          )

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX8.8 applied: local semantic colors for Operazioni/Storico only')
          PYFIX88

      - name: Verify FIX8.8 FIX1
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 165' in g,'versionCode 165')
          req(
              'versionName "3.4.86-dev-fix10-fix8-8-fix1-movimenti-storico-semantic-colors"' in g,
              'FIX8.8 versionName'
          )
          req(
              'DEV 3.4.86 FIX10 FIX8.8 FIX1 MOVIMENTI STORICO COLORS' in s,
              'FIX8.8 visible label'
          )
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          for marker in [
              'boolean isMovimentiStoricoScreenV3499()',
              'void styleMovimentiStoricoTextV3499',
              'styleMovimentiStoricoTextV3499(t);',
              'Titoli\\\\s+a\\\\s+fine\\\\s+anno',
              'Patrimonio\\\\s+finale',
              'Proventi\\\\s+netti',
              'Ritenuta\\\\s+26%',
              'Tasse\\\\s+trattenute',
              'Altri\\\\s+costi\\\\s+fiscali',
              'COMMISSIONE|IMPOSTA',
              'P/L(?:\\\\s+realizzato)?',
              'Rendimento(?:\\\\s+annuale)?'
          ]:
              req(marker in s,'FIX8.8 marker '+marker)

          req(
              'if(Math.abs(n)<=0.0000001)return android.graphics.Color.WHITE;' in s,
              'zero values remain white'
          )
          req('if(mode==2)return C_RED;' in s,'taxes and fees non-zero red')
          req(
              'if(mode==3)return semanticSignedColorV3483(n);' in s,
              'signed results by sign'
          )

          for marker in [
              '"tassazione","tasse","costi/tasse","costi fiscali","altre tasse"',
              'compositionIncomeV3497',
              'boolean isTradeRepublicBrokerV3496',
              'grossPerformanceByDateTradeRepublicV3496',
              'performanceMapMonthV3496',
              'performanceMapYearV3496',
              'homeColorSessionV3493',
              'scheduleHomeColorsV3493',
              'applyHomeColorsV3493',
              'if(sc.contains("performance"))return false;'
          ]:
              req(marker in s,'preserved '+marker)

          for marker in [
              'repairTradeRepublicPricesV3477',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462',
              'Performance = proventi lordi + P/L realizzato lordo.'
          ]:
              req(marker in s or marker in d,'data protection '+marker)

          print('FIX8.8 verified')
          PYCHECK

      - name: Clean previous build outputs
        working-directory: android-project-v3460
        run: rm -rf app/build build

      - name: Build signed FIX8.8 FIX1 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle clean assembleRelease --no-daemon

      - name: Verify signed FIX8.8 FIX1 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "$BADGING" | grep -Fq "versionCode='165'"
          echo "$BADGING" | grep -Fq "versionName='3.4.86-dev-fix10-fix8-8-fix1-movimenti-storico-semantic-colors'"
          sha256sum "$APK"

      - name: Prepare final FIX8.8 FIX1 APK
        run: |
          mkdir -p release
          cp \
            android-project-v3460/app/build/outputs/apk/release/app-release.apk \
            release/Portafoglio2026-FIX8.8-FIX1-MOVIMENTI-STORICO-COLORS.apk
          sha256sum release/Portafoglio2026-FIX8.8-FIX1-MOVIMENTI-STORICO-COLORS.apk

      - name: Upload signed FIX8.8 FIX1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX8-8-FIX1-MOVIMENTI-STORICO-COLORS-SIGNED-APK
          path: release/Portafoglio2026-FIX8.8-FIX1-MOVIMENTI-STORICO-COLORS.apk
          if-no-files-found: error
