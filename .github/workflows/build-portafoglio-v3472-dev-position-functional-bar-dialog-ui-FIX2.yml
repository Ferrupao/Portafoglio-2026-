          def matching_brace(text, open_pos):
              depth=0;i=open_pos;ins=inc=lin=blk=False;esc=False
              while i<len(text):
                  c=text[i];n=text[i+1] if i+1<len(text) else ''
                  if lin:
                      if c=='\n': lin=False
                      i+=1; continue
                  if blk:
                      if c=='*' and n=='/': blk=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/': lin=True; i+=2; continue
                  if c=='/' and n=='*': blk=True; i+=2; continue
                  if c=='"': ins=True; i+=1; continue
                  if c=="'": inc=True; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

