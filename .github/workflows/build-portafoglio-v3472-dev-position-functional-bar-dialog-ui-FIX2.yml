name: Build Portafoglio 2026 V3.4.72 DEV Position Functional Bar & Dialog UI FIX2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui.yml"
      - ".github/workflows/build-portafoglio-v3471-dev-instrument-lifecycle-acc-div.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX4.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX3-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX3.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3469-dev-compact-bottom-spacing.yml"
      - ".github/workflows/build-portafoglio-v3468-dev-bottom-spacing-refine.yml"
      - ".github/workflows/build-portafoglio-v3467-dev-bottom-scroll-safety.yml"
      - ".github/workflows/build-portafoglio-v3466-dev-bottom-nav-final-fix-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3466-dev-bottom-nav-final-fix.yml"
      - ".github/workflows/build-portafoglio-v3465-dev-mobile-ui-fix.yml"
      - ".github/workflows/build-portafoglio-v3464-dev-global-cash-position-safety-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3456-full-bold-readability.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Extract V3.4.44 source
        run: |
          rm -rf android-project-v3460
          mkdir android-project-v3460
          unzip -q "portafoglio-v3444-dev.zip" -d android-project-v3460

      - name: Reuse proven V3.4.56 patch
        run: |
          python3 - <<'PY56'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/build-portafoglio-v3456-full-bold-readability.yml').read_text(encoding='utf-8')
          start_marker = "          cat > /tmp/make_v3456.py <<'PY'\n"
          end_marker = "\n          PY\n          python3 /tmp/make_v3456.py"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace('android-project-v3456', 'android-project-v3460')
          Path('/tmp/make_v3456_for_v3460.py').write_text(script, encoding='utf-8')
          print('Extracted proven V3.4.56 patch script for V3.4.64 FIX4 base')
          PY56
          python3 /tmp/make_v3456_for_v3460.py

      - name: Reuse proven V3.4.58 through V3.4.64 patches from FIX2
        shell: bash
        run: |
          python3 - <<'PYPATCHES'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow_path = Path('.github/workflows/build-portafoglio-v3464-dev-global-cash-position-safety-FIX2.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          patches = [
              ('make_v3458.py', 'PY58'),
              ('make_v3459.py', 'PY59'),
              ('make_v3460.py', 'PY60'),
              ('make_v3461.py', 'PY61'),
              ('make_v3462.py', 'PY62'),
              ('make_v3463.py', 'PY63'),
              ('make_v3464.py', 'PY64'),
          ]

          for filename, tag in patches:
              start_marker = f"          cat > /tmp/{filename} <<'{tag}'\n"
              end_marker = f"\n          {tag}\n          python3 /tmp/{filename}"
              start = workflow.index(start_marker) + len(start_marker)
              end = workflow.index(end_marker, start)
              script = textwrap.dedent(workflow[start:end])
              out = Path('/tmp') / filename
              out.write_text(script, encoding='utf-8')
              print(f'Running proven patch {filename}')
              subprocess.run(['python3', str(out)], check=True)

          print('FIX2 patch chain V3.4.58 -> V3.4.64 reused successfully')
          PYPATCHES

      - name: Verify V3.4.64 safety base before V3.4.65 UI patch
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/build-portafoglio-v3464-dev-global-cash-position-safety-FIX2.yml').read_text(encoding='utf-8')
          step_marker = '      - name: Verify V3.4.64 source\n'
          step_start = workflow.index(step_marker)
          run_marker = '        run: |\n'
          body_start = workflow.index(run_marker, step_start) + len(run_marker)
          next_step = workflow.index('\n      - name:', body_start)
          verify = textwrap.dedent(workflow[body_start:next_step])

          old_start = verify.index("python3 - <<'PY64CHECK'\n")
          old_end = verify.index('\nPY64CHECK', old_start) + len('\nPY64CHECK')

          robust = r'''python3 - <<'PY64CHECK'
          from pathlib import Path
          import re

          s=Path("android-project-v3460/app/src/main/java/it/portafoglio2026/v3/MainActivity.java").read_text(encoding="utf-8")
          d=Path("android-project-v3460/app/src/main/java/it/portafoglio2026/v3/DbHelper.java").read_text(encoding="utf-8")
          compact=lambda text: re.sub(r'\s+','',text)
          sc=compact(s)

          def require(label, condition):
              if not condition:
                  raise AssertionError(label)

          require('DB_VERSION must remain 17', re.search(r'DB_VERSION\s*=\s*17', d) is not None)
          require('baseline price ContentValues update missing', re.search(r'cv\.put\(\s*"price"\s*,\s*baseline\s*\[\s*i\s*\]\s*\)\s*;', s) is not None)
          require('current_value must be quantity * price', re.search(r'current_value\s*=\s*quantity\s*\*\s*price', s) is not None)
          require('portfolio cash must be forced to zero', 'UPDATEportfolio_statusSETcash=0,total_value=COALESCE(invested,0)' in sc)
          require('position delete recovery trigger missing', 'positions_archive_before_delete_v3464' in s)
          require('Trade Republic placeholder-14 trigger missing', 'positions_block_tr_placeholder14_v3464' in s)
          require('dashboard cash UI hook missing', re.search(r'applyDashboardCashUiV3464\s*\(\s*\)\s*;', s) is not None)
          require('home cash UI hook missing', re.search(r'applyHomeCashUiV3464\s*\(\s*\)\s*;', s) is not None)
          require('V3.4.63 bottom-nav protection missing', 'forceBottomNavLabelsV3463' in s)
          require('V3.4.62 historical UI protection missing', 'applyHistoricalUiSafetyV3462' in s)
          require('truncated Movimen visible setter must not exist', re.search(r'\.setText\(\s*"Movimen"\s*\)', s) is None)
          require('truncated Portafogl visible setter must not exist', re.search(r'\.setText\(\s*"Portafogl"\s*\)', s) is None)

          m1 = re.search(r'void\s+repairTradeRepublicPlaceholderPricesV3464\s*\(\s*\)\s*\{', s)
          require('Trade Republic repair method missing', m1 is not None)
          tail = s[m1.end():]
          m2 = re.search(r'void\s+applyDashboardCashUiV3464\s*\(\s*\)\s*\{', tail)
          require('Trade Republic repair method boundary missing', m2 is not None)
          repair = s[m1.start():m1.end()+m2.start()]
          repair_compact=compact(repair)
          require('Trade Republic repair must not overwrite quantity', 'cv.put("quantity"' not in repair_compact)
          require('Trade Republic repair must not overwrite PMC', 'cv.put("pmc"' not in repair_compact)
          require('Trade Republic repair safety comment missing', re.search(r'quantity\s+and\s+PMC\s+are\s+NEVER\s+overwritten', repair, re.I) is not None)

          print("V3.4.64 FIX4 semantic global cash / Trade Republic / recovery regression OK")
          PY64CHECK'''

          verify = verify[:old_start] + robust + verify[old_end:]

          # FIX4: the old FIX2 grep treated startsWith("Movimen") as a visible
          # truncated label. Keep the regression protection, but only reject
          # an actual UI setText("Movimen") assignment.
          old_movimen = '''if grep -Fq '\"Movimen\"' "$MAIN"; then
            echo "ERROR: truncated Movimen source label remains" >&2
            exit 1
          fi'''
          new_movimen = '''if grep -Fq 'setText(\"Movimen\")' "$MAIN"; then
            echo "ERROR: truncated Movimen visible label remains" >&2
            exit 1
          fi'''
          if old_movimen not in verify:
              raise RuntimeError('FIX4 could not locate obsolete Movimen grep')
          verify = verify.replace(old_movimen, new_movimen, 1)
          script = Path('/tmp/verify_v3464_fix3.sh')
          script.write_text('set -euo pipefail\n' + verify + '\n', encoding='utf-8')
          print('Prepared original FIX2 verifier with only PY64CHECK replaced by robust FIX4 checks')
          PYVERIFY
          bash /tmp/verify_v3464_fix3.sh

      - name: Patch V3.4.65 mobile UI layout
        shell: bash
        run: |
          python3 - <<'PY65'
          from pathlib import Path

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()

          assert 'versionCode 106' in gradle
          assert 'versionName "3.4.64-dev-global-cash-position-safety"' in gradle
          assert 'DEV 3.4.64' in main
          assert 'forceBottomNavLabelsV3463' in main
          assert 'applyDashboardCashUiV3464();' in main
          assert 'applyHomeCashUiV3464();' in main
          assert 'repairTradeRepublicPlaceholderPricesV3464' in main
          assert 'positions_archive_before_delete_v3464' in main
          assert 'positions_block_tr_placeholder14_v3464' in main

          gradle=gradle.replace('versionCode 106','versionCode 107',1)
          gradle=gradle.replace(
              'versionName "3.4.64-dev-global-cash-position-safety"',
              'versionName "3.4.65-dev-mobile-ui-fix"',
              1
          )
          main=main.replace('DEV 3.4.64','DEV 3.4.65')

          # Run the new mobile-layout pass whenever Dashboard/Home is rebuilt.
          main=main.replace(
              'applyDashboardCashUiV3464();',
              'applyDashboardCashUiV3464();\n                  applyMobileUiV3465();',
              1
          )
          main=main.replace(
              'applyHomeCashUiV3464();',
              'applyHomeCashUiV3464();\n                  applyMobileUiV3465();',
              1
          )

          def matching_brace(text, open_pos):
              depth=0;i=open_pos;in_str=in_char=in_line=in_block=False;esc=False
              while i<len(text):
                  c=text[i];n=text[i+1] if i+1<len(text) else ''
                  if in_line:
                      if c=='\n':in_line=False
                      i+=1;continue
                  if in_block:
                      if c=='*' and n=='/':in_block=False;i+=2;continue
                      i+=1;continue
                  if in_str:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':in_str=False
                      i+=1;continue
                  if in_char:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=="'":in_char=False
                      i+=1;continue
                  if c=='/' and n=='/':in_line=True;i+=2;continue
                  if c=='/' and n=='*':in_block=True;i+=2;continue
                  if c=='"':in_str=True;i+=1;continue
                  if c=="'":in_char=True;i+=1;continue
                  if c=='{':depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced Java braces')

          # Apply the real text-width fix each time the persistent bottom nav is refreshed.
          p=main.find('void fixBottomNavLabelsV3460()')
          if p<0: raise RuntimeError('fixBottomNavLabelsV3460 not found')
          o=main.find('{',p); c=matching_brace(main,o)
          nav_method=main[p:c+1]
          marker='forceBottomNavLabelsV3463(bottomNav);'
          if marker not in nav_method: raise RuntimeError('V3.4.63 bottom-nav hook not found')
          nav_method=nav_method.replace(marker,marker+'\n                  applyBottomNavMobileV3465();',1)
          main=main[:p]+nav_method+main[c+1:]

          helpers=r'''
              int dpV3465(float value){
                  return Math.round(value*getResources().getDisplayMetrics().density);
              }

              String normalizedUiTextV3465(CharSequence q){
                  if(q==null)return "";
                  return q.toString().replace('\n',' ').replaceAll("\\s+"," ").trim();
              }

              void applyBottomNavMobileV3465(){
                  if(bottomNav==null)return;
                  tuneBottomNavTreeV3465(bottomNav);
              }

              void tuneBottomNavTreeV3465(android.view.View v){
                  if(v instanceof android.widget.TextView){
                      android.widget.TextView t=(android.widget.TextView)v;
                      String s=normalizedUiTextV3465(t.getText());
                      boolean portfolios=s.startsWith("Portafog");
                      boolean movements=s.startsWith("Movimen");
                      boolean navLabel=portfolios||movements||"Home".equals(s)||"Proventi".equals(s)||"Altro".equals(s);
                      if(navLabel){
                          if(portfolios)t.setText("Portafogli");
                          else if(movements)t.setText("Movimenti");
                          t.setSingleLine(true);
                          t.setMaxLines(1);
                          t.setEllipsize(null);
                          t.setHorizontallyScrolling(false);
                          t.setIncludeFontPadding(false);
                          t.setGravity(android.view.Gravity.CENTER);
                          t.setPadding(0,t.getPaddingTop(),0,t.getPaddingBottom());
                          t.setMinWidth(0);
                          t.setMinimumWidth(0);
                          // Text scale changes the actual glyph width before clipping.
                          t.setScaleX(1f);
                          if(portfolios||movements){
                              t.setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP,8f);
                              t.setTextScaleX(0.76f);
                          }else{
                              t.setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP,9f);
                              t.setTextScaleX(0.94f);
                          }
                      }
                  }
                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      for(int i=0;i<g.getChildCount();i++)tuneBottomNavTreeV3465(g.getChildAt(i));
                  }
              }

              boolean dashboardActionV3465(String s){
                  return s.contains("Cerca titolo")||s.contains("Inserisci titolo")||
                         s.contains("Importa estratto conto")||s.contains("Aggiornamento manuale");
              }

              boolean containsDashboardActionV3465(android.view.View v){
                  if(v instanceof android.widget.TextView){
                      if(dashboardActionV3465(normalizedUiTextV3465(((android.widget.TextView)v).getText())))return true;
                  }
                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      for(int i=0;i<g.getChildCount();i++)if(containsDashboardActionV3465(g.getChildAt(i)))return true;
                  }
                  return false;
              }

              void tuneDashboardButtonsV3465(android.view.View v){
                  if(v instanceof android.widget.Button){
                      android.widget.Button b=(android.widget.Button)v;
                      String s=normalizedUiTextV3465(b.getText());
                      if(dashboardActionV3465(s)){
                          b.setAllCaps(false);
                          b.setSingleLine(false);
                          b.setMaxLines(2);
                          b.setEllipsize(null);
                          b.setHorizontallyScrolling(false);
                          b.setGravity(android.view.Gravity.CENTER);
                          b.setIncludeFontPadding(false);
                          b.setTextScaleX(0.96f);
                          b.setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP,s.contains("Cerca titolo")?15f:14f);
                          if(android.os.Build.VERSION.SDK_INT>=26){
                              b.setAutoSizeTextTypeUniformWithConfiguration(12,16,1,android.util.TypedValue.COMPLEX_UNIT_SP);
                          }
                          b.setPadding(dpV3465(8),dpV3465(8),dpV3465(8),dpV3465(8));
                          b.setMinHeight(dpV3465(58));
                          android.view.ViewGroup.LayoutParams lp=b.getLayoutParams();
                          if(lp!=null){
                              lp.height=android.view.ViewGroup.LayoutParams.WRAP_CONTENT;
                              b.setLayoutParams(lp);
                          }
                          android.view.ViewParent parent=b.getParent();
                          if(parent instanceof android.view.View){
                              android.view.View pv=(android.view.View)parent;
                              android.view.ViewGroup.LayoutParams plp=pv.getLayoutParams();
                              if(plp!=null&&plp.height>0&&plp.height<dpV3465(74)){
                                  plp.height=android.view.ViewGroup.LayoutParams.WRAP_CONTENT;
                                  pv.setLayoutParams(plp);
                              }
                              pv.setMinimumHeight(dpV3465(58));
                          }
                      }
                  }
                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      for(int i=0;i<g.getChildCount();i++)tuneDashboardButtonsV3465(g.getChildAt(i));
                  }
              }

              void padDashboardScrollableContentV3465(android.view.View v){
                  boolean scroll=(v instanceof android.widget.ScrollView)||v.getClass().getName().contains("NestedScrollView");
                  if(scroll&&containsDashboardActionV3465(v)){
                      int safeBottom=Math.max(v.getPaddingBottom(),dpV3465(96));
                      v.setPadding(v.getPaddingLeft(),v.getPaddingTop(),v.getPaddingRight(),safeBottom);
                      if(v instanceof android.view.ViewGroup)((android.view.ViewGroup)v).setClipToPadding(false);
                  }
                  if(v instanceof android.view.ViewGroup){
                      android.view.ViewGroup g=(android.view.ViewGroup)v;
                      for(int i=0;i<g.getChildCount();i++)padDashboardScrollableContentV3465(g.getChildAt(i));
                  }
              }

              void runMobileUiPassV3465(android.view.View root){
                  applyBottomNavMobileV3465();
                  tuneDashboardButtonsV3465(root);
                  padDashboardScrollableContentV3465(root);
              }

              void applyMobileUiV3465(){
                  final android.view.View root=findViewById(android.R.id.content);
                  if(root==null)return;
                  runMobileUiPassV3465(root);
                  root.post(new Runnable(){
                      @Override public void run(){runMobileUiPassV3465(root);}
                  });
                  root.postDelayed(new Runnable(){
                      @Override public void run(){runMobileUiPassV3465(root);}
                  },300);
              }
          '''

          last=main.rfind('}')
          if last<0: raise RuntimeError('MainActivity closing brace not found')
          main=main[:last]+helpers+'\n'+main[last:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          # V3.4.65 is UI-only: database source must be byte-for-byte untouched.
          assert db_path.read_bytes()==db_before
          print('V3.4.65 mobile UI layout patch applied; database untouched')
          PY65

      - name: Patch V3.4.66 bottom navigation final layout FIX2
        shell: bash
        run: |
          python3 - <<'PY66'
          from pathlib import Path

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()

          assert 'versionCode 107' in gradle
          assert 'versionName "3.4.65-dev-mobile-ui-fix"' in gradle
          assert 'DEV 3.4.65' in main
          assert 'void forceBottomNavLabelsV3463(android.view.View v)' in main
          assert 'void applyBottomNavMobileV3465()' in main
          assert 'positions_archive_before_delete_v3464' in main
          assert 'positions_block_tr_placeholder14_v3464' in main

          gradle=gradle.replace('versionCode 107','versionCode 108',1)
          gradle=gradle.replace(
              'versionName "3.4.65-dev-mobile-ui-fix"',
              'versionName "3.4.66-dev-bottom-nav-final-fix"',
              1
          )
          main=main.replace('DEV 3.4.65','DEV 3.4.66')

          def matching_brace(text, open_pos):
              depth=0;i=open_pos;in_str=in_char=in_line=in_block=False;esc=False
              while i<len(text):
                  c=text[i];n=text[i+1] if i+1<len(text) else ''
                  if in_line:
                      if c=='\n':in_line=False
                      i+=1;continue
                  if in_block:
                      if c=='*' and n=='/':in_block=False;i+=2;continue
                      i+=1;continue
                  if in_str:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':in_str=False
                      i+=1;continue
                  if in_char:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=="'":in_char=False
                      i+=1;continue
                  if c=='/' and n=='/':in_line=True;i+=2;continue
                  if c=='/' and n=='*':in_block=True;i+=2;continue
                  if c=='"':in_str=True;i+=1;continue
                  if c=="'":in_char=True;i+=1;continue
                  if c=='{':depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced Java braces')

          sig='void forceBottomNavLabelsV3463(android.view.View v)'
          p=main.find(sig)
          if p<0: raise RuntimeError('forceBottomNavLabelsV3463 not found')
          o=main.find('{',p); c=matching_brace(main,o)
          replacement=r'''void forceBottomNavLabelsV3463(android.view.View v){
                  if(v instanceof android.widget.TextView){
