name: Portafoglio 2026 V183 - Correzione PDF Directa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/PORTAFOGLIO-2026-V183-FIX-ESTRATTO-DIRECTA.yml
      
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Estrai sorgenti V183
        run: |
          python3 - <<'PYV183'
          import base64,hashlib,io,zipfile
          encoded=""""""
          data=base64.b64decode(encoded)
          assert hashlib.sha256(data).hexdigest()=="483bd9e7a7d8c32775d270b9f4906a56385d001cdf400178bdd351e00b45c24f", "Source archive mismatch"
          with zipfile.ZipFile(io.BytesIO(data)) as z: z.extractall("android-v183")
          PYV183
      - name: Ripristina firma originale
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          test -n "$GPG_PASSPHRASE"
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"
      - name: Compila release e app di verifica
        working-directory: android-v183
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease assembleDebug --no-daemon
      - name: Verifica firma e versione
        id: verify_apk
        run: |
          APK="android-v183/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > badging.txt
          grep -F "package: name='it.portafoglio2026.v32' versionCode='183' versionName='3.4.92-v183-directa-pdf-fix'" badging.txt
      - name: Prepara APK compilato
        if: success() && steps.verify_apk.outcome == 'success'
        run: |
          mkdir -p release
          cp android-v183/app/build/outputs/apk/release/app-release.apk release/Portafoglio2026-V183-FIX-DIRECTA.apk
          sha256sum release/Portafoglio2026-V183-FIX-DIRECTA.apk > release/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: success() && steps.verify_apk.outcome == 'success'
        with:
          name: Portafoglio2026-V183-FIX-DIRECTA-APK
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Portafoglio2026-V183-QA
          path: |
            android-test.txt
            android-logcat.txt
            badging.txt
            qa/
          if-no-files-found: warn
