              d=0;i=o;ins=inc=lin=blk=False;esc=False
              while i<len(t):
                  c=t[i];n=t[i+1] if i+1<len(t) else ''
                  if lin:
                      if c=='\n':lin=False
                      i+=1;continue
                  if blk:
                      if c=='*' and n=='/':blk=False;i+=2;continue
                      i+=1;continue
                  if ins:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':ins=False
                      i+=1;continue
                  if inc:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=="'":inc=False
                      i+=1;continue
                  if c=='/' and n=='/':lin=True;i+=2;continue
                  if c=='/' and n=='*':blk=True;i+=2;continue
                  if c=='"':ins=True;i+=1;continue
                  if c=="'":inc=True;i+=1;continue
                  if c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return i
                  i+=1
              raise RuntimeError("unbalanced")

          sig="String annualPdfSummaryV3459(int year)"
          p=s.find(sig); assert p>=0, sig
          o=s.find("{",p); c=matching(s,o)
          body=s[p:c+1]
          assert r'\\n' not in body, "literal \\\\n remains in "+sig
          assert r'\n' in body, "real Java newline escape missing in "+sig

          hist="boolean addHistoricalPerformanceSummaryV3459(int year)"
          hp=s.find(hist); assert hp>=0, hist
          ho=s.find("{",hp); hc=matching(s,ho)
          hbody=s[hp:hc+1]
          assert r'\\n' not in hbody, "literal \\\\n remains in historical Performance"

          assert "improveHomeHistoryReadabilityV3460();" in s
          assert "fixBottomNavLabelsV3460();" in s
          assert "Storico annuale aggregato: dettaglio mensile non disponibile." in s
          print("V3.4.62 UI formatting regression OK")
          PY60CHECK


          python3 - <<'PY'
          # Regression of the two 2025 Directa examples used to design the parser.
          import re
          def n(x): return float(x.replace('.', '').replace(',', '.'))
          patr = "TOTALE LIQUIDITA': 275,05\nTOTALE TITOLI EURO _____________________\n96.457,39"
          liq = re.search(r"TOTALE\s+LIQUIDITA['’]?\s*:?\s*([0-9\.]+,[0-9]{2})", patr, re.I|re.S).group(1)
          sec = re.search(r"TOTALE\s+TITOLI\s+EURO[\s_]*([0-9\.]+,[0-9]{2})", patr, re.I|re.S).group(1)
          assert round(n(liq)+n(sec),2)==96732.44
          costs = "Totale costi dei servizi prestati dalla Sim Perc. 3,36 % 2.441,19\nGiacenza media 72.542,75"
          total = re.search(r"Totale\s+costi\s+dei\s+servizi\s+prestati\s+dalla\s+Sim.*?Perc\.?\s*[0-9\.]+,[0-9]{2}\s*%\s*([0-9\.]+,[0-9]{2})", costs, re.I|re.S).group(1)
          avg = re.search(r"Giacenza\s+media\s+([0-9\.]+,[0-9]{2})", costs, re.I|re.S).group(1)
          assert n(total)==2441.19 and n(avg)==72542.75
          print('2025 PDF parser regression OK')
          PY

