name: Build Portafoglio 2026 V3.4.86 FIX10 FIX8.2 Trade Republic Date Performance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-2-trade-republic-date-performance.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-1-trade-republic-performance.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-portafogli-all-sections-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix7-home-all-sections-colors.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact FIX8.1 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-fix8-1-trade-republic-performance.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX8.1 workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                          continue
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact FIX8 PORTAFOGLI source',
              'Patch FIX8.1 Trade Republic Performance broker resolution'
          ]
          for target in wanted:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('FIX8.1 reconstructed')
          PYREPLAY

      - name: Patch FIX8.2 Trade Republic performance date formats
        shell: bash
        run: |
          python3 - <<'PYFIX82'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 158' in gradle,'FIX8.1 versionCode')
          req('DEV 3.4.86 FIX10 FIX8.1 TR PERFORMANCE' in main,'FIX8.1 visible label')

          gradle=gradle.replace('versionCode 158','versionCode 159',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix8-1-trade-republic-performance"',
              'versionName "3.4.86-dev-fix10-fix8-2-trade-republic-date-performance"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX8.1 TR PERFORMANCE',
              'DEV 3.4.86 FIX10 FIX8.2 TR DATE PERF'
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          # Root cause:
          # Trade Republic income rows are shown in Proventi with raw dates such as
          # 04/09/2026 and 01/09/2026. The current monthly Performance helper accepts
          # only ISO dates starting with 2026-, therefore those rows are discarded.
          sig='boolean incomeRowForYearMonth(Cursor c,int year,int month)'
          p=main.find(sig)
          req(p>=0,'incomeRowForYearMonth found')
          o=main.find('{',p)
          c=matching_brace(main,o)

          old=main[p:c+1]
          new=r'''boolean incomeRowForYearMonth(Cursor c,int year,int month){
                  int di=c.getColumnIndex("date"),mi=c.getColumnIndex("month");
                  if(di<0||c.isNull(di))return false;

                  String dt=c.getString(di);
                  if(dt==null)return false;
                  dt=dt.trim();

                  int parsedYear=0;
                  int parsedMonth=0;

                  // ISO: yyyy-MM-dd / yyyy/MM/dd
                  java.util.regex.Matcher iso=java.util.regex.Pattern.compile(
                      "^(\\d{4})[-/](\\d{1,2})[-/](\\d{1,2})"
                  ).matcher(dt);
                  if(iso.find()){
                      parsedYear=Integer.parseInt(iso.group(1));
                      parsedMonth=Integer.parseInt(iso.group(2));
                  }else{
                      // Italian/imported Trade Republic: dd/MM/yyyy or dd-MM-yyyy
                      java.util.regex.Matcher it=java.util.regex.Pattern.compile(
                          "^(\\d{1,2})[-/](\\d{1,2})[-/](\\d{4})"
                      ).matcher(dt);
                      if(it.find()){
                          parsedMonth=Integer.parseInt(it.group(2));
                          parsedYear=Integer.parseInt(it.group(3));
                      }
                  }

                  if(parsedYear!=year)return false;

                  if(month>0){
                      if(parsedMonth>0){
                          if(parsedMonth!=month)return false;
                      }else{
                          int cm=mi>=0&&!c.isNull(mi)?c.getInt(mi):0;
                          if(cm!=month)return false;
                      }
                  }
                  return true;
              }'''

          main=main[:p]+new+main[c+1:]

          # Make the Performance cost-date matcher tolerant to dd/MM/yyyy too,
          # without changing any accounting formulas.
          dmp='boolean dateMatchesPerformancePeriod(String date,int year,int month,String day)'
          q=main.find(dmp)
          if q>=0:
              qo=main.find('{',q)
              qc=matching_brace(main,qo)
              method=main[q:qc+1]
              # Only replace if the method still uses direct prefix/month parsing.
              replacement=r'''boolean dateMatchesPerformancePeriod(String date,int year,int month,String day){
                  if(date==null)return false;
                  String dt=date.trim();
                  int py=0,pm=0,pd=0;

                  java.util.regex.Matcher iso=java.util.regex.Pattern.compile(
                      "^(\\d{4})[-/](\\d{1,2})[-/](\\d{1,2})"
                  ).matcher(dt);
                  if(iso.find()){
                      py=Integer.parseInt(iso.group(1));
                      pm=Integer.parseInt(iso.group(2));
                      pd=Integer.parseInt(iso.group(3));
                  }else{
                      java.util.regex.Matcher it=java.util.regex.Pattern.compile(
                          "^(\\d{1,2})[-/](\\d{1,2})[-/](\\d{4})"
                      ).matcher(dt);
                      if(it.find()){
                          pd=Integer.parseInt(it.group(1));
                          pm=Integer.parseInt(it.group(2));
                          py=Integer.parseInt(it.group(3));
                      }
                  }

                  if(py!=year)return false;
                  if(month>0&&pm!=month)return false;
                  if(day!=null&&!day.trim().isEmpty()){
                      try{
                          int wanted=Integer.parseInt(day.replaceAll("[^0-9]",""));
                          if(wanted>0&&pd!=wanted)return false;
                      }catch(Exception ignored){}
                  }
                  return true;
              }'''
              main=main[:q]+replacement+main[qc+1:]
              print('Patched dateMatchesPerformancePeriod')
          else:
              print('dateMatchesPerformancePeriod not present; income date filter is the active path')

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX8.2 applied: ISO + Italian date formats supported in Performance')
          PYFIX82

      - name: Verify FIX8.2 Trade Republic date Performance
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 159' in g,'versionCode 159')
          req('versionName "3.4.86-dev-fix10-fix8-2-trade-republic-date-performance"' in g,'FIX8.2 versionName')
          req('DEV 3.4.86 FIX10 FIX8.2 TR DATE PERF' in s,'FIX8.2 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          p=s.find('boolean incomeRowForYearMonth(Cursor c,int year,int month)')
          req(p>=0,'incomeRowForYearMonth preserved')
          w=s[p:p+3500]
          req('"^(\\\\d{4})[-/](\\\\d{1,2})[-/](\\\\d{1,2})"' in w,'ISO dates supported')
          req('"^(\\\\d{1,2})[-/](\\\\d{1,2})[-/](\\\\d{4})"' in w,'Italian dates supported')
          req('parsedYear!=year' in w,'year filter preserved')
          req('parsedMonth!=month' in w,'month filter preserved')

          # Broker resolution from FIX8.1 must stay.
          for marker in [
              'String performanceBrokerV3495',
              'performanceBrokerV3495(brokerFilter())',
              'wanted.contains("traderepublic")'
          ]:
              req(marker in s,'FIX8.1 broker resolution preserved '+marker)

          # Performance crash protection stays.
          ps='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          pp=s.find(ps)
          req(pp>=0,'Performance cost engine preserved')
          perf=s[pp:pp+9000]
          req(
              'boolean total=(broker==null)||TOTAL.equals(broker);' in perf,
              'Performance Totale null-safe preserved'
          )

          # Home and Portafogli color work stays.
          for marker in [
              'homeColorSessionV3493',
              'portfoliosColorSessionV3494',
              'stylePortfoliosTextV3494',
              'stylePortfoliosKpiGroupV3494'
          ]:
              req(marker in s,'preserved '+marker)

          # Data/accounting safety remains.
          for marker in [
              'repairTradeRepublicPricesV3477',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('FIX8.2 verified: Trade Republic dd/MM/yyyy records now enter Performance')
          PYCHECK

      - name: Build signed FIX8.2 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed FIX8.2 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX8.2 signed APK verified"

      - name: Upload signed FIX8.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX8-2-TRADE-REPUBLIC-DATE-PERFORMANCE-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
