name: Build Portafoglio 2026 V3.4.86 FIX10 FIX8.1 Trade Republic Performance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-1-trade-republic-performance.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-portafogli-all-sections-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix7-home-all-sections-colors.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact FIX8 PORTAFOGLI source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          wf=Path('.github/workflows/build-portafoglio-v3486-dev-fix10-fix8-portafogli-all-sections-colors.yml')
          if not wf.exists():
              raise RuntimeError('Missing FIX8 PORTAFOGLI workflow')

          lines=wf.read_text(encoding='utf-8').splitlines()
          steps=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('      - name: '):
                  i+=1
                  continue
              name=lines[i][len('      - name: '):].strip()
              j=i+1
              script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1
                      block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '):
                              break
                          if raw.startswith('          '):
                              block.append(raw[10:])
                              k+=1
                              continue
                          if raw.strip()=='':
                              block.append('')
                              k+=1
                              continue
                          if raw.startswith('        '):
                              break
                          block.append(raw)
                          k+=1
                          continue
                      script='\n'.join(block)+'\n'
                      break
                  j+=1
              if script is not None:
                  steps.append((name,script))
              i=j if j>i else i+1

          wanted=[
              'Rebuild exact FIX7 HOME source',
              'Patch FIX8 PORTAFOGLI all sections colors'
          ]

          for target in wanted:
              for name,script in steps:
                  if name==target:
                      subprocess.run(
                          ['bash','-euo','pipefail','-c',script],
                          check=True,
                          env=os.environ.copy()
                      )
                      break
              else:
                  raise RuntimeError('Missing replay step: '+target)

          print('FIX8 PORTAFOGLI reconstructed')
          PYREPLAY

      - name: Patch FIX8.1 Trade Republic Performance broker resolution
        shell: bash
        run: |
          python3 - <<'PYFIX81'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db_before=db_path.read_bytes()
          db=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 157' in gradle,'FIX8 versionCode')
          req('versionName "3.4.86-dev-fix10-fix8-portafogli-all-sections-colors"' in gradle,'FIX8 versionName')
          req('DEV 3.4.86 FIX10 FIX8 PORTAFOGLI COLORS' in main,'FIX8 visible label')

          gradle=gradle.replace('versionCode 157','versionCode 158',1)
          gradle=gradle.replace(
              'versionName "3.4.86-dev-fix10-fix8-portafogli-all-sections-colors"',
              'versionName "3.4.86-dev-fix10-fix8-1-trade-republic-performance"',
              1
          )
          main=main.replace(
              'DEV 3.4.86 FIX10 FIX8 PORTAFOGLI COLORS',
              'DEV 3.4.86 FIX10 FIX8.1 TR PERFORMANCE'
          )

          def matching_brace(text,open_pos):
              depth=0
              ins=inc=esc=line=block=False
              i=open_pos
              while i<len(text):
                  c=text[i]
                  n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/':
                          block=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/':
                      line=True; i+=2; continue
                  if c=='/' and n=='*':
                      block=True; i+=2; continue
                  if c=='"':
                      ins=True; i+=1; continue
                  if c=="'":
                      inc=True; i+=1; continue
                  if c=='{':
                      depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return i
                  i+=1
              raise RuntimeError('Unbalanced braces')

          # Resolve the broker against the actual broker strings stored in finance tables.
          # This is intentionally Performance-only. It fixes names such as
          # "Trade Republic", "TradeRepublic", extra spaces or case differences.
          helpers=r'''
              // ===== FIX8.1 TRADE REPUBLIC PERFORMANCE BROKER RESOLUTION =====
              String performanceBrokerKeyV3495(String raw){
                  if(raw==null)return "";
                  return raw.toLowerCase(java.util.Locale.ROOT)
                      .replaceAll("[^a-z0-9]","");
              }

              String performanceBrokerV3495(String raw){
                  if(raw==null||TOTAL.equals(raw))return raw;
                  String wanted=performanceBrokerKeyV3495(raw);
                  if(wanted.length()==0)return raw;

                  android.database.sqlite.SQLiteDatabase r=db.getReadableDatabase();
                  String[][] sources=new String[][]{
                      {"income_records","broker"},
                      {"trade_records","broker"},
                      {"cost_records","broker"},
                      {"positions","broker"},
                      {"portfolios","name"}
                  };

                  for(String[] src:sources){
                      android.database.Cursor c=null;
                      try{
                          c=r.rawQuery(
                              "SELECT DISTINCT "+src[1]+" FROM "+src[0]+
                              " WHERE "+src[1]+" IS NOT NULL AND trim("+src[1]+")<>''",
                              null
                          );
                          while(c.moveToNext()){
                              String candidate=c.getString(0);
                              String key=performanceBrokerKeyV3495(candidate);
                              if(key.equals(wanted)){
                                  return candidate;
                              }
                              if(wanted.contains("traderepublic") &&
                                 key.contains("trade") &&
                                 key.contains("republic")){
                                  return candidate;
                              }
                          }
                      }catch(Exception ignored){
                      }finally{
                          if(c!=null)c.close();
                      }
                  }
                  return raw;
              }
          '''

          last=main.rfind('}')
          req(last>=0,'MainActivity closing brace')
          main=main[:last]+'\n'+helpers+'\n'+main[last:]

          # Patch ONLY the final four-argument Performance renderer.
          # Both Giorno/Mese/Anno routes eventually arrive here.
          rx=re.compile(
              r'(?m)^[ \t]*void\s+showPerformance\s*\(\s*int\s+\w+\s*,\s*int\s+\w+\s*,\s*int\s+\w+\s*,\s*String\s+\w+\s*\)\s*\{'
          )
          m=rx.search(main)
          req(m is not None,'four-argument showPerformance renderer found')
          o=main.find('{',m.start())
          c=matching_brace(main,o)
          body=main[m.start():c+1]

          req('brokerFilter()' in body,'Performance renderer uses brokerFilter()')
          body2=body.replace(
              'brokerFilter()',
              'performanceBrokerV3495(brokerFilter())'
          )
          req(body2!=body,'Performance broker canonicalization inserted')
          main=main[:m.start()]+body2+main[c+1:]

          # The cost/tax engine must use the same normalized broker semantics.
          sig='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          p=main.find(sig)
          req(p>=0,'performanceCostsForPeriod found')
          o=main.find('{',p)
          c=matching_brace(main,o)
          costs=main[p:c+1]

          old='String bwhere=total?"broker IN (SELECT name FROM portfolios WHERE active=1)":"broker=?";'
          new="""String bwhere=total?\"broker IN (SELECT name FROM portfolios WHERE active=1)\":\"lower(replace(replace(trim(COALESCE(broker,'')),' ',''),'-',''))=lower(replace(replace(trim(?),' ',''),'-',''))\";"""
          req(old in costs,'exact broker condition found in Performance cost engine')
          costs=costs.replace(old,new,1)

          main=main[:p]+costs+main[c+1:]

          main_path.write_text(main,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          if db_path.read_bytes()!=db_before:
              raise RuntimeError('DbHelper changed unexpectedly')

          print('FIX8.1 applied: Performance resolves Trade Republic against stored broker names')
          PYFIX81

      - name: Verify FIX8.1 Trade Republic Performance
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          def req(c,m):
              if not c:
                  raise RuntimeError(m)
              print('OK:',m)

          req('versionCode 158' in g,'versionCode 158')
          req('versionName "3.4.86-dev-fix10-fix8-1-trade-republic-performance"' in g,'FIX8.1 versionName')
          req('DEV 3.4.86 FIX10 FIX8.1 TR PERFORMANCE' in s,'FIX8.1 visible label')
          req(re.search(r'DB_VERSION\s*=\s*18',d) is not None,'DB18 unchanged')

          for marker in [
              'String performanceBrokerKeyV3495',
              'String performanceBrokerV3495',
              '{"income_records","broker"}',
              '{"trade_records","broker"}',
              '{"cost_records","broker"}',
              '{"positions","broker"}',
              '{"portfolios","name"}',
              'wanted.contains("traderepublic")',
              'performanceBrokerV3495(brokerFilter())'
          ]:
              req(marker in s,'TR Performance marker '+marker)

          # Aggregate/null-safe Performance must remain untouched.
          ps='double performanceCostsForPeriod(String broker,int year,int month,String day)'
          pp=s.find(ps)
          req(pp>=0,'Performance cost engine preserved')
          perf=s[pp:pp+8500]
          req(
              'boolean total=(broker==null)||TOTAL.equals(broker);' in perf,
              'Totale remains null-safe'
          )
          req(
              'broker IN (SELECT name FROM portfolios WHERE active=1)' in perf,
              'Totale aggregate branch preserved'
          )
          req(
              'lower(replace(replace(trim(COALESCE(broker' in perf,
              'individual broker matching normalized'
          )

          # Existing working screen-specific colors remain.
          for marker in [
              'homeColorSessionV3493',
              'portfoliosColorSessionV3494',
              'stylePortfoliosTextV3494',
              'stylePortfoliosKpiGroupV3494'
          ]:
              req(marker in s,'preserved '+marker)

          # Critical accounting/data protections remain.
          for marker in [
              'repairTradeRepublicPricesV3477',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'applyHistoricalUiSafetyV3462'
          ]:
              req(marker in s or marker in d,'preserved '+marker)

          print('FIX8.1 verified: Trade Republic Performance broker resolution only')
          PYCHECK

      - name: Build signed FIX8.1 APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed FIX8.1 APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "FIX8.1 signed APK verified"

      - name: Upload signed FIX8.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3486-FIX10-FIX8-1-TRADE-REPUBLIC-PERFORMANCE-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
