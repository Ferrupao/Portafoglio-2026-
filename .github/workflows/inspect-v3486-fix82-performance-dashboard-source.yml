name: Inspect V3.4.86 FIX8.2 Performance Dashboard Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-v3486-fix82-performance-dashboard-source.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-2-trade-republic-date-performance.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-1-trade-republic-performance.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-portafogli-all-sections-colors.yml"
      - ".github/workflows/build-portafoglio-v3486-dev-fix10-fix7-home-all-sections-colors.yml"
      - "portafoglio-v3444-dev.zip"

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild exact FIX8.2 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os
          import subprocess

          wf = Path(".github/workflows/build-portafoglio-v3486-dev-fix10-fix8-2-trade-republic-date-performance.yml")
          if not wf.exists():
              raise RuntimeError("Missing FIX8.2 workflow")

          lines = wf.read_text(encoding="utf-8").splitlines()
          steps = []
          i = 0

          while i < len(lines):
              if not lines[i].startswith("      - name: "):
                  i += 1
                  continue

              name = lines[i][len("      - name: "):].strip()
              j = i + 1
              script = None

              while j < len(lines) and not lines[j].startswith("      - name: "):
                  if lines[j] == "        run: |":
                      k = j + 1
                      block = []

                      while k < len(lines):
                          raw = lines[k]

                          if raw.startswith("      - name: "):
                              break

                          if raw.startswith("          "):
                              block.append(raw[10:])
                              k += 1
                              continue

                          if raw.strip() == "":
                              block.append("")
                              k += 1
                              continue

                          if raw.startswith("        "):
                              break

                          block.append(raw)
                          k += 1

                      script = "\n".join(block) + "\n"
                      break

                  j += 1

              if script is not None:
                  steps.append((name, script))

              i = j if j > i else i + 1

          wanted = [
              "Rebuild exact FIX8.1 source",
              "Patch FIX8.2 Trade Republic performance date formats",
          ]

          for target in wanted:
              for name, script in steps:
                  if name == target:
                      print(f"===== REPLAY {name} =====")
                      subprocess.run(
                          ["bash", "-euo", "pipefail", "-c", script],
                          check=True,
                          env=os.environ.copy(),
                      )
                      break
              else:
                  raise RuntimeError("Missing replay step: " + target)

          print("FIX8.2 source reconstructed successfully")
          PYREPLAY

      - name: Inspect Performance Dashboard data paths and color paths
        shell: bash
        run: |
          python3 - <<'PYINSPECT'
          from pathlib import Path
          import re

          root = Path("android-project-v3460")
          main_path = root / "app/src/main/java/it/portafoglio2026/v3/MainActivity.java"
          db_path = root / "app/src/main/java/it/portafoglio2026/v3/DbHelper.java"
          gradle_path = root / "app/build.gradle"

          main = main_path.read_text(encoding="utf-8")
          db = db_path.read_text(encoding="utf-8")
          gradle = gradle_path.read_text(encoding="utf-8")

          print("\n===== VERSION =====")
          for line in gradle.splitlines():
              if "versionCode " in line or "versionName " in line:
                  print(line)
          for line in main.splitlines():
              if "DEV 3.4.86" in line:
                  print(line)
          print("===== END VERSION =====\n")

          def matching_brace(text, open_pos):
              depth = 0
              in_str = False
              in_char = False
              in_line = False
              in_block = False
              esc = False
              i = open_pos

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if in_line:
                      if c == "\n":
                          in_line = False
                      i += 1
                      continue

                  if in_block:
                      if c == "*" and n == "/":
                          in_block = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_str:
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == '"':
                          in_str = False
                      i += 1
                      continue

                  if in_char:
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block = True
                      i += 2
                      continue

                  if c == '"':
                      in_str = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return i

                  i += 1

              raise RuntimeError("Unbalanced braces")

          def print_methods(label, text, pattern, multiple=False):
              pos = 0
              found = 0

              while True:
                  m = re.search(pattern, text[pos:], re.M)
                  if not m:
                      break

                  start = pos + m.start()
                  open_pos = text.find("{", start)
                  if open_pos < 0:
                      break

                  close_pos = matching_brace(text, open_pos)

                  print(f"\n===== {label} #{found + 1} =====")
                  print(text[start:close_pos + 1])
                  print(f"===== END {label} #{found + 1} =====")

                  found += 1
                  pos = close_pos + 1

                  if not multiple:
                      break

              if found == 0:
                  print(f"\n===== {label} NOT FOUND =====")

          # UI navigation/data screens.
          print_methods(
              "SHOW_DASHBOARD",
              main,
              r"^[ \t]*void\s+showDashboard\s*\([^)]*\)\s*\{",
              True,
          )

          print_methods(
              "SHOW_PERFORMANCE",
              main,
              r"^[ \t]*void\s+showPerformance\s*\([^)]*\)\s*\{",
              True,
          )

          # Core data-selection methods used by Performance / Proventi.
          for name, return_type in [
              ("brokerFilter", r"String"),
              ("incomeRowForYearMonth", r"boolean"),
              ("datedIncomeMonth", r"double"),
              ("datedIncomeCount", r"int"),
              ("datedKnownNet", r"double"),
              ("datedIncomeTaxes", r"double"),
              ("monthlyIncomeForYear", r"double\[\]"),
              ("scopeIncomeMonth", r"double"),
              ("performanceCostsForPeriod", r"double"),
              ("dateMatchesPerformancePeriod", r"boolean"),
              ("scopeIncomesForMonth", r"Cursor"),
          ]:
              print_methods(
                  "MAIN_" + name,
                  main,
                  rf"^[ \t]*{return_type}\s+{re.escape(name)}\s*\([^)]*\)\s*\{{",
                  True,
              )

          # Color engines that can override each other.
          for name in [
              "styleDeterministicScreenTextV3492",
              "styleHomeTextV3493",
              "styleHomeKpiGroupV3493",
              "stylePortfoliosTextV3494",
              "stylePortfoliosKpiGroupV3494",
              "portfoliosGroupModeV3494",
              "applyPortfoliosColorsV3494",
              "applyHomeColorsV3493",
          ]:
              print_methods(
                  "COLOR_" + name,
                  main,
                  rf"^[ \t]*(?:void|int|boolean|String|double)\s+{re.escape(name)}\s*\([^)]*\)\s*\{{",
                  True,
              )

          # DbHelper data methods.
          for name in [
              "incomes",
              "incomesActive",
              "sumIncome",
              "sumIncomeActive",
              "sumIncomeMonth",
              "sumIncomeMonthActive",
              "sumIncomeTaxes",
              "sumIncomeTaxesActive",
          ]:
              print_methods(
                  "DB_" + name,
                  db,
                  rf"^[ \t]*(?:Cursor|double|Double|int|long|String)\s+{re.escape(name)}\s*\([^)]*\)\s*\{{",
                  True,
              )

          # Exact call sites are essential to see whether Dashboard and Performance
          # use the same source or two different paths.
          print("\n===== CALL SITES =====")
          keys = [
              "showPerformance(",
              "datedIncomeMonth(",
              "scopeIncomeMonth(",
              "performanceCostsForPeriod(",
              "db.incomes(",
              "db.incomesActive(",
              "db.sumIncome",
              "brokerFilter()",
              "Valore titoli",
              "Valore attuale titoli",
              "Patrimonio totale",
              "Proventi netti",
          ]

          for no, line in enumerate(main.splitlines(), 1):
              if any(k in line for k in keys):
                  print(f"{no}: {line.rstrip()}")

          print("===== END CALL SITES =====")

          # Print compact schema/SQL references around income_records so we can
          # compare the exact broker/date columns used by the working Proventi path.
          print("\n===== DB income_records REFERENCES =====")
          for no, line in enumerate(db.splitlines(), 1):
              if "income_records" in line or "broker=?" in line or "month=?" in line:
                  print(f"{no}: {line.rstrip()}")
          print("===== END DB income_records REFERENCES =====")

          print("\nINSPECTION COMPLETE")
          PYINSPECT
