name: Build Portafoglio 2026 V3.4.75 DIAG Trade Republic Positions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3475-dev-trade-republic-diagnostics.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-home-wealth-diagnostics-FIX5.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX4.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX3.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX2-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync.yml"
      - ".github/workflows/build-portafoglio-v3473-dev-position-card-amount-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX4-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3471-dev-instrument-lifecycle-acc-div.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX4.yml"
      - ".github/workflows/build-portafoglio-v3464-dev-global-cash-position-safety-FIX2.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.74 FIX5 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          workflow_path=Path('.github/workflows/build-portafoglio-v3474-dev-home-wealth-diagnostics-FIX5.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing FIX5 workflow: {workflow_path}')

          lines=workflow_path.read_text(encoding='utf-8').splitlines()
          parsed=[]; i=0
          while i<len(lines):
              line=lines[i]
              if not line.startswith('      - name: '):
                  i+=1; continue
              name=line[len('      - name: '):].strip()
              j=i+1; script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1; block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '): break
                          if raw.startswith('          '):
                              block.append(raw[10:]); k+=1; continue
                          if raw.strip()=='':
                              block.append(''); k+=1; continue
                          if raw.startswith('        '): break
                          block.append(raw); k+=1
                      script='\n'.join(block)+'\n'; break
                  j+=1
              if script is not None: parsed.append((name,script))
              i=j if j>i else i+1

          start_name='Rebuild exact V3.4.74 FIX4 source'
          end_name='Verify V3.4.74 FIX5 diagnostics and regressions'
          started=False; reached=False
          for name,script in parsed:
              if name==start_name: started=True
              if not started: continue
              print(f'===== REPLAY {name} =====')
              subprocess.run(['bash','-euo','pipefail','-c',script],check=True,env=os.environ.copy())
              if name==end_name:
                  reached=True; break

          if not started or not reached:
              raise RuntimeError('Could not reconstruct exact FIX5 source')
          print('FIX5 source reconstructed successfully')
          PYREPLAY

      - name: Patch V3.4.75 Trade Republic diagnostics
        shell: bash
        run: |
          python3 - <<'PY3475'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          if 'versionCode 130' not in gradle:
              raise RuntimeError('FIX5 versionCode missing')
          if 'versionName "3.4.74-dev-home-wealth-diagnostics-fix5"' not in gradle:
              raise RuntimeError('FIX5 versionName missing')
          if 'DEV 3.4.74 FIX5 DIAG' not in main:
              raise RuntimeError('FIX5 visible label missing')
          if 'homeWealthDiagnosticsV3474Fix5' not in db:
              raise RuntimeError('FIX5 diagnostics missing')

          gradle=gradle.replace('versionCode 130','versionCode 131',1)
          gradle=gradle.replace(
              'versionName "3.4.74-dev-home-wealth-diagnostics-fix5"',
              'versionName "3.4.75-dev-trade-republic-diagnostics"',
              1
          )
          main=main.replace('DEV 3.4.74 FIX5 DIAG','DEV 3.4.75 TR DIAG')

          helper=r'''
              // V3475_TRADE_REPUBLIC_DIAGNOSTICS
              public String tradeRepublicDiagnosticsV3475(){
                  SQLiteDatabase r=getReadableDatabase();
                  StringBuilder sb=new StringBuilder();

                  Cursor c=r.rawQuery(
                      "SELECT COALESCE(isin,''),COALESCE(instrument,''),"+
                      "COALESCE(quantity,0),COALESCE(pmc,0),COALESCE(price,0),"+
                      "COALESCE(current_value,0),COALESCE(source_date,'') "+
                      "FROM positions "+
                      "WHERE lower(trim(COALESCE(broker,''))) LIKE '%trade%republic%' "+
                      "ORDER BY instrument,isin",
                      null
                  );

                  int n=0;
                  double totalCurrent=0,totalFormula=0,totalCost=0;
                  while(c.moveToNext()){
                      n++;
                      String isin=c.getString(0);
                      String instrument=c.getString(1);
                      double q=c.getDouble(2);
                      double pmc=c.getDouble(3);
                      double price=c.getDouble(4);
                      double current=c.getDouble(5);
                      String sourceDate=c.getString(6);
                      double formula=q*price;
                      double cost=q*pmc;

                      totalCurrent+=current;
                      totalFormula+=formula;
                      totalCost+=cost;

                      sb.append("[").append(n).append("] ")
                        .append(isin.isEmpty()?"(ISIN vuoto)":isin)
                        .append("\n").append(instrument)
                        .append("\nq.tà=").append(q)
                        .append(" | PMC=").append(pmc)
                        .append("\nprezzo=").append(price)
                        .append(" | current_value=").append(current)
                        .append("\nq.tà×prezzo=").append(formula)
                        .append(" | costo PMC=").append(cost)
                        .append("\nsource_date=").append(sourceDate)
                        .append("\n\n");
                  }
                  c.close();

                  sb.insert(0,
                      "Posizioni Trade Republic: "+n+
                      "\nTotale current_value: "+totalCurrent+
                      "\nTotale q.tà×prezzo: "+totalFormula+
                      "\nTotale costo da PMC: "+totalCost+
                      "\n\n"
                  );

                  return sb.toString();
              }
          '''
          last=db.rfind('}')
          if last<0:
              raise RuntimeError('DbHelper closing brace missing')
          db=db[:last]+'\n'+helper+'\n'+db[last:]

          anchor='        addPortfolioCompositionCard(null,totalValue,cash);'
          if anchor not in main:
              raise RuntimeError('Home composition anchor missing')

          ui=r'''
                  LinearLayout trDiag=card();
                  trDiag.addView(sectionTitle("Diagnostica Trade Republic • V3.4.75"));
                  trDiag.addView(muted(
                      "Dettaglio temporaneo delle posizioni Trade Republic salvate nel database.",
                      11
                  ));
                  trDiag.addView(financeText(
                      db.tradeRepublicDiagnosticsV3475(),
                      11,
                      C_TEXT,
                      true
                  ));
                  content.addView(trDiag);
          '''
          main=main.replace(anchor,ui+'\n'+anchor,1)

          main_path.write_text(main,encoding='utf-8')
          db_path.write_text(db,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          print('V3.4.75 Trade Republic diagnostics applied')
          PY3475

      - name: Verify V3.4.75 Trade Republic diagnostics and regressions
        shell: bash
        run: |
          python3 - <<'PY3475CHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          assert 'versionCode 131' in g
          assert 'versionName "3.4.75-dev-trade-republic-diagnostics"' in g
          assert 'DEV 3.4.75 TR DIAG' in s
          assert re.search(r'DB_VERSION\s*=\s*18',d)

          assert 'V3475_TRADE_REPUBLIC_DIAGNOSTICS' in d
          assert 'tradeRepublicDiagnosticsV3475' in d
          assert "lower(trim(COALESCE(broker,''))) LIKE '%trade%republic%'" in d
          assert 'Totale current_value:' in d
          assert 'Totale q.tà×prezzo:' in d
          assert 'Totale costo da PMC:' in d
          assert 'source_date=' in d
          assert 'Diagnostica Trade Republic • V3.4.75' in s
          assert 'db.tradeRepublicDiagnosticsV3475()' in s

          # This version is diagnostic-only: preserve current wealth calculation.
          assert 'homeOpenPositionsTotalV3474Fix4' in d
          assert 'double gross=db.sumIncomeActive("gross"),totalValue=db.homeOpenPositionsTotalV3474Fix4();' in s
          assert 'Double titlesValue=Double.valueOf(db.homeOpenPositionsTotalV3474Fix4());' in s

          for marker in [
              'V3474_FIX5_HOME_WEALTH_DIAGNOSTICS',
              'V3474_FIX4_DIRECT_OPEN_POSITION_HOME_TOTAL',
              'V3474_FIX2_NORMALIZED_BROKER_TOTALS',
              'V3474_FIX3_POSITION_FIRST_HOME_TOTAL',
              'V3473_POSITION_CARD_AMOUNT_COLORS',
              'V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'applyHistoricalUiSafetyV3462',
          ]:
              assert marker in s or marker in d, marker

          print('V3.4.75 verified: Trade Republic diagnostics only; DB18 and all prior safety intact')
          PY3475CHECK

      - name: Build signed V3.4.75 Trade Republic diagnostic APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.75 Trade Republic diagnostic APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "V3.4.75 Trade Republic diagnostic APK verified"

      - name: Upload signed V3.4.75 Trade Republic diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3475-TRADE-REPUBLIC-DIAGNOSTICS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
