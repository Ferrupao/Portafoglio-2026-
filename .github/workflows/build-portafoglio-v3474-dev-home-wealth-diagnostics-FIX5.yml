name: Build Portafoglio 2026 V3.4.74 FIX5 Home Wealth Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-portafoglio-v3474-dev-home-wealth-diagnostics-FIX5.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX4.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX3.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX2-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3474-dev-live-position-total-sync.yml"
      - ".github/workflows/build-portafoglio-v3473-dev-position-card-amount-colors-FIX1.yml"
      - ".github/workflows/build-portafoglio-v3472-dev-position-functional-bar-dialog-ui-FIX4-FIX2.yml"
      - ".github/workflows/build-portafoglio-v3471-dev-instrument-lifecycle-acc-div.yml"
      - ".github/workflows/build-portafoglio-v3470-dev-accounting-rules-italian-ui-FIX4.yml"
      - ".github/workflows/build-portafoglio-v3464-dev-global-cash-position-safety-FIX2.yml"
      - "portafoglio-v3444-dev.zip"
      - "portafoglio2026-v3413-release-ROTATED.p12.gpg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify signing secrets
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: |
          test -n "$GPG_PASSPHRASE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.PORTAFOGLIO_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/portafoglio2026-release.p12" \
            --decrypt "$GITHUB_WORKSPACE/portafoglio2026-v3413-release-ROTATED.p12.gpg"
          echo "b045f8e72ffa8d4be07b14cc572eecfcbee25b1f2a495250e1f6fa3865e28dd4  $GITHUB_WORKSPACE/portafoglio2026-release.p12" | sha256sum -c -
          chmod 600 "$GITHUB_WORKSPACE/portafoglio2026-release.p12"

      - name: Rebuild exact V3.4.74 FIX4 source
        shell: bash
        run: |
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, subprocess

          workflow_path=Path('.github/workflows/build-portafoglio-v3474-dev-live-position-total-sync-FIX4.yml')
          if not workflow_path.exists():
              raise RuntimeError(f'Missing FIX4 workflow: {workflow_path}')

          lines=workflow_path.read_text(encoding='utf-8').splitlines()
          parsed=[]; i=0
          while i<len(lines):
              line=lines[i]
              if not line.startswith('      - name: '):
                  i+=1; continue
              name=line[len('      - name: '):].strip()
              j=i+1; script=None
              while j<len(lines) and not lines[j].startswith('      - name: '):
                  if lines[j]=='        run: |':
                      k=j+1; block=[]
                      while k<len(lines):
                          raw=lines[k]
                          if raw.startswith('      - name: '): break
                          if raw.startswith('          '):
                              block.append(raw[10:]); k+=1; continue
                          if raw.strip()=='':
                              block.append(''); k+=1; continue
                          if raw.startswith('        '): break
                          block.append(raw); k+=1
                      script='\n'.join(block)+'\n'; break
                  j+=1
              if script is not None: parsed.append((name,script))
              i=j if j>i else i+1

          start_name='Rebuild exact V3.4.74 FIX3 source'
          end_name='Verify V3.4.74 FIX4 direct Home total and regressions'
          started=False; reached=False
          for name,script in parsed:
              if name==start_name: started=True
              if not started: continue
              print(f'===== REPLAY {name} =====')
              subprocess.run(['bash','-euo','pipefail','-c',script],check=True,env=os.environ.copy())
              if name==end_name:
                  reached=True; break

          if not started or not reached:
              raise RuntimeError('Could not reconstruct exact FIX4 source')
          print('FIX4 source reconstructed successfully')
          PYREPLAY

      - name: Patch V3.4.74 FIX5 diagnostic Home wealth card
        shell: bash
        run: |
          python3 - <<'PY3474FIX5'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          main_path=root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java'
          db_path=root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java'
          gradle_path=root/'app/build.gradle'

          main=main_path.read_text(encoding='utf-8')
          db=db_path.read_text(encoding='utf-8')
          gradle=gradle_path.read_text(encoding='utf-8')

          if 'versionCode 129' not in gradle:
              raise RuntimeError('FIX4 versionCode missing')
          if 'versionName "3.4.74-dev-live-position-total-sync-fix4"' not in gradle:
              raise RuntimeError('FIX4 versionName missing')
          if 'DEV 3.4.74 FIX4' not in main:
              raise RuntimeError('FIX4 visible label missing')
          if 'homeOpenPositionsTotalV3474Fix4' not in db:
              raise RuntimeError('FIX4 direct position total missing')

          gradle=gradle.replace('versionCode 129','versionCode 130',1)
          gradle=gradle.replace(
              'versionName "3.4.74-dev-live-position-total-sync-fix4"',
              'versionName "3.4.74-dev-home-wealth-diagnostics-fix5"',
              1
          )
          main=main.replace('DEV 3.4.74 FIX4','DEV 3.4.74 FIX5 DIAG')

          helper=r'''
              // V3474_FIX5_HOME_WEALTH_DIAGNOSTICS
              public String homeWealthDiagnosticsV3474Fix5(){
                  SQLiteDatabase r=getReadableDatabase();
                  StringBuilder sb=new StringBuilder();

                  Cursor c=r.rawQuery(
                      "SELECT COUNT(*),COALESCE(SUM(COALESCE(quantity,0)*COALESCE(price,0)),0) "+
                      "FROM positions WHERE COALESCE(quantity,0)>0",null
                  );
                  if(c.moveToFirst()){
                      sb.append("Posizioni aperte DB: ").append(c.getInt(0));
                      sb.append("\nSomma tutte q.tà×prezzo: ").append(c.getDouble(1));
                  }
                  c.close();

                  Cursor b=r.rawQuery(
                      "SELECT COALESCE(broker,'(vuoto)'),COUNT(*),"+
                      "COALESCE(SUM(COALESCE(quantity,0)*COALESCE(price,0)),0) "+
                      "FROM positions WHERE COALESCE(quantity,0)>0 "+
                      "GROUP BY COALESCE(broker,'(vuoto)') ORDER BY 1",null
                  );
                  sb.append("\n\nPer broker:");
                  while(b.moveToNext()){
                      sb.append("\n• ").append(b.getString(0))
                        .append(" | n=").append(b.getInt(1))
                        .append(" | valore=").append(b.getDouble(2));
                  }
                  b.close();

                  Cursor p=r.rawQuery(
                      "SELECT name,active FROM portfolios ORDER BY name",null
                  );
                  sb.append("\n\nPortafogli registrati:");
                  while(p.moveToNext()){
                      sb.append("\n• ").append(p.getString(0))
                        .append(" | active=").append(p.getInt(1));
                  }
                  p.close();

                  Cursor x=r.rawQuery(
                      "SELECT COALESCE(broker,''),COALESCE(isin,''),COALESCE(instrument,''),"+
                      "COALESCE(quantity,0),COALESCE(pmc,0),COALESCE(price,0),COALESCE(current_value,0) "+
                      "FROM positions WHERE isin=?",
                      new String[]{"CH1550424704"}
                  );
                  sb.append("\n\nCH1550424704:");
                  if(!x.moveToFirst()){
                      sb.append("\nNON TROVATO nella tabella positions");
                  }else{
                      do{
                          sb.append("\n• broker=[").append(x.getString(0)).append("]")
                            .append("\n  strumento=").append(x.getString(2))
                            .append("\n  quantità=").append(x.getDouble(3))
                            .append(" | PMC=").append(x.getDouble(4))
                            .append("\n  prezzo=").append(x.getDouble(5))
                            .append(" | current_value=").append(x.getDouble(6))
                            .append("\n  q.tà×prezzo=").append(x.getDouble(3)*x.getDouble(5));
                      }while(x.moveToNext());
                  }
                  x.close();

                  sb.append("\n\nFIX4 Home direct total: ")
                    .append(homeOpenPositionsTotalV3474Fix4());

                  return sb.toString();
              }
          '''
          last=db.rfind('}')
          if last<0:
              raise RuntimeError('DbHelper closing brace missing')
          db=db[:last]+'\n'+helper+'\n'+db[last:]

          anchor='        addPortfolioCompositionCard(null,totalValue,cash);'
          if anchor not in main:
              raise RuntimeError('Home composition anchor missing')

          diagnostic_ui=r'''
                  LinearLayout diagCard=card();
                  diagCard.addView(sectionTitle("Diagnostica patrimonio • FIX5"));
                  diagCard.addView(muted(
                      "Schermata temporanea: legge direttamente i dati salvati nel database del telefono.",
                      11
                  ));
                  diagCard.addView(financeText(
                      db.homeWealthDiagnosticsV3474Fix5(),
                      12,
                      C_TEXT,
                      true
                  ));
                  content.addView(diagCard);
          '''
          main=main.replace(anchor,diagnostic_ui+'\n'+anchor,1)

          main_path.write_text(main,encoding='utf-8')
          db_path.write_text(db,encoding='utf-8')
          gradle_path.write_text(gradle,encoding='utf-8')

          print('FIX5 diagnostic card applied')
          PY3474FIX5

      - name: Verify V3.4.74 FIX5 diagnostics and regressions
        shell: bash
        run: |
          python3 - <<'PY3474FIX5CHECK'
          from pathlib import Path
          import re

          root=Path('android-project-v3460')
          s=(root/'app/src/main/java/it/portafoglio2026/v3/MainActivity.java').read_text(encoding='utf-8')
          d=(root/'app/src/main/java/it/portafoglio2026/v3/DbHelper.java').read_text(encoding='utf-8')
          g=(root/'app/build.gradle').read_text(encoding='utf-8')

          assert 'versionCode 130' in g
          assert 'versionName "3.4.74-dev-home-wealth-diagnostics-fix5"' in g
          assert 'DEV 3.4.74 FIX5 DIAG' in s
          assert re.search(r'DB_VERSION\s*=\s*18',d)

          assert 'V3474_FIX5_HOME_WEALTH_DIAGNOSTICS' in d
          assert 'homeWealthDiagnosticsV3474Fix5' in d
          assert 'Posizioni aperte DB:' in d
          assert 'Somma tutte q.tà×prezzo:' in d
          assert 'Per broker:' in d
          assert 'Portafogli registrati:' in d
          assert 'CH1550424704' in d
          assert 'NON TROVATO nella tabella positions' in d
          assert 'FIX4 Home direct total:' in d

          assert 'Diagnostica patrimonio • FIX5' in s
          assert 'db.homeWealthDiagnosticsV3474Fix5()' in s

          # FIX5 must be diagnostics-only: preserve FIX4 logic untouched.
          assert 'homeOpenPositionsTotalV3474Fix4' in d
          assert 'double gross=db.sumIncomeActive("gross"),totalValue=db.homeOpenPositionsTotalV3474Fix4();' in s
          assert 'Double titlesValue=Double.valueOf(db.homeOpenPositionsTotalV3474Fix4());' in s
          assert 'Double cash=Double.valueOf(0.0);' in s

          # Preserve all important prior fixes.
          for marker in [
              'V3.4.74 FIX1:',
              'V3474_FIX2_NORMALIZED_BROKER_TOTALS',
              'V3474_FIX3_POSITION_FIRST_HOME_TOTAL',
              'V3473_POSITION_CARD_AMOUNT_COLORS',
              'V3472_FIX4_FIX2_IMMEDIATE_VISUAL_SYNC',
              'repairInvalidCapitalGainTaxesV3470Fix2',
              'positions_archive_before_delete_v3464',
              'positions_block_tr_placeholder14_v3464',
              'repairTradeRepublicPlaceholderPricesV3464',
              'applyHistoricalUiSafetyV3462',
          ]:
              assert marker in s or marker in d, marker

          print('FIX5 verified: diagnostic-only Home wealth card, DB18 and prior safety intact')
          PY3474FIX5CHECK

      - name: Build signed V3.4.74 FIX5 diagnostic APK
        working-directory: android-project-v3460
        env:
          PORTAFOGLIO_KEYSTORE_FILE: ${{ github.workspace }}/portafoglio2026-release.p12
          PORTAFOGLIO_KEYSTORE_PASSWORD: ${{ secrets.PORTAFOGLIO_KEYSTORE_PASSWORD }}
          PORTAFOGLIO_KEY_ALIAS: ${{ secrets.PORTAFOGLIO_KEY_ALIAS }}
          PORTAFOGLIO_KEY_PASSWORD: ${{ secrets.PORTAFOGLIO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed V3.4.74 FIX5 diagnostic APK
        run: |
          APK="android-project-v3460/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='it.portafoglio2026.v32'"
          echo "V3.4.74 FIX5 diagnostic APK verified"

      - name: Upload signed V3.4.74 FIX5 diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: Portafoglio2026-V3474-FIX5-HOME-WEALTH-DIAGNOSTICS-SIGNED-APK
          path: android-project-v3460/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
